# =============================================================================
# SERVICES DE BASE PARTAGES - PostgreSQL & Redis
# =============================================================================
#
# Ce fichier definit les services de base utilises par :
#   - docker-compose.dev.yml (environnement de dev complet)
#   - .devcontainer/docker-compose.sandbox.yml (sandbox Claude)
#
# IMPORTANT: Toute modification ici affecte les DEUX environnements.
# C'est volontaire pour garantir l'alignement des versions.
#
# Usage dans un compose :
#   include:
#     - path: infrastructure/docker/compose.services.yml
#       project_directory: .
#
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL avec pgvector
  # ---------------------------------------------------------------------------
  # NOTE: Le volume postgres-init.sql doit etre defini dans chaque compose
  # car le chemin relatif differe selon l'emplacement du fichier appelant.
  # ---------------------------------------------------------------------------
  postgres-base:
    image: pgvector/pgvector:0.8.6-pg16-bookworm@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=512MB
      -c work_mem=16MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  redis-base:
    image: redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
