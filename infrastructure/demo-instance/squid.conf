# Public-demo egress proxy (P2 boundary, Task 6).
#
# Default deny. The ONLY reachable destination is the exact code-reviewed
# provider hostname on port 443 — no IP literal, wildcard, or
# visitor-controlled destination. DNS answers are pinned per-request
# (rebinding protection via host verification) and access logs stay off.
http_port 3128

# Every host the enabled capabilities actually need, and nothing else.
#
# Narrower than the capabilities is not "safer", it is broken: the search
# agent is the demonstrator's headline feature and api.search.brave.com was
# missing, so every search would have failed. And tiktoken downloads its
# encoding on first use — without that host the token counter raises, which
# takes the WHOLE answer stream down with it (measured 2026-08-06: the first
# real message returned a stream_error).
#
# Wider is not free either. api.openai.com and api.anthropic.com sat here
# while nothing enabled called them: two more destinations a compromised
# process could reach, for no capability (measured 2026-08-07). Removed.
#
# This list is not maintained by hand any more: it is checked against the
# capability flags of `.env.demo-instance.example` by
# `tests/unit/test_demo_instance_capability_coherence.py`. Switching a
# capability ON without opening its host fails there, and so does leaving a
# host open that nothing enabled needs. Three files had drifted apart — the
# flags said dictation and speech were on, this file said 403 (measured
# 2026-08-07), and the microphone button did nothing.
#
#   api.deepseek.com                     every LLM type (DEMO_INSTANCE_LLM_PROVIDER)
#   generativelanguage.googleapis.com    embeddings: memory and interests
#   api.search.brave.com                 WEB_SEARCH_ENABLED
#   speech.platform.bing.com             VOICE_TTS_ENABLED (Edge, free, no key)
#   openaipublic.blob.core.windows.net   tiktoken's encoding, on first use
acl provider_hosts dstdomain api.deepseek.com generativelanguage.googleapis.com api.search.brave.com speech.platform.bing.com openaipublic.blob.core.windows.net
acl https_port port 443
acl CONNECT method CONNECT

# DNS rebinding protection: verify the Host header matches the connected
# destination for intercepted traffic.
host_verify_strict on

http_access allow CONNECT provider_hosts https_port
http_access deny all

access_log none
cache deny all
