# Public-demo OTLP collector (P2 boundary, Task 6).
#
# Receives OTLP from the public API on the internal observability network
# and exposes a Prometheus endpoint THERE only. No host port, no
# remote-write to any existing backend.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
