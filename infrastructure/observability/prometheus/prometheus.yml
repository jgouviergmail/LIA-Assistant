# Configuration Prometheus pour LIA
# Optimisé pour Raspberry Pi avec SSD NVMe (réduction I/O)
global:
  scrape_interval: 30s       # 15s -> 30s (2x moins de données)
  evaluation_interval: 30s   # 15s -> 30s
  external_labels:
    cluster: 'lia'
    environment: 'production'

# Configuration des Exemplars pour corrélation avec Tempo
# Permet de lier les métriques Prometheus aux traces distribuées
storage:
  exemplars:
    max_exemplars: 100000  # Max exemplars stored per series

# Alerting re-enabled 2026-07-10 (ADR-119) after the 2026-01-16 shutdown.
# Only the 14-alert core is loaded; the legacy alerts.yml (60 alerts) stays
# disabled until its thresholds are recalibrated (rendered values were
# corrupted — percentages above 100, see ADR-119).
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - 'alertmanager:9093'

rule_files:
  - "recording_rules.yml"
  - "alerts-core.yml"             # Minimal viable core (ADR-119)
  # - "alerts.yml"                # DISABLED - legacy, recalibrate before enabling (ADR-119)
  # - "rules/*.yml"               # DISABLED - legacy custom alert rules

# Configuration du scraping des métriques
scrape_configs:
  # Monitoring de Prometheus lui-même
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Monitoring de l'API LIA
  # Uses dedicated HTTP-only metrics server (port 9091) to avoid TLS
  # handshake issues between Docker containers (uvicorn serves HTTPS on 8000)
  - job_name: 'lia-api'
    scrape_interval: 30s    # 15s -> 30s
    scrape_timeout: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:9091']
        labels:
          service: 'api'
          app: 'lia'
    metric_relabel_configs:
      # Ajout de labels pour mieux identifier les métriques
      - source_labels: [__name__]
        regex: 'http_.*'
        target_label: 'metric_type'
        replacement: 'http'

  # Monitoring des conteneurs Docker via cAdvisor
  - job_name: 'cadvisor'
    scrape_interval: 60s    # 15s -> 60s (métriques containers moins critiques)
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          service: 'cadvisor'

  # Monitoring de PostgreSQL via postgres_exporter
  - job_name: 'postgresql'
    scrape_interval: 30s    # 15s -> 30s
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgresql'
          database: 'lia'

  # Monitoring de Redis via redis_exporter
  - job_name: 'redis'
    scrape_interval: 30s    # 15s -> 30s
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'

  # Monitoring host/system metrics via node_exporter
  # Provides disk space, filesystem, CPU, memory, network metrics
  - job_name: 'node'
    scrape_interval: 60s    # 15s -> 60s (métriques host moins urgentes)
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node'
          instance: 'docker-host'

  # ===== Alerting chain (ADR-119) =====

  # Alertmanager self-monitoring — feeds the AlertmanagerDown meta-alert
  - job_name: 'alertmanager'
    scrape_interval: 30s
    static_configs:
      - targets: ['alertmanager:9093']
        labels:
          service: 'alertmanager'

  # blackbox-exporter self-monitoring — feeds ObservabilityScrapeTargetMissing
  - job_name: 'blackbox'
    scrape_interval: 60s
    static_configs:
      - targets: ['blackbox-exporter:9115']
        labels:
          service: 'blackbox'

  # Backup sidecar health probe — feeds the BackupFailed alert.
  # The postgres-backup image bakes a healthcheck webhook on HEALTHCHECK_PORT
  # (8080): non-200 = last pg_dump failed, probe failure = sidecar down.
  - job_name: 'blackbox-backup'
    scrape_interval: 60s
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://postgres-backup:8080/']
        labels:
          service: 'backup'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 'blackbox-exporter:9115'

  # End-to-end public URL probe — feeds PublicEndpointDown / CertificateExpirySoon.
  # Targets come from a file_sd file rendered at container startup from
  # BLACKBOX_PUBLIC_PROBE_URL (.env) — the real domain is never committed
  # (open-source repo). Empty/missing variable = zero targets = probe disabled
  # (development default).
  - job_name: 'blackbox-public'
    scrape_interval: 60s
    metrics_path: /probe
    params:
      module: [http_2xx]
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/public_probe.yml
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 'blackbox-exporter:9115'

# Note: storage retention is configured via command-line flags in docker-compose
# --storage.tsdb.retention.time=15d
# --storage.tsdb.retention.size=10GB
