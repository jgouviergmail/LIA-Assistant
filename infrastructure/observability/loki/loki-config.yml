# Loki configuration for LIA
# Tuned for a Raspberry Pi on an NVMe SSD (fewer writes)
auth_enabled: false

# HTTP server
server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn  # Fewer internal logs

# Log ingestion
ingester:
  lifecycler:
    address: 127.0.0.1
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
    final_sleep: 0s
  # Where /ingester/prepare_shutdown leaves its marker; unset, Loki warned
  # at every boot that the endpoint would not work.
  shutdown_marker_path: /loki
  # SSD-friendly: bigger chunks, fewer writes
  chunk_idle_period: 2h        # 1h -> 2h (fewer flushes)
  max_chunk_age: 2h            # 1h -> 2h
  chunk_target_size: 2097152   # 1MB -> 2MB (bigger chunks)
  chunk_retain_period: 1m      # 30s -> 1m
  # WAL off to reduce writes (acceptable on a single node)
  wal:
    enabled: false
    dir: /loki/wal

# Index schema
schema_config:
  configs:
    # Keep v11 for historical data (before schema upgrade)
    - from: 2024-01-01
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h
    # New v13 schema with tsdb (required for structured metadata)
    - from: 2025-11-07
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Storage
storage_config:
  # Legacy boltdb-shipper for v11 schema (historical data)
  boltdb_shipper:
    active_index_directory: /loki/boltdb-shipper-active
    cache_location: /loki/boltdb-shipper-cache
    cache_ttl: 24h
  # TSDB for v13 schema (new data with structured metadata)
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache
  filesystem:
    directory: /loki/chunks

# Limits
limits_config:
  # Log retention: 7 days
  retention_period: 168h

  # Enable structured metadata for better log correlation (requires Loki 2.8+)
  allow_structured_metadata: true

  # Ingestion limits (raised for dev with Promtail)
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  max_streams_per_user: 10000
  max_global_streams_per_user: 10000

  # Query limits
  max_query_length: 721h
  max_query_parallelism: 32
  max_entries_limit_per_query: 5000
  max_streams_matchers_per_query: 1000
  max_concurrent_tail_requests: 10

  # Chunk limits
  max_chunks_per_query: 2000000
  max_query_series: 500

  # Split queries
  split_queries_by_interval: 15m

  # Reject old samples
  reject_old_samples: true
  reject_old_samples_max_age: 168h

  # Per-stream rate limits
  per_stream_rate_limit: 3MB
  per_stream_rate_limit_burst: 15MB

# Query results cache: a dashboard refreshed every five minutes over seven days
# recomputes the split that moved, not the week. Nothing was cached before
# (measured 2026-10-03: one 7-day panel query reads up to 300 MB of logs).
# Results younger than max_cache_freshness_per_query (10m) are never cached.
query_range:
  cache_results: true
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 64
        ttl: 24h

# Compactor (automatic clean-up)
# SSD-friendly: less frequent compaction
compactor:
  working_directory: /loki/boltdb-shipper-compactor
  compaction_interval: 30m    # 10m -> 30m (less I/O)
  retention_enabled: true
  retention_delete_delay: 4h  # 2h -> 4h (batched deletions)
  retention_delete_worker_count: 50  # 150 -> 50 (less aggressive)
  delete_request_store: filesystem

# Table manager (index tables)
table_manager:
  retention_deletes_enabled: true
  retention_period: 168h

# Ruler (log-based alerts)
ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp
  alertmanager_url: http://alertmanager:9093
  ring:
    kvstore:
      store: inmemory
  enable_api: true
  enable_alertmanager_v2: true

# Analytics
analytics:
  reporting_enabled: false

# Cluster members
memberlist:
  join_members:
    - loki:7946
  bind_port: 7946
