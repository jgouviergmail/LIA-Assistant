# Configuration Promtail pour LIA
# Collecte les logs Docker, parse le JSON structlog, extrait les labels et envoie vers Loki
# Optimisé pour Raspberry Pi avec SSD NVMe (réduction I/O)

server:
  http_listen_port: 9080
  grpc_listen_port: 0
  log_level: warn  # info -> warn (moins de logs internes)

# Position de sauvegarde (évite la perte de logs en cas de restart)
positions:
  filename: /tmp/positions.yaml

# Client Loki
clients:
  - url: http://loki:3100/loki/api/v1/push
    # SSD-friendly: batching plus agressif (moins d'écritures)
    batchwait: 5s          # 1s -> 5s (batch plus de logs avant envoi)
    batchsize: 2097152     # 1MB -> 2MB (batches plus gros)
    # Retry en cas d'échec
    backoff_config:
      min_period: 1s       # 500ms -> 1s
      max_period: 5m
      max_retries: 10
    # Timeout
    timeout: 10s

# Configuration de scraping des logs Docker
scrape_configs:
  # Scraping des logs de tous les conteneurs Docker
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project=lia"]

    # Pipeline de traitement des logs
    pipeline_stages:
      # Stage 1: Extraction des labels Docker
      - docker: {}

      # Stage 1bis: a URL's credentials never reach Loki, whatever wrote the line.
      #
      # The API's PII filter masks them in its own lines, but every OTHER container
      # writes raw text: while the API restarts, Next.js logs « Failed to proxy
      # <url> » with the proxied request's whole query string — the Pub/Sub
      # webhook's `?token=` among them (322 production lines in a week, deleted
      # from Loki on 2026-09-25, ADR-317). Only the VALUE is replaced, on a `?`/`&`
      # boundary, exactly as `sanitize_url_query` does: the parameter names are
      # `_SENSITIVE_QUERY_PARAMS` (credentials and coordinates), held equal by
      # apps/api/tests/unit/test_promtail_query_redaction_guard.py. The value also
      # stops at a backslash: the API's lines arrive JSON-escaped, and eating the
      # `\` of an escaped quote would break the line's JSON.
      - replace:
          expression: '(?i)[?&](?:token|access_token|refresh_token|id_token|code|code_verifier|code_challenge|secret|client_secret|password|passwd|pwd|api_key|apikey|key|appid|state|sig|signature|session|sessionid|jwt|authorization|lat|lng|lon|latitude|longitude|origin|dest|destination)=([^&\s#"''\\]+)'
          replace: '[REDACTED]'

      # Stage 2: Parsing JSON (logs structlog de l'API)
      #
      # On extrait UNIQUEMENT ce que les stages suivants consomment : l'horodatage
      # (stage 3) et le niveau (seul label promu, stage 4). Extraire un champ qui
      # ne devient ni label ni timestamp coutait du CPU par ligne sur le Pi sans
      # rien apporter : la ligne complete est transmise telle quelle, donc TOUT le
      # payload reste interrogeable a la lecture via `| json` — y compris les
      # champs qui etaient extraits ici (run_id, user_id, trace_id, cost_usd,
      # error, exception...).
      - json:
          expressions:
            timestamp: timestamp
            level: level

      # Stage 3: Extraction du timestamp ISO8601
      - timestamp:
          source: timestamp
          format: RFC3339Nano
          fallback_formats:
            - RFC3339
            - "2006-01-02T15:04:05.999999999Z07:00"

      # Stage 4: Labels Loki (INDEXES — a garder bornes)
      #
      # Un label multiplie les STREAMS que Loki garde en memoire : les streams
      # sont le produit cartesien des valeurs de labels. Promouvoir un champ dont
      # l'ensemble de valeurs est ouvert n'est pas « plus cherchable », c'est un
      # OOM differe. Mesure prod 2026-08-05 avant ce correctif :
      #   event    -> 1416 valeurs distinctes
      #   logger   ->  140
      #   trace_id ->  107, et une par requete : non borne par construction
      #   loki_ingester_memory_streams -> 771, en croissance
      # avec QUATRE OOM kernel du conteneur Loki sur la semaine auditee, dont
      # deux declenches par une seule requete de 7 jours : l'outil s'effondrait
      # au moment precis ou l'on en avait besoin.
      #
      # Ces champs restent parfaitement interrogeables au moment de la LECTURE,
      # sans creer de stream :
      #   {container="lia-api-prod"} | json | event="chat_run_started"
      #   {container="lia-api-prod"} | json | logger=~".*agents.*"
      #
      # Politique tenue par apps/api/tests/unit/test_promtail_label_cardinality_guard.py.
      - labels:
          # Seul champ du payload promu : 4 valeurs, ensemble ferme.
          level: level

      # Stage 5: Ajout de labels statiques
      - static_labels:
          job: api

      # Stage 5bis: a URL's search text is withheld above DEBUG, like the API's own
      # lines (`_CONTENT_QUERY_PARAMS`: `?q=`, `$search=`…). A line with no level
      # (Next.js, every non-structlog container) is treated as above DEBUG.
      - match:
          selector: '{job="api", level!="debug"}'
          stages:
            - replace:
                expression: '(?i)[?&](?:q|query|search|search_query|srsearch|\$search|\$filter|input|text|textquery|keyword|keywords|term|terms|titles|name|address|prompt|question|subject|body)=([^&\s#"''\\]+)'
                replace: '[REDACTED]'

      # Pas de stage `output` : il REMPLACE la ligne par un seul champ. Avec
      # `source: message`, toute entree structlog portant une cle `message`
      # arrivait dans Loki depouillee de son JSON — l'audit les a d'abord prises
      # pour des `print()` egares dans le code. Un pipeline ne detruit pas la
      # charge utile qu'il transporte.

    # Relabeling pour enrichissement
    relabel_configs:
      # Extraction du nom du conteneur
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'

      # Environment dérivé du suffixe du nom de conteneur (-prod / -dev).
      # Le label statique `environment` a été retiré du pipeline (stage 5) au profit
      # de cette dérivation : un seul fichier partagé dev/prod, valeur correcte par conteneur.
      # Conteneurs sans suffixe -prod/-dev (ex. lia-ssl-init) : pas de label environment.
      - source_labels: ['__meta_docker_container_name']
        regex: '.*-prod'
        target_label: 'environment'
        replacement: 'production'
      - source_labels: ['__meta_docker_container_name']
        regex: '.*-dev'
        target_label: 'environment'
        replacement: 'development'

      # Extraction du service depuis les labels Docker Compose
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'

      # Extraction du projet Docker Compose
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'project'

      # Drop des conteneurs non-API (optionnel: garder tous pour observabilité complète)
      # - source_labels: ['service']
      #   regex: 'api'
      #   action: keep

  # Scraping des logs système Promtail (auto-monitoring)
  - job_name: promtail
    static_configs:
      - targets:
          - localhost
        labels:
          job: promtail
          __path__: /var/log/promtail.log

# Limites pour éviter la surcharge
limits_config:
  # Limite de débit (évite DoS si logs excessifs)
  readline_rate: 10000
  readline_burst: 20000

  # Limite taille ligne (logs très longs)
  max_line_size: 256KB
  max_line_size_truncate: true

# Configuration du serveur
# SSD-friendly: sync moins fréquent
target_config:
  sync_period: 30s  # 10s -> 30s (moins de syncs disque)
