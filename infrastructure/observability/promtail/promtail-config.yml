# Log collection pipeline, in Promtail's format, run by Grafana Alloy
# (`alloy run --config.format=promtail`, the `promtail` service of the compose
# files): Promtail reached end of life on 2026-03-02.
#
# Only what Alloy's converter turns into a component belongs here. Alloy keeps
# its positions under its own --storage.path and takes its listen address as a
# flag, so there is no `positions` and no `server` block (a `server` log level
# does not convert: Alloy logs at info). Nor is there any file job: the
# converter imports Promtail's legacy positions file into a file source, and
# Alloy then rewrote those 30,944 stale entries on every save — about 200 MB
# allocated each time, measured on dev on 2026-10-02 — for a
# /var/log/promtail.log that never existed and never shipped a line.

clients:
  - url: http://loki:3100/loki/api/v1/push
    # SSD-friendly: larger, less frequent batches (fewer writes).
    batchwait: 5s
    batchsize: 2097152
    backoff_config:
      min_period: 1s
      max_period: 5m
      max_retries: 10
    timeout: 10s

scrape_configs:
  # Every container of the compose project.
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project=lia"]

    pipeline_stages:
      # Stage 1: the Docker envelope.
      - docker: {}

      # Stage 1bis: a URL's credentials never reach Loki, whatever wrote the line.
      #
      # The API's PII filter masks them in its own lines, but every OTHER container
      # writes raw text: while the API restarts, Next.js logs « Failed to proxy
      # <url> » with the proxied request's whole query string — the Pub/Sub
      # webhook's `?token=` among them (322 production lines in a week, deleted
      # from Loki on 2026-09-25, ADR-317). Only the VALUE is replaced, on a `?`/`&`
      # boundary, exactly as `sanitize_url_query` does: the parameter names are
      # `_SENSITIVE_QUERY_PARAMS` (credentials and coordinates), held equal by
      # apps/api/tests/unit/test_promtail_query_redaction_guard.py. The value also
      # stops at a backslash: the API's lines arrive JSON-escaped, and eating the
      # `\` of an escaped quote would break the line's JSON.
      - replace:
          expression: '(?i)[?&](?:token|access_token|refresh_token|id_token|code|code_verifier|code_challenge|secret|client_secret|password|passwd|pwd|api_key|apikey|key|appid|state|sig|signature|session|sessionid|jwt|authorization|lat|lng|lon|latitude|longitude|origin|dest|destination)=([^&\s#"''\\]+)'
          replace: '[REDACTED]'

      # Stage 2: JSON parsing (the API's structlog lines).
      #
      # Only what the next stages consume is extracted: the timestamp (stage 3)
      # and the level (the one promoted label, stage 4). Extracting a field that
      # becomes neither a label nor the timestamp cost CPU per line on the Pi for
      # nothing: the whole line is shipped as written, so EVERY field of the
      # payload stays queryable at read time through `| json` — the ones once
      # extracted here included (run_id, user_id, trace_id, cost_usd, error,
      # exception...).
      - json:
          expressions:
            timestamp: timestamp
            level: level

      # Stage 3: the ISO 8601 timestamp.
      - timestamp:
          source: timestamp
          format: RFC3339Nano
          fallback_formats:
            - RFC3339
            - "2006-01-02T15:04:05.999999999Z07:00"

      # Stage 4: Loki labels (INDEXED — keep them bounded).
      #
      # A label multiplies the STREAMS Loki keeps in memory: streams are the
      # cartesian product of label values. Promoting a field whose value set is
      # open is not "more searchable", it is a deferred OOM. Measured in
      # production on 2026-08-05, before this fix:
      #   event    -> 1416 distinct values
      #   logger   ->  140
      #   trace_id ->  107, one per request: unbounded by construction
      #   loki_ingester_memory_streams -> 771, and climbing
      # with FOUR kernel OOM kills of the Loki container over the audited week,
      # two of them triggered by a single 7-day query: the tool collapsed at the
      # exact moment it was needed.
      #
      # Those fields stay perfectly queryable at READ time, without a stream:
      #   {container="lia-api-prod"} | json | event="chat_run_started"
      #   {container="lia-api-prod"} | json | logger=~".*agents.*"
      #
      # Policy held by apps/api/tests/unit/test_promtail_label_cardinality_guard.py.
      - labels:
          # The one promoted payload field: 4 values, a closed set.
          level: level

      # Stage 5: static labels.
      - static_labels:
          job: api

      # Stage 5bis: a URL's search text is withheld above DEBUG, like the API's own
      # lines (`_CONTENT_QUERY_PARAMS`: `?q=`, `$search=`…). A line with no level
      # (Next.js, every non-structlog container) is treated as above DEBUG.
      - match:
          selector: '{job="api", level!="debug"}'
          stages:
            - replace:
                expression: '(?i)[?&](?:q|query|search|search_query|srsearch|\$search|\$filter|input|text|textquery|keyword|keywords|term|terms|titles|name|address|prompt|question|subject|body)=([^&\s#"''\\]+)'
                replace: '[REDACTED]'

      # No `output` stage: it REPLACES the line with a single field. With
      # `source: message`, every structlog entry carrying a `message` key reached
      # Loki stripped of its JSON — the audit first read those lines as stray
      # `print()` calls in the code. A pipeline does not destroy the payload it
      # carries.

    relabel_configs:
      # The container's name.
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'

      # The environment, derived from the container name's suffix (-prod / -dev)
      # rather than a static label: one file shared by dev and prod, the right
      # value per container. A container with neither suffix (e.g. lia-ssl-init)
      # gets no environment label.
      - source_labels: ['__meta_docker_container_name']
        regex: '.*-prod'
        target_label: 'environment'
        replacement: 'production'
      - source_labels: ['__meta_docker_container_name']
        regex: '.*-dev'
        target_label: 'environment'
        replacement: 'development'

      # The Docker Compose service and project.
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: 'project'

limits_config:
  # A longer line is truncated, never dropped. Alloy truncates FIRST, before
  # the redaction stages: a cut JSON line no longer parses, so it carries no
  # level and gets the content redaction as well — more masking, never less.
  max_line_size: 256KB
  max_line_size_truncate: true
