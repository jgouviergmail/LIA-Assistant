# Grafana configuration for LIA
# Documentation: https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/

[server]
# HTTP server
http_port = 3000
domain = localhost
root_url = %(protocol)s://%(domain)s:%(http_port)s/

[paths]
# Data, logs and provisioning paths
data = /var/lib/grafana
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning

[analytics]
# Grafana telemetry off
reporting_enabled = false
check_for_updates = true

[security]
# Credentials are set via environment variables in docker-compose:
#   GF_SECURITY_ADMIN_USER / GF_SECURITY_ADMIN_PASSWORD
# No defaults here — forces explicit configuration per environment.

[users]
# No self sign-up, no organisation creation
allow_sign_up = false
allow_org_create = false
# Profile edits
viewers_can_edit = false
editors_can_admin = false

[auth.anonymous]
# Anonymous read-only access (optional, for a demo)
enabled = false

[dashboards]
# Home dashboard and refresh floor
default_home_dashboard_path = /var/lib/grafana/dashboards/01-app-overview.json
min_refresh_interval = 5s

[dataproxy]
# Datasource request timeout
timeout = 300
keep_alive_seconds = 300

[explore]
# Explore tab
enabled = true

[unified_alerting]
# Alerting (Grafana 11.3+)
enabled = true
execute_alerts = true

[log]
mode = console
level = info

[log.console]
format = json

[metrics]
# Grafana's own metrics (exposed on /metrics)
enabled = true
basic_auth_username =
basic_auth_password =

# No [tracing.opentelemetry.otlp]: Grafana does not trace itself into Tempo.
# It did until 2026-10-03, for a trace ↔ metric correlation that only the
# API's traces carry — and its own spans (session opens, the provisioning poll,
# access-control checks) were 59 % of everything Tempo stored. To debug a slow
# Grafana, set `address = tempo:4317` under that section for the session.

[feature_toggles]
# Experimental features
enable = traceToMetrics,publicDashboards,tempoSearch,tempoServiceGraph,traceqlEditor
