# Grafana datasources for LIA
#
# The four signals link to each other: a log line opens its trace (Loki derived
# field), a trace opens its logs and its metrics (Tempo), a latency point opens
# the trace behind it (Prometheus exemplars). Each link names what the other
# side actually holds — checked against production on 2026-10-03, when three of
# them pointed at nothing (a logfmt pattern over JSON lines, a `service` label
# Loki did not carry, a `tempo_spanmetrics_*` family Tempo does not write).
#
# In this file a literal `$` is written `$$`: provisioning expands `$NAME` from
# the environment, and an unescaped `$__tags` was replaced by nothing.
apiVersion: 1

datasources:
  # Prometheus — metrics
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    uid: prometheus
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      # The scrape interval Prometheus actually uses (prometheus.yml, global):
      # $__rate_interval is built on it, and declared at 15s it gave a rate
      # window holding a single sample of a series scraped every 60s — an
      # empty panel on any range under a few hours.
      timeInterval: "30s"
      queryTimeout: "60s"
      # A latency point opens the trace it came from: Tempo's span metrics carry
      # their exemplars under `traceID` (its default trace_id_label_name), and
      # Prometheus stores them under --enable-feature=exemplar-storage.
      exemplarTraceIdDestinations:
        - name: traceID
          datasourceUid: tempo
    version: 1

  # Loki — logs
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    uid: loki
    editable: true
    jsonData:
      maxLines: 1000
      # A log line opens its trace. The API's lines are JSON (`"trace_id": "…"`);
      # the logfmt form covers a line written by hand.
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: '"trace_id":\s*"(\w+)"'
          name: TraceID
          url: "$${__value.raw}"
        - datasourceUid: tempo
          matcherRegex: 'trace_id=(\w+)'
          name: TraceID
          url: "$${__value.raw}"
    version: 1

  # Product analytics — read-only PostgreSQL (ADR-178, dashboard 26). The
  # grafana_product_reader role may SELECT the product views only (never a base
  # table) and carries a statement_timeout — created by
  # `task db:create-grafana-reader`. Variables are expanded from the Grafana
  # container's environment (dev and prod compose files).
  - name: Product PostgreSQL
    type: postgres
    access: proxy
    url: postgres:5432
    uid: postgres-product-readonly
    user: grafana_product_reader
    secureJsonData:
      password: $GRAFANA_PRODUCT_DB_PASSWORD
    jsonData:
      database: $POSTGRES_DB
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 300
    editable: false
    version: 1

  # Tempo — distributed traces
  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    uid: tempo
    editable: true
    jsonData:
      httpMethod: GET
      # A trace opens the API's lines that carry its id, around the span.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        query: '{service="api"} |= "$${__trace.traceId}"'
      # A trace opens the rate and latency of its service's operations, from the
      # span metrics Tempo writes (`service` holds the span's service.name).
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: '-30m'
        spanEndTimeShift: '30m'
        tags: [{ key: 'service.name', value: 'service' }]
        queries:
          - name: 'Request rate by operation'
            query: 'sum by (span_name) (rate(traces_spanmetrics_calls_total{$$__tags}[5m]))'
          - name: 'P95 duration by operation'
            query: 'histogram_quantile(0.95, sum by (le, span_name) (rate(traces_spanmetrics_latency_bucket{$$__tags}[5m])))'
      serviceMap:
        datasourceUid: prometheus
      search:
        hide: false
      nodeGraph:
        enabled: true
      lokiSearch:
        datasourceUid: loki
    version: 1

  # Alertmanager — the alerts Prometheus fires, their silences and receivers,
  # read in Grafana's Alerting pages. Rules stay in Prometheus (ADR-119):
  # Grafana evaluates nothing of its own.
  - name: Alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    uid: alertmanager
    editable: false
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false
    version: 1
