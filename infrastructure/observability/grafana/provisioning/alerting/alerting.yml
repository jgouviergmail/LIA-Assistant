# Grafana scans /etc/grafana/provisioning/alerting at every boot: an absent
# directory logs an ERROR (93 lines in 7 days of production logs, 2026-08-20),
# and any file whose suffix is not .yaml/.yml/.json a WARNING — which the
# .gitkeep that used to ship this directory did on every boot (2026-10-03).
# Alert rules are provisioned in Prometheus/Alertmanager (ADR-119), not in
# Grafana: this file provisions nothing and is valid as it stands.
apiVersion: 1
