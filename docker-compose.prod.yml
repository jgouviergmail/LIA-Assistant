# ============================================================================
# Docker Compose - PRODUCTION
# Raspberry Pi 5 deployment (4 CPU, 16GB RAM, NVMe SSD)
# ============================================================================

services:
  # PostgreSQL with pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lia-postgres-prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Increase max_connections to handle SQLAlchemy pool (60) + checkpointer + store + overhead
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=512MB
      -c effective_cache_size=1GB
      -c work_mem=32MB
      -c maintenance_work_mem=128MB
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      # Loopback-only (audit A3): Docker published ports bypass ufw, so a
      # 0.0.0.0 bind is LAN-reachable regardless of firewall rules. For
      # external DB management (DBeaver, pgAdmin), use an SSH tunnel:
      #   ssh -p 2222 -L 5432:127.0.0.1:5432 <user>@<host>
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lia-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # PostgreSQL scheduled backups (ADR-109)
  # Sidecar running pg_dump on a cron schedule with daily/weekly/monthly
  # rotation into a dedicated host directory (chmod 700, created by deploy.sh).
  # All knobs are .env-driven (POSTGRES_BACKUP_*, section [80]).
  # Healthcheck is baked into the image (webhook hook on HEALTHCHECK_PORT 8080).
  # Restore & verification procedures: docs/runbooks/DATABASE_BACKUP_RESTORE.md
  postgres-backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    container_name: lia-postgres-backup-prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "${POSTGRES_BACKUP_SCHEDULE:-@daily}"
      BACKUP_KEEP_DAYS: "${POSTGRES_BACKUP_KEEP_DAYS:-7}"
      BACKUP_KEEP_WEEKS: "${POSTGRES_BACKUP_KEEP_WEEKS:-4}"
      BACKUP_KEEP_MONTHS: "${POSTGRES_BACKUP_KEEP_MONTHS:-6}"
      # Explicit pg_dump options (never rely on image defaults): gzip level 6,
      # no schema filter (full database), --clean --if-exists so a restore is
      # a single self-cleaning command against prod or a throwaway container.
      POSTGRES_EXTRA_OPTS: "${POSTGRES_BACKUP_EXTRA_OPTS:--Z6 --clean --if-exists}"
      TZ: "${POSTGRES_BACKUP_TZ:-Etc/UTC}"
    volumes:
      # Host bind mount (not a named volume): keeps dumps directly reachable
      # for off-site sync (rclone, phase 2) and host-level chmod 700.
      - ${POSTGRES_BACKUP_HOST_DIR:-./backups/postgres}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lia-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M

  # Redis for caching and sessions
  redis:
    image: redis:7.4-alpine
    container_name: lia-redis-prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - lia-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M  # Was 256M — actual usage ~7M
        reservations:
          cpus: '0.1'
          memory: 64M

  # Backend API
  api:
    # Explicit image tag (F008): deterministic name so a failed deploy can be
    # rolled back to the previously-built image without a rebuild.
    image: lia-api:local
    build:
      context: ./apps/api
      dockerfile: Dockerfile.prod
      # Build provenance (F030) — the deploy sets these from git so the artifact
      # carries its own version/commit/date.
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0-dev}
        GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-unknown}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: lia-api-prod
    restart: unless-stopped
    # ADR-117: lifespan shutdown drains in-flight chat runs (45s) + generic
    # background tasks (15s). Default 10s grace would SIGKILL mid-drain.
    stop_grace_period: 90s
    group_add:
      - "${DOCKER_GID:-999}"  # Host docker group GID for DevOps Claude CLI socket access
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - LANGFUSE_DEBUG=false
      # Trust X-Forwarded-Proto from Cloudflare (Flexible SSL sends HTTP to origin)
      - FORWARDED_ALLOW_IPS=*
      # SEC-001: the skill-script sandbox reuses THIS service's image so the
      # interpreter and installed packages match exactly. Pinned here rather
      # than left to a default so the two can never drift apart.
      - SKILLS_SCRIPT_SANDBOX_IMAGE=lia-api:local
    # tmpfs mount for tiktoken and other libs that need writable temp directory
    # Increased to 500M to handle model operations
    tmpfs:
      - /tmp:mode=1777,size=500M
    volumes:
      # Firebase service account credentials (FCM push notifications)
      - ./apps/api/config:/app/config:ro
      # Persistent storage for file attachments (images, PDF)
      - attachments_data:/app/data/attachments
      # System knowledge files for FAQ RAG indexation (read-only)
      - ./docs/knowledge:/app/docs/knowledge:ro
      # System skills (read-only, shipped with the app)
      - ./data/skills/system:/app/data/skills/system:ro
      # User-imported skills (persisted across deploys)
      - skills_data:/app/data/skills/users
      # DevOps Claude CLI: Docker socket for container management + auth + workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.claude:/home/appuser/.claude
      - ./infrastructure/claude-cli/CLAUDE.server.md:/opt/claude-workspace/CLAUDE.md:ro
    ports:
      # Loopback-only: cloudflared (host systemd) is the single public entry
      # point. LAN clients must not bypass Cloudflare, and localhost-only
      # exposure is what makes uvicorn's forwarded-allow-ips="*" safe
      # (every peer that can reach the port is trusted: cloudflared + healthcheck).
      # Container-to-container traffic (web SSR -> http://api:8000) uses the
      # compose network and is unaffected by published-port bindings.
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:9091:9091"  # Prometheus metrics (scraped internally via api:9091)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Liveness probe on purpose (/health is 200 even if PG/Redis are down):
      # restarting the API cannot fix a dependency outage. Readiness = /ready.
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # start_period covers the real boot path: alembic migrations in the
      # entrypoint, then 4 uvicorn workers each importing the full app
      # (LangGraph graph + tool registry) — ~45s on dev hardware, slower on
      # the Pi 5. Whisper STT loads lazily on first voice use, not at boot.
      start_period: 60s
    networks:
      - lia-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 8G
        reservations:
          cpus: '0.5'
          memory: 2G

  # Frontend Web
  web:
    # Explicit image tag (F008) for rollback parity with the api service.
    image: lia-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile.prod
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        - NEXT_PUBLIC_APP_NAME=${NEXT_PUBLIC_APP_NAME:-Lia}
        # Firebase Cloud Messaging (FCM) - Push Notifications
        - NEXT_PUBLIC_FIREBASE_API_KEY=${NEXT_PUBLIC_FIREBASE_API_KEY}
        - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
        - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        - NEXT_PUBLIC_FIREBASE_APP_ID=${NEXT_PUBLIC_FIREBASE_APP_ID}
        - NEXT_PUBLIC_FIREBASE_VAPID_KEY=${NEXT_PUBLIC_FIREBASE_VAPID_KEY}
    container_name: lia-web-prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # SEC-037 — NO `env_file: .env` here, on purpose.
    #
    # That one line handed the Next.js container the ENTIRE production secret
    # set: PostgreSQL credentials, the Fernet key, the JWT secret, every LLM
    # provider key, every OAuth client secret, the Telegram bot token. None of
    # it is used by this container. A server-side RCE in Next.js or in any of
    # its transitive dependencies therefore read the whole platform's secrets
    # out of `process.env`, and so did anyone who could exec into the container.
    #
    # The list below is the measured runtime need, not a guess. `NODE_ENV`,
    # `API_URL_SERVER` and `RAG_SPACES_MAX_FILE_SIZE_MB` are read while the
    # server runs (`src/app/api/rag-upload/[spaceId]/route.ts`). The rest are
    # baked into the image at build time — Next.js serialises `headers()` and
    # `rewrites()` from next.config.ts into `.next/routes-manifest.json`, and
    # inlines `NEXT_PUBLIC_*` into the bundle — and are passed anyway because
    # they cost nothing to pass, carry no secret, and keep this container
    # working if a future Next.js reads them at startup instead.
    #
    # The rule for extending this list: anything that is not a secret may be
    # added freely; a secret means the frontend is doing something it should be
    # asking the API to do.
    environment:
      - NODE_ENV=production
      - API_URL_SERVER=http://api:8000
      - API_URL_SERVER_HTTP=${API_URL_SERVER_HTTP:-}
      - RAG_SPACES_MAX_FILE_SIZE_MB=${RAG_SPACES_MAX_FILE_SIZE_MB:-}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
      - NEXT_PUBLIC_ALLOWED_DEV_ORIGINS=${NEXT_PUBLIC_ALLOWED_DEV_ORIGINS:-}
      - HSTS_MAX_AGE=${HSTS_MAX_AGE:-}
      - COEP_MODE=${COEP_MODE:-}
    ports:
      # SEC-015 — loopback only, like every other published port in this file.
      # `3000:3000` bound the frontend to EVERY interface on the host: on the
      # LAN it was reachable directly, bypassing Cloudflare entirely and with it
      # the WAF, the TLS termination and the access logs. It was the single
      # exception among sixteen published ports — an oversight, not a decision.
      #
      # cloudflared runs under host systemd (see the API service above) and
      # reaches services over 127.0.0.1, exactly as it already does for the API
      # on :8000 and for Grafana on :3001.
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    networks:
      - lia-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M  # Was 512M — actual usage ~105M
        reservations:
          cpus: '0.25'
          memory: 128M

  # Tempo (Distributed Tracing)
  # Receives OpenTelemetry traces from the API, stores them for 7 days,
  # and generates span metrics pushed to Prometheus via remote-write.
  # Enables trace↔log↔metric correlation in Grafana (Dashboard 06).
  tempo:
    image: grafana/tempo:2.6.1
    container_name: lia-tempo-prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: [ "-config.file=/etc/tempo/tempo.yml" ]
    ports:
      # Loopback-only (audit A3): OTLP ingestion happens on the compose
      # network (service name tempo:4317); host ports are for local debug.
      - "127.0.0.1:${TEMPO_HOST_PORT:-3200}:3200"   # Tempo HTTP API
      - "127.0.0.1:${OTLP_GRPC_HOST_PORT:-4317}:4317"   # OTLP gRPC (receives traces from API)
      - "127.0.0.1:${OTLP_HTTP_HOST_PORT:-4318}:4318"   # OTLP HTTP
    volumes:
      - ./infrastructure/observability/tempo/tempo.yml:/etc/tempo/tempo.yml
      - tempo_data:/var/tempo
    networks:
      - lia-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 768M  # Was 512M — actual usage ~459M (90%)
        reservations:
          cpus: '0.1'
          memory: 128M

  # Prometheus
  # Entrypoint wrapper (ADR-119): renders the blackbox public-probe file_sd
  # target from BLACKBOX_PUBLIC_PROBE_URL (.env.prod) at startup, so the real
  # public domain never lands in the committed config (open-source repo).
  # Empty variable = zero probe targets.
  prometheus:
    image: prom/prometheus:v3.0.0
    container_name: lia-prometheus-prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      BLACKBOX_PUBLIC_PROBE_URL: ${BLACKBOX_PUBLIC_PROBE_URL:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -n "$$BLACKBOX_PUBLIC_PROBE_URL" ]; then
          printf -- "- targets:\n  - '%s'\n" "$$BLACKBOX_PUBLIC_PROBE_URL" > /etc/prometheus/file_sd/public_probe.yml
        else
          echo "[]" > /etc/prometheus/file_sd/public_probe.yml
        fi
        exec /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time=7d \
          --storage.tsdb.retention.size=2GB \
          --web.console.libraries=/usr/share/prometheus/console_libraries \
          --web.console.templates=/usr/share/prometheus/consoles \
          --web.enable-remote-write-receiver
    tmpfs:
      - /etc/prometheus/file_sd:mode=0777,size=1m
    ports:
      - "127.0.0.1:9090:9090"  # Loopback-only (audit A3)
    volumes:
      - ./infrastructure/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./infrastructure/observability/prometheus/alerts-core.yml:/etc/prometheus/alerts-core.yml
      - ./infrastructure/observability/prometheus/recording_rules.yml:/etc/prometheus/recording_rules.yml
      - prometheus_data:/prometheus
    networks:
      - lia-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M  # Was 512M — actual usage ~98M
        reservations:
          cpus: '0.1'
          memory: 128M

  # Alertmanager (ADR-119) — email notification chain for the 14-alert core.
  # The entrypoint renders the config from ALERTMANAGER_* env vars (.env.prod):
  # with SMTP set and Slack/PagerDuty empty it selects the email-only template.
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: lia-alertmanager-prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    entrypoint: /docker-entrypoint.sh
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:${ALERTMANAGER_HOST_PORT:-9094}'
    ports:
      - "127.0.0.1:${ALERTMANAGER_HOST_PORT:-9094}:9093"  # Loopback-only (audit A3)
    environment:
      ALERTMANAGER_SMTP_FROM: ${ALERTMANAGER_SMTP_FROM:-}
      ALERTMANAGER_SMTP_SMARTHOST: ${ALERTMANAGER_SMTP_SMARTHOST:-}
      ALERTMANAGER_SMTP_AUTH_USERNAME: ${ALERTMANAGER_SMTP_AUTH_USERNAME:-}
      ALERTMANAGER_SMTP_AUTH_PASSWORD: ${ALERTMANAGER_SMTP_AUTH_PASSWORD:-}
      ALERTMANAGER_BACKEND_TEAM_EMAIL: ${ALERTMANAGER_BACKEND_TEAM_EMAIL:-}
      ALERTMANAGER_FINANCE_TEAM_EMAIL: ${ALERTMANAGER_FINANCE_TEAM_EMAIL:-}
      ALERTMANAGER_SECURITY_TEAM_EMAIL: ${ALERTMANAGER_SECURITY_TEAM_EMAIL:-}
      ALERTMANAGER_ML_TEAM_EMAIL: ${ALERTMANAGER_ML_TEAM_EMAIL:-}
      ALERTMANAGER_SLACK_WEBHOOK_CRITICAL: ${ALERTMANAGER_SLACK_WEBHOOK_CRITICAL:-}
      ALERTMANAGER_SLACK_WEBHOOK_WARNING: ${ALERTMANAGER_SLACK_WEBHOOK_WARNING:-}
      ALERTMANAGER_SLACK_WEBHOOK_SECURITY: ${ALERTMANAGER_SLACK_WEBHOOK_SECURITY:-}
      ALERTMANAGER_PAGERDUTY_ROUTING_KEY: ${ALERTMANAGER_PAGERDUTY_ROUTING_KEY:-}
    volumes:
      - ./infrastructure/observability/alertmanager/docker-entrypoint.sh:/docker-entrypoint.sh:ro
      - ./infrastructure/observability/alertmanager/alertmanager.yml.template:/etc/alertmanager/alertmanager.yml.template:ro
      - ./infrastructure/observability/alertmanager/alertmanager-email-only.yml.template:/etc/alertmanager/alertmanager-email-only.yml.template:ro
      - ./infrastructure/observability/alertmanager/templates:/etc/alertmanager/templates:ro
      - alertmanager_data:/alertmanager
    networks:
      - lia-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M

  # blackbox-exporter (ADR-119) — HTTP probes for BackupFailed (sidecar
  # healthcheck webhook) and PublicEndpointDown/CertificateExpirySoon
  # (end-to-end public URL through the cloudflared tunnel).
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: lia-blackbox-exporter-prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - '--config.file=/etc/blackbox/blackbox.yml'
    volumes:
      - ./infrastructure/observability/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks:
      - lia-network
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
        reservations:
          cpus: '0.02'
          memory: 16M

  # Grafana
  grafana:
    image: grafana/grafana:11.3.0
    container_name: lia-grafana-prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=${GF_SERVER_ROOT_URL:-http://localhost:3001}
    ports:
      - "127.0.0.1:3001:3000"  # Loopback-only (audit A3): reach via SSH tunnel or cloudflared ingress
    volumes:
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning
      - ./infrastructure/observability/grafana/dashboards:/var/lib/grafana/dashboards
      - ./infrastructure/observability/grafana/grafana.ini:/etc/grafana/grafana.ini
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - lia-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M  # Was 512M — actual usage ~86M
        reservations:
          cpus: '0.1'
          memory: 128M

  # Loki (Logs)
  loki:
    image: grafana/loki:3.2.1
    container_name: lia-loki-prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:3100:3100"  # Loopback-only (audit A3)
    volumes:
      - ./infrastructure/observability/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    networks:
      - lia-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M  # Was 512M — actual usage ~66M
        reservations:
          cpus: '0.1'
          memory: 128M

  # Promtail (Log Collection Agent)
  promtail:
    image: grafana/promtail:3.2.1
    container_name: lia-promtail-prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./infrastructure/observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/tmp
    depends_on:
      - loki
    networks:
      - lia-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M

  # Node Exporter - Host/system metrics (CPU, memory, disk, network)
  # Required for Dashboard 01 CPU/Memory panels and Dashboard 03 Infrastructure
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: lia-node-exporter-prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "127.0.0.1:9100:9100"  # Loopback-only (audit A3)
    volumes:
      - /:/host:ro
    networks:
      - lia-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M

  # cAdvisor - Container metrics (CPU, memory, network per container)
  # Required for Dashboard 03 container resource panels
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: lia-cadvisor-prod
    restart: unless-stopped
    privileged: true
    ports:
      - "127.0.0.1:8080:8080"  # Loopback-only (audit A3)
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    networks:
      - lia-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M

  # PostgreSQL Exporter - Database metrics
  # Required for Dashboard 03 DB panels
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: lia-postgres-exporter-prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    ports:
      - "127.0.0.1:9187:9187"  # Loopback-only (audit A3)
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lia-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M

  # Redis Exporter - Cache metrics
  # Required for Dashboard 03 Redis panels
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: lia-redis-exporter-prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    ports:
      - "127.0.0.1:9121:9121"  # Loopback-only (audit A3)
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - lia-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M

  # Portainer (Docker Management UI)
  portainer:
    image: portainer/portainer-ce:2.39.0
    container_name: lia-portainer-prod
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:9000:9000"  # Loopback-only (audit A3)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - lia-network
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M  # Was 256M — actual usage ~20M
        reservations:
          cpus: '0.05'
          memory: 64M

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  alertmanager_data:  # Alert state (silences, notification log) — ADR-119
  grafana_data:
  loki_data:
  tempo_data:  # Trace storage (7-day retention, auto-compacted)
  promtail_positions:
  attachments_data:  # Persistent storage for file attachments (images, PDF)
  skills_data:  # Persistent storage for user-imported skills
  portainer_data:

networks:
  lia-network:
    driver: bridge
