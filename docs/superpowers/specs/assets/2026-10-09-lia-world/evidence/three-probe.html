<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LIA isolated true-3D renderer characterization</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f3f0e9;color:#344052;font:14px system-ui}header{height:54px;padding:15px}main{height:calc(100dvh - 54px);overflow:hidden}canvas{display:block}</style></head><body><header>Isolated lightweight orthographic 3D probe · synthetic art</header><main></main>
<script type="module">
import * as THREE from './three.module.js';
const view=document.querySelector('main'),renderer=new THREE.WebGLRenderer({antialias:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));view.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#ddd8c9');scene.add(new THREE.HemisphereLight('#ffffff','#786851',2));const light=new THREE.DirectionalLight('#ffffff',2);light.position.set(8,30,10);scene.add(light);
const camera=new THREE.OrthographicCamera(-24,24,16,-16,.1,150);camera.position.set(50,50,50);camera.lookAt(16,0,16);
const resize=()=>{renderer.setSize(view.clientWidth,view.clientHeight);const a=view.clientWidth/view.clientHeight;camera.left=-24*a;camera.right=24*a;camera.updateProjectionMatrix()};resize();addEventListener('resize',resize);
const dummy=new THREE.Object3D(),tileMat=new THREE.MeshLambertMaterial({color:'#cfccbc'}),propMat=new THREE.MeshLambertMaterial({color:'#628572'});
const tiles=new THREE.InstancedMesh(new THREE.BoxGeometry(.97,.05,.97),tileMat,1024);for(let x=0;x<32;x++)for(let z=0;z<32;z++){dummy.position.set(x,0,z);dummy.updateMatrix();tiles.setMatrixAt(x*32+z,dummy.matrix)}scene.add(tiles);
const props=new THREE.InstancedMesh(new THREE.BoxGeometry(.5,1.1,.5),propMat,200);for(let i=0;i<200;i++){dummy.position.set((i*7)%32,.6,(i*13)%32);dummy.updateMatrix();props.setMatrixAt(i,dummy.matrix)}scene.add(props);
const avatars=[];const torsoGeo=new THREE.BoxGeometry(.35,.65,.3),headGeo=new THREE.SphereGeometry(.23,8,6);for(let i=0;i<10;i++){const actor=new THREE.Group();const torso=new THREE.Mesh(torsoGeo,new THREE.MeshLambertMaterial({color:['#5383b8','#b79c54','#438b86','#b76777'][i%4]}));torso.position.y=.5;const head=new THREE.Mesh(headGeo,new THREE.MeshLambertMaterial({color:'#ddae86'}));head.position.y=1.03;actor.add(torso,head);scene.add(actor);avatars.push(actor)}
const bip=new THREE.Mesh(new THREE.BoxGeometry(.4,.7,.4),new THREE.MeshLambertMaterial({color:'#ffffff'}));scene.add(bip);
let count=5,frames=[],angle=0,last=performance.now(),enabled=true;
const setCount=n=>{count=n;avatars.forEach((a,i)=>a.visible=i<n)};setCount(5);
const animate=now=>{requestAnimationFrame(animate);if(!enabled||document.hidden){last=now;return}frames.push(now-last);if(frames.length>10000)frames.shift();angle+=Math.min(now-last,50)*.00035;last=now;for(let i=0;i<count;i++)avatars[i].position.set(14+Math.sin(angle+i)*8,0,14+Math.cos(angle+i)*8);bip.position.set(14+Math.sin(angle+.3)*7,.5,14+Math.cos(angle+.3)*7);renderer.render(scene,camera)};requestAnimationFrame(animate);
const gl=renderer.getContext(),ext=gl.getExtension('WEBGL_debug_renderer_info'),gpu=ext?gl.getParameter(ext.UNMASKED_RENDERER_WEBGL):'unavailable';
window.probe={ready:true,version:THREE.REVISION,gpu,get size(){return {width:view.clientWidth,height:view.clientHeight,dpr:renderer.getPixelRatio()}},get calls(){return renderer.info.render.calls},get triangles(){return renderer.info.render.triangles}};
window.benchmark=async(n,milliseconds=6000)=>{setCount(n);frames=[];await new Promise(r=>setTimeout(r,milliseconds));const f=frames.slice(5).sort((a,b)=>a-b);return {avatars:n,frames:f.length,medianMs:f[Math.floor(f.length*.5)],p95Ms:f[Math.floor(f.length*.95)],meanMs:f.reduce((a,b)=>a+b,0)/f.length,gpu,version:THREE.REVISION,size:window.probe.size,calls:window.probe.calls,triangles:window.probe.triangles,visibility:document.visibilityState}};
window.baseline=async(milliseconds=6000)=>{enabled=false;const f=[];let previous=performance.now(),end=previous+milliseconds;await new Promise(resolve=>{const step=now=>{f.push(now-previous);previous=now;now>=end?resolve():requestAnimationFrame(step)};requestAnimationFrame(step)});enabled=true;last=performance.now();const s=f.slice(5).sort((a,b)=>a-b);return {frames:s.length,medianMs:s[Math.floor(s.length*.5)],p95Ms:s[Math.floor(s.length*.95)],meanMs:s.reduce((a,b)=>a+b,0)/s.length,rendererStopped:true}};
</script></body></html>
