/* LIA living maps — one stylesheet for the three pages (docs/maps).
   Palette: LIA's public "cosmos" identity (dark-first, a sober light variant),
   Inter for text, Fira Code for identifiers. Tones carry meaning: one per

:root {
  color-scheme: light;
  --bg: #f5f6fc;

  --accent: #2c56c4;
  --accent-ink: #ffffff;
  --accent-soft: rgba(44, 86, 196, 0.1);
  --glow-a: rgba(79, 141, 253, 0.16);
  --glow-b: rgba(139, 92, 246, 0.12);
  --glow-c: rgba(56, 212, 245, 0.1);
  --grad: linear-gradient(100deg, #4f8dfd, #8b5cf6 55%, #38d4f5);
  --shadow: 0 1px 2px rgba(27, 33, 64, 0.06), 0 10px 28px -14px rgba(27, 33, 64, 0.22);
  --shadow-lift: 0 2px 6px rgba(27, 33, 64, 0.08), 0 18px 40px -18px rgba(27, 33, 64, 0.32);
  --scrim: rgba(12, 16, 34, 0.32);
  --edge: rgba(27, 33, 64, 0.16);
  --t-blue: #2c56c4;
  --t-violet: #6d28d9;
  --t-emerald: #047857;
  --t-amber: #b45309;
  --t-rose: #be123c;
  --t-cyan: #0e7490;
  --t-slate: #475569;
  --t-indigo: #4338ca;
  --t-orange: #c2410c;
  --t-teal: #0f766e;
  --t-fuchsia: #a21caf;
  --t-lime: #4d7c0f;
  --t-sky: #0369a1;
  --radius: 14px;
  --radius-sm: 10px;
  --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "Fira Code", ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;

/* ---------- base ---------- */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: calc(72px + env(safe-area-inset-top, 0px)); }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
a { color: var(--accent); text-underline-offset: 3px; }
a:hover { text-decoration-thickness: 2px; }
code, .mono { font-family: var(--mono); font-size: 0.86em; }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1320px; margin-inline: auto; padding-inline: clamp(16px, 3.5vw, 40px); }
.skip { position: absolute; left: 12px; top: -48px; z-index: 50; background: var(--surface); color: var(--ink); padding: 8px 12px; border-radius: 8px; box-shadow: var(--shadow); }
.skip:focus { top: calc(8px + env(safe-area-inset-top, 0px)); }
.ic { flex: none; display: inline-block; vertical-align: middle; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.noscript { margin-block: 32px; padding: 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }

/* tone plumbing: every coloured object reads --tone */
[data-tone="blue"] { --tone: var(--t-blue); }
[data-tone="violet"] { --tone: var(--t-violet); }
[data-tone="emerald"] { --tone: var(--t-emerald); }
[data-tone="amber"] { --tone: var(--t-amber); }
[data-tone="rose"] { --tone: var(--t-rose); }
[data-tone="cyan"] { --tone: var(--t-cyan); }
[data-tone="slate"] { --tone: var(--t-slate); }
[data-tone="indigo"] { --tone: var(--t-indigo); }
[data-tone="orange"] { --tone: var(--t-orange); }
[data-tone="teal"] { --tone: var(--t-teal); }
[data-tone="fuchsia"] { --tone: var(--t-fuchsia); }
[data-tone="lime"] { --tone: var(--t-lime); }
[data-tone="sky"] { --tone: var(--t-sky); }

/* ---------- top bar ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  padding-top: env(safe-area-inset-top, 0px);
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: saturate(1.4) blur(14px);
  -webkit-backdrop-filter: saturate(1.4) blur(14px);
  border-bottom: 1px solid var(--line);
}
.topbar-in { display: flex; align-items: center; gap: 16px; min-height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); min-width: 0; }
.brand-mark svg { display: block; width: 30px; height: 30px; }
.brand-name { font-weight: 800; letter-spacing: -0.02em; font-size: 18px; }
.brand-sub { color: var(--muted); font-size: 13px; font-weight: 500; white-space: nowrap; }
.pages { display: flex; gap: 4px; margin-inline-start: auto; overflow-x: auto; scrollbar-width: none; }
.pages::-webkit-scrollbar { display: none; }
.pages a {
  display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 999px;
  color: var(--muted); text-decoration: none; font-weight: 600; font-size: 13.5px; white-space: nowrap;
  transition: background-color 0.2s var(--ease), color 0.2s var(--ease);
}
.pages a:hover { color: var(--ink); background: var(--accent-soft); }
.pages a[aria-current="page"] { color: var(--accent-ink); background: var(--accent); }
.icon-btn {
  display: inline-grid; place-items: center; width: 38px; height: 38px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; flex: none;
  transition: border-color 0.2s var(--ease), background-color 0.2s var(--ease);
}
.icon-btn:hover { border-color: var(--line-strong); background: var(--surface-2); }
@media (max-width: 720px) {
  .brand-sub { display: none; }
  .pages a span { display: none; }
  .pages a { padding: 9px; }
}

/* ---------- hero ---------- */
.hero { position: relative; padding-block: clamp(36px, 6vw, 72px) clamp(24px, 4vw, 40px); isolation: isolate; }
.hero::before {
  content: ""; position: absolute; inset: -60px calc(-1 * clamp(16px, 3.5vw, 40px)) 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(42rem 22rem at 8% 0%, var(--glow-a), transparent 64%),
    radial-gradient(36rem 20rem at 92% 12%, var(--glow-b), transparent 66%),
    radial-gradient(30rem 16rem at 50% 110%, var(--glow-c), transparent 60%);
}
.eyebrow {
  display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--muted);
}
.eyebrow .pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--grad); box-shadow: 0 0 0 4px var(--accent-soft); }
.hero h1 {
  margin-top: 14px; font-size: clamp(2.1rem, 5.2vw, 3.6rem); font-weight: 800; letter-spacing: -0.025em; line-height: 1.06;
  max-width: 18ch;
}
.grad-text { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent; }
.hero .lede { margin-top: 16px; max-width: 64ch; font-size: clamp(1rem, 1.6vw, 1.14rem); color: var(--ink-2); }
.stats { margin-top: 28px; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; max-width: 900px; }
.stat {
  padding: 14px 16px; border-radius: var(--radius); background: color-mix(in srgb, var(--surface) 78%, transparent);
  border: 1px solid var(--line);
}
.stat b { display: block; font-size: 1.75rem; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat span { display: block; margin-top: 4px; color: var(--muted); font-size: 13px; }
.stamp { margin-top: 18px; color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.stamp .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--line-strong); }

/* ---------- sections ---------- */
.section { padding-block: clamp(28px, 4vw, 48px); border-top: 1px solid var(--line); }
.section-head { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.section-head h2 { font-size: clamp(1.35rem, 2.4vw, 1.7rem); font-weight: 750; letter-spacing: -0.015em; }
.section-head p { color: var(--muted); max-width: 70ch; margin-top: 6px; }
.kicker { font-size: 12px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--accent); }

/* ---------- overview (diagram + side panel) ---------- */
.overview { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 20px; align-items: start; }
@media (max-width: 1080px) { .overview { grid-template-columns: minmax(0, 1fr); } }
.stage {
  position: relative; border: 1px solid var(--line); border-radius: calc(var(--radius) + 4px);
  background: color-mix(in srgb, var(--surface) 70%, transparent); box-shadow: var(--shadow); overflow: hidden;
}
.stage-toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.search { position: relative; flex: 1 1 220px; min-width: 0; }
.search input {
  width: 100%; height: 38px; padding: 0 12px 0 36px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); font: inherit; font-size: 14px;
}
.search input::placeholder { color: var(--muted); }
.search .ic { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.hint { color: var(--muted); font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; }
.scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.side { position: sticky; top: calc(76px + env(safe-area-inset-top, 0px)); display: grid; gap: 14px; }
@media (max-width: 1080px) { .side { position: static; } }
.card {
  border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); padding: 16px;
}
.card h3 { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.card .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }

/* legend list */
.legend { display: grid; gap: 6px; margin-top: 12px; }
.legend button {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 7px 8px; border-radius: 9px;
  border: 1px solid transparent; background: none; cursor: pointer; font-size: 13.5px; font-weight: 600;
}
.legend button:hover, .legend button[aria-pressed="true"] { background: var(--surface-2); border-color: var(--line); }
.legend .sw { width: 12px; height: 12px; border-radius: 4px; background: var(--tone); flex: none; }
.legend .n { margin-left: auto; color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }

/* ---------- constellation (functional) ---------- */
.constellation { display: block; width: 100%; min-width: 640px; height: auto; }
.constellation .edge { fill: none; stroke: var(--edge); stroke-width: 1.2; transition: opacity 0.25s var(--ease), stroke 0.25s var(--ease); }
.constellation .arc { fill: none; stroke: var(--tone); stroke-width: 7; stroke-linecap: round; opacity: 0.9; }
.constellation .node circle { fill: var(--tone); stroke: var(--bg); stroke-width: 3; transition: r 0.2s var(--ease); }
.constellation .node text { fill: var(--ink-2); font: 600 15px var(--font); dominant-baseline: middle; transition: fill 0.2s var(--ease); }
.constellation .node { cursor: pointer; outline: none; }
.constellation .node:hover text, .constellation .node:focus-visible text { fill: var(--ink); }
.constellation .node:focus-visible circle { stroke: var(--accent); stroke-width: 4; }
.constellation .core text { fill: var(--muted); font: 700 13px var(--font); letter-spacing: 0.14em; text-anchor: middle; text-transform: uppercase; }
.constellation .core .big { fill: var(--ink); font: 800 44px var(--font); letter-spacing: -0.02em; }
.constellation.is-focus .edge { opacity: 0.08; }
.constellation.is-focus .node { opacity: 0.28; }
.constellation.is-focus .node.on, .constellation.is-focus .node.near { opacity: 1; }
.constellation.is-focus .node.on circle { r: 11; }
.constellation .edge.out { opacity: 1; stroke: var(--accent); stroke-width: 2.2; }
.constellation .edge.in { opacity: 1; stroke: var(--t-rose); stroke-width: 2.2; stroke-dasharray: 5 5; }
.constellation .flowpath { fill: none; stroke: url(#flowgrad); stroke-width: 3.4; stroke-linecap: round; }
.constellation .flowpath.animate { stroke-dasharray: 10 10; animation: dash 1.2s linear infinite; }
.constellation .badge circle { fill: var(--ink); stroke: var(--bg); stroke-width: 2.5; r: 12; }
.constellation .badge text { fill: var(--bg); font: 800 12px var(--font); text-anchor: middle; dominant-baseline: central; }
.constellation .badge.current circle { fill: var(--accent); }
.constellation .badge.current text { fill: var(--accent-ink); }
@keyframes dash { to { stroke-dashoffset: -40; } }

/* ---------- families grid ---------- */
.families { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 16px; }
.family { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.family-head { display: flex; gap: 12px; padding: 16px 16px 12px; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, color-mix(in srgb, var(--tone) 9%, transparent), transparent); }
.family-head .badge-ic { color: var(--tone); }
.family-head h3 { font-size: 16px; font-weight: 750; letter-spacing: -0.01em; }
.family-head p { margin-top: 4px; color: var(--muted); font-size: 13px; }
.brick-list { list-style: none; margin: 0; padding: 6px; display: grid; gap: 2px; }
.brick-row {
  display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: start; width: 100%; text-align: left; padding: 9px 10px;
  border: 1px solid transparent; border-radius: 10px; background: none; cursor: pointer;
}
.brick-row:hover { background: var(--surface-2); border-color: var(--line); }
.brick-row .ic { color: var(--tone); margin-top: 2px; grid-row: span 2; }
.brick-row b { font-size: 14px; font-weight: 650; }
.brick-row small { color: var(--muted); font-size: 12.5px; line-height: 1.45; }

/* ---------- chips ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* ---------- flows ---------- */
.flow-list { display: grid; gap: 6px; margin-top: 12px; }

}

.mblock { position: relative; }

.step b { display: block; font-size: 13px; }
.step span { display: block; color: var(--ink-2); font-size: 13px; line-height: 1.45; }
.flows-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 16px; }
.flow-card { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 16px; display: grid; gap: 10px; align-content: start; }
.flow-card h3 { display: flex; align-items: center; gap: 10px; font-size: 15.5px; font-weight: 750; }

.flow-card ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
.flow-card li { display: grid; grid-template-columns: 24px 1fr; gap: 10px; align-items: start; font-size: 13.5px; }
.flow-card li .num { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--line); font-size: 11.5px; font-weight: 800; }

.linkish { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }

/* ---------- layers (technical) ---------- */
.layers { position: relative; display: grid; gap: 10px; padding: 14px; }
.links-layer { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: visible; }

.layer {
  position: relative; z-index: 1; display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 12px; align-items: stretch;

  position: absolute; top: -9px; right: -8px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 999px; display: grid; place-items: center;

/* ---------- drawer ---------- */

  @keyframes slideup { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
}
.drawer-head { display: flex; align-items: flex-start; gap: 12px; padding: 16px 16px 12px; border-bottom: 1px solid var(--line); }
.drawer-title-wrap { display: flex; gap: 12px; align-items: flex-start; min-width: 0; flex: 1; }

.dsec h4 { font-size: 11.5px; font-weight: 750; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }

.goal { padding: 12px; border-radius: 12px; background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent); color: var(--ink); font-weight: 550; }

.adr-list a { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; padding: 7px 8px; border-radius: 9px; text-decoration: none; color: var(--ink); }

.empty { color: var(--muted); font-size: 13px; font-style: italic; }

/* ---------- tooltip ---------- */
.tip {
  position: fixed; z-index: 60; pointer-events: none; max-width: 280px; padding: 9px 11px; border-radius: 10px;
  background: var(--ink); color: var(--bg); font-size: 12.5px; line-height: 1.45; box-shadow: var(--shadow-lift);
}

/* ---------- history ---------- */
.chart-card { padding: 16px 16px 8px; }

.filters { display: grid; gap: 12px; margin-bottom: 18px; }
.filter-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

  display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px 6px 8px; border-radius: 999px; cursor: pointer; font-weight: 650; font-size: 13px;

.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); cursor: pointer; user-select: none; }

}

  background:

,{"d":"M18 11c-1.5 0-2.5.5-3 2"}],["path",{"d":"M4 6a2 2 0 0 0-2 2v4a5 5 0 0 0 5 5 8 8 0 0 1 5 2 8 8 0 0 1 5-2 5 5 0 0 0 5-5V8a2 2 0 0 0-2-2h-3a8 8 0 0 0-5 2 8 8 0 0 0-5-2z"}],["path",{"d":"M6 11c1.5 0 2.5.5 3 2"}]],"waypoints":[["path",{"d":"m10.586 5.414-5.172 5.172"}],["path",{"d":"m18.586 13.414-5.172 5.172"}],["path",{"d":"M6 12h12"}],["circle",{"cx":"12","cy":"20","r":"2"}],["circle",{"cx":"12","cy":"4","r":"2"}],["circle",{"cx":"20","cy":"12","r":"2"}],["circle",{"cx":"4","cy":"12","r":"2"}]],"workflow":[["rect",{"width":"8","height":"8","x":"3","y":"3","rx":"2"}],["path",{"d":"M7 11v4a2 2 0 0 0 2 2h4"}],["rect",{"width":"8","height":"8","x":"13","y":"13","rx":"2"}]],"wrench":[["path",{"d":"M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.106-3.105c.32-.322.863-.22.983.218a6 6 0 0 1-8.259 7.057l-7.91 7.91a1 1 0 0 1-2.999-3l7.91-7.91a6 6 0 0 1 7.057-8.259c.438.12.54.662.219.984z"}]],"x":[["path",{"d":"M18 6 6 18"}],["path",{"d":"m6 6 12 12"}]],"zap":[["path",{"d":"M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"}]]},"functional":{"lede":"Ce que LIA sait faire, à quoi sert chaque brique, sur quoi elle s'appuie, et comment les briques s'enchaînent quand tu lui parles.","groups":[{"id":"g.converse","icon":"messages-square","tone":"blue","name":"Converser et comprendre","summary":"Le fil de conversation, la compréhension de chaque demande et les deux façons de l'exécuter : un plan vérifié, ou une boucle autonome."},{"id":"g.remember","icon":"brain","tone":"violet","name":"Se souvenir et te connaître","summary":"Ce que LIA retient de toi, comment elle le relit, et la personnalité qu'elle te montre — tout est visible et corrigeable."},{"id":"g.act","icon":"plug","tone":"emerald","name":"Agir dans tes services","summary":"Tes comptes et services réels : e-mail, agenda, contacts, fichiers, lieux, web, outils tiers. LIA agit en ton nom, jamais sans ton accord pour ce qui compte."},{"id":"g.know","icon":"library","tone":"amber","name":"Savoir et produire","summary":"Tes documents rendus consultables, et ce que LIA fabrique pour toi : documents, images, comptes rendus."},{"id":"g.initiative","icon":"sparkles","tone":"rose","name":"Prendre l'initiative","summary":"Ce que LIA fait sans qu'on le lui demande — au bon moment, dans des limites que tu fixes, et toujours inscrit au registre."},{"id":"g.voice","icon":"audio-lines","tone":"cyan","name":"Parler","summary":"La voix sous trois formes : dicter et écouter, converser en temps réel, et le téléphone."},{"id":"g.trust","icon":"shield-check","tone":"slate","name":"Confiance et contrôle","summary":"Qui accède à quoi, ce qui est tracé, ce que coûte chaque action, et les réglages qui gardent tout cela entre tes mains."}],"bricks":[{"id":"f.chat","group":"g.converse","icon":"message-square","domains":["chat","conversations","attachments"],"surfaces":["/dashboard/chat"],"deps":["f.routing","f.memory","f.provenance","f.costs"],"name":"Conversation","role":"Le fil unique où tu parles à LIA, par écrit ou à la voix : réponses en streaming, pièces jointes, cartes visuelles et coût affiché sous chaque réponse.","goal":"Répondre juste et vite, dans un seul fil, en montrant ce que chaque réponse a coûté."},{"id":"f.routing","group":"g.converse","icon":"compass","domains":["agents"],"surfaces":[],"deps":["f.context","f.memory","f.llmconfig"],"name":"Compréhension de la demande","role":"Lit chaque message : simple échange ou demande à exécuter, domaines concernés (agenda, e-mail…), langue, et classe les outils par pertinence.","goal":"Envoyer chaque demande vers le bon chemin sans dépenser plus que nécessaire."},{"id":"f.planning","group":"g.converse","icon":"list-checks","domains":["agents"],"surfaces":["/dashboard/chat"],"deps":["f.routing","f.hitl","f.connectors","f.provenance"],"name":"Planification (mode Pipeline)","role":"Transforme une demande en plan typé — étapes, dépendances, boucles sur une liste —, le vérifie, puis exécute les étapes indépendantes en parallèle.","goal":"Le mode par défaut : déterministe et économe, quatre à huit fois moins de jetons qu'une boucle autonome."},{"id":"f.react","group":"g.converse","icon":"repeat","domains":["agents"],"surfaces":["/dashboard/chat"],"deps":["f.routing","f.hitl","f.sandbox","f.connectors","f.provenance"],"name":"Mode ReAct","role":"Boucle autonome raisonnement ↔ outils pour les demandes ouvertes : tous les outils ou ceux choisis par pertinence, selon le rythme d'échanges de la personne, budget qui s'étend tant que la boucle produit, et une passe de rattrapage bornée quand un fait manque.","goal":"Explorer quand le chemin n'est pas connu d'avance, et finir sur un résultat obtenu ou un manque déclaré."},{"id":"f.hitl","group":"g.converse","icon":"user-check","domains":["agents"],"surfaces":["/dashboard/chat","/dashboard/workboard"],"deps":["f.chat","f.notifications"],"name":"Validation humaine","role":"Rien de sensible ne part sans ton accord : brouillons d'e-mails et d'événements, suppressions, lots sur une liste. Chaque brouillon se relit, se modifie ou se refuse, un par un.","goal":"Garder la main sur tout ce qui agit en ton nom."},{"id":"f.context","group":"g.converse","icon":"link-2","domains":["agents"],"surfaces":[],"deps":["f.chat"],"name":"Contexte et références","role":"Se souvient de ce qui vient d'être affiché : « le deuxième », « celui de demain » ou « réponds-lui » se résolvent sans rien répéter.","goal":"Parler à LIA comme à quelqu'un qui suit la conversation."},{"id":"f.provenance","group":"g.converse","icon":"badge-check","domains":["agents"],"surfaces":["/dashboard/chat"],"deps":["f.privacy"],"name":"Provenance et honnêteté","role":"Chaque réponse dit d'où viennent ses faits — sources, outils utilisés — et dit un échec tel qu'il est, sans inventer de diagnostic.","goal":"Pouvoir croire une réponse parce qu'on peut la vérifier."},{"id":"f.subagents","group":"g.converse","icon":"bot","domains":["sub_agents"],"surfaces":[],"deps":["f.planning","f.skills","f.costs"],"name":"Sous-agents délégués","role":"Une tâche longue ou spécialisée peut être confiée à un sous-agent, dans un budget borné.","goal":"Découper une grosse demande sans faire exploser la dépense."},{"id":"f.sandbox","group":"g.converse","icon":"square-terminal","domains":["agents","skills"],"surfaces":["/dashboard/chat"],"deps":["f.connectors","f.hitl"],"name":"Calcul Python éphémère","role":"Pour un calcul qu'un modèle fait mal, LIA écrit un court script et l'exécute dans un bac à sable isolé ; le réseau passe par un seul proxy, et tes clés n'y sont jamais visibles.","goal":"Des chiffres exacts plutôt qu'estimés, sans jamais exposer tes données ni tes clés."},{"id":"f.memory","group":"g.remember","icon":"brain","domains":["memories"],"surfaces":["/dashboard/settings"],"deps":["f.chat","f.admin"],"name":"Mémoire long terme","role":"Faits, préférences et consignes de travail extraits en arrière-plan de tes conversations ; chaque souvenir se voit, se corrige, et garde son historique quand il change.","goal":"Ne pas avoir à répéter ce que LIA sait déjà de toi."},{"id":"f.journals","group":"g.remember","icon":"notebook-pen","domains":["journals"],"surfaces":["/dashboard/settings"],"deps":["f.memory","f.interests","f.habits","f.relations","f.psyche"],"name":"Journaux et portrait","role":"LIA tient ses propres carnets de réflexion et compile ton portrait à partir de quatre sources — souvenirs, intérêts, habitudes, relations — en disant lesquelles elle a pu lire.","goal":"Une compréhension de toi qui s'affine avec le temps, et qui reste lisible."},{"id":"f.psyche","group":"g.remember","icon":"smile","domains":["psyche"],"surfaces":["/dashboard/chat"],"deps":["f.personality","f.chat"],"name":"Psyché et visage","role":"Un état émotionnel qui évolue au fil des échanges, module le ton et la voix, et anime les yeux et le visage de LIA.","goal":"Une présence cohérente plutôt qu'un automate au ton constant."},{"id":"f.personality","group":"g.remember","icon":"venetian-mask","domains":["personalities"],"surfaces":["/dashboard/settings"],"deps":[],"name":"Personnalités","role":"Le style de LIA — chaleureux, concis, professionnel… —, choisi par toi et appliqué partout où elle parle, téléphone compris.","goal":"Une assistante qui parle comme tu préfères."},{"id":"f.habits","group":"g.remember","icon":"calendar-clock","domains":["habits"],"surfaces":["/dashboard/settings"],"deps":["f.chat","f.admin"],"name":"Habitudes apprises","role":"Des statistiques déterministes et explicables sur quand tu fais quoi ; chaque habitude se voit, se corrige ou se bloque, et un seul interrupteur ferme tout apprentissage.","goal":"Anticiper sans deviner, et sans rien apprendre dans ton dos."},{"id":"f.interests","group":"g.remember","icon":"telescope","domains":["interests"],"surfaces":["/dashboard/settings"],"deps":["f.chat","f.web"],"name":"Centres d'intérêt","role":"Les sujets qui comptent pour toi, appris de tes conversations, qui nourrissent des découvertes envoyées au bon moment.","goal":"Te signaler ce qui t'intéresse vraiment, sans bruit."},{"id":"f.relations","group":"g.remember","icon":"contact","domains":["relations"],"surfaces":["/dashboard/relations"],"deps":["f.contacts","f.mail","f.calendar","f.memory","f.peers"],"name":"Relations","role":"Une fiche par personne qui rassemble tes échanges, et un débrief écrit une fois par jour : où tu en es, ce qu'il faut aborder.","goal":"Ne plus perdre le fil de tes relations."},{"id":"f.openloops","group":"g.remember","icon":"circle-dashed","domains":["open_loops"],"surfaces":["/dashboard/settings"],"deps":["f.chat"],"name":"Boucles ouvertes","role":"Les engagements pris en passant — « je te redis demain » — sont repérés et ne se perdent plus.","goal":"Tenir ce qui a été promis, par toi comme par LIA."},{"id":"f.bookmarks","group":"g.remember","icon":"bookmark","domains":["bookmarks"],"surfaces":["/dashboard/chat","/dashboard/settings"],"deps":["f.chat","f.rag"],"name":"Réponses conservées","role":"Une réponse que tu gardes devient une copie qui t'appartient : elle survit à la réinitialisation, s'exporte, et LIA peut la retrouver.","goal":"Garder ce qui a de la valeur, hors de la conversation qui l'a produit."},{"id":"f.peers","group":"g.remember","icon":"handshake","domains":["peers"],"surfaces":["/dashboard/settings"],"deps":["f.security"],"name":"Connexions entre pairs","role":"Relier deux comptes LIA : se transmettre des messages par l'assistante, se confier des tickets.","goal":"Collaborer sans quitter l'assistante."},{"id":"f.connectors","group":"g.act","icon":"plug","domains":["connectors","push_channels"],"surfaces":["/dashboard/settings"],"deps":["f.security","f.privacy"],"name":"Connecteurs","role":"Google, Microsoft, Apple et les services à clé personnelle ; un seul parcours de consentement par fournisseur, un fournisseur actif par catégorie. Les services sans clé sont activés pour tout le monde par l'administrateur.","goal":"Brancher tes vrais comptes une fois, et qu'ils restent branchés."},{"id":"f.mail","group":"g.act","icon":"mail","domains":["agents","connectors"],"surfaces":["/dashboard/chat"],"deps":["f.connectors","f.hitl"],"name":"E-mails","role":"Lire des e-mails nettoyés, les résumer une seule fois, chercher, rédiger, répondre et lire les pièces jointes — l'envoi passe toujours par un brouillon validé.","goal":"Traiter ta boîte en quelques phrases."},{"id":"f.calendar","group":"g.act","icon":"calendar","domains":["agents","connectors"],"surfaces":["/dashboard/chat"],"deps":["f.connectors","f.hitl"],"name":"Agenda","role":"Consulter, chercher, créer, déplacer et supprimer des événements, avec invités, rappels et fuseaux horaires.","goal":"Organiser ton temps en parlant."},{"id":"f.contacts","group":"g.act","icon":"book-user","domains":["agents","connectors"],"surfaces":["/dashboard/chat"],"deps":["f.connectors","f.hitl"],"name":"Contacts","role":"Retrouver quelqu'un, ses coordonnées et ses anniversaires, créer ou mettre à jour une fiche.","goal":"Savoir à qui tu parles quand tu dis « écris à Marie »."},{"id":"f.tasks","group":"g.act","icon":"list-todo","domains":["agents","connectors"],"surfaces":["/dashboard/chat"],"deps":["f.connectors","f.hitl"],"name":"Tâches","role":"Tes listes de tâches chez ton fournisseur : ajouter, cocher, déplacer, retrouver.","goal":"Ne rien oublier de ce qu'il reste à faire."},{"id":"f.drive","group":"g.act","icon":"folder-tree","domains":["agents","connectors","rag_spaces"],"surfaces":["/dashboard/spaces"],"deps":["f.connectors"],"name":"Fichiers","role":"Chercher et lire tes fichiers en ligne, et relier un dossier entier — sous-dossiers compris — à un espace de connaissances.","goal":"Retrouver un document par ce qu'il contient."},{"id":"f.places","group":"g.act","icon":"map-pin","domains":["agents","google_api"],"surfaces":["/dashboard/chat"],"deps":["f.connectors","f.costs"],"name":"Lieux, trajets et météo","role":"Lieux, itinéraires, météo et qualité de l'air ; ta dernière position connue sert partout, toujours avec son âge.","goal":"Répondre à « comment y aller » et « quel temps fera-t-il » avec des données fraîches."},{"id":"f.health","group":"g.act","icon":"activity","domains":["health_metrics"],"surfaces":["/dashboard/settings"],"deps":["f.security"],"name":"Santé","role":"Des signaux de santé — pas et fréquence cardiaque — envoyés depuis ton téléphone, agrégés et lus en contexte.","goal":"Tenir compte de ta forme, sans jouer au médecin."},{"id":"f.web","group":"g.act","icon":"globe","domains":["agents"],"surfaces":["/dashboard/chat"],"deps":["f.connectors"],"name":"Web et navigation","role":"Recherche web, encyclopédie, lecture de pages et navigateur piloté pour les sites qui l'exigent.","goal":"Aller chercher une information à jour, sources à l'appui."},{"id":"f.mcp","group":"g.act","icon":"blocks","domains":["user_mcp"],"surfaces":["/dashboard/settings"],"deps":["f.hitl","f.security"],"name":"Serveurs MCP","role":"Brancher des outils tiers au standard MCP — anciennes et nouvelles révisions du protocole, OAuth compris.","goal":"Étendre LIA sans attendre une intégration native."},{"id":"f.skills","group":"g.act","icon":"puzzle","domains":["skills","plugins"],"surfaces":["/dashboard/settings"],"deps":["f.sandbox","f.mcp"],"name":"Compétences et plugins","role":"Des compétences au standard Agent Skills et des plugins au standard Agent Plugins, installés en un geste avec un rapport composant par composant.","goal":"Donner à LIA des savoir-faire portables."},{"id":"f.rag","group":"g.know","icon":"library","domains":["rag_spaces"],"surfaces":["/dashboard/spaces"],"deps":["f.drive","f.mail","f.costs"],"name":"Espaces de connaissances","role":"Tes documents, dossiers en ligne, libellés d'e-mails et réponses gardées, indexés et retrouvés par une recherche hybride — le sens et les mots.","goal":"Que LIA réponde avec ce que tu sais déjà, source citée."},{"id":"f.documents","group":"g.know","icon":"file-text","domains":["document_generation","attachments"],"surfaces":["/dashboard/documents/[id]","/dashboard/settings"],"deps":["f.chat","f.costs"],"name":"Documents générés","role":"Rapports Word, présentations PowerPoint, classeurs Excel et PDF mis en page par le moteur de rendu, sans débordement ; une galerie garde tes fichiers.","goal":"Passer d'une recherche à un livrable propre."},{"id":"f.images","group":"g.know","icon":"image","domains":["image_generation"],"surfaces":["/dashboard/chat","/dashboard/settings"],"deps":["f.costs","f.llmconfig"],"name":"Images générées","role":"Créer ou retoucher une image chez plusieurs fournisseurs, chacun avec ses formats et son prix affiché.","goal":"Illustrer une idée en une phrase."},{"id":"f.meetings","group":"g.know","icon":"mic-vocal","domains":["meetings"],"surfaces":["/dashboard/meetings","/dashboard/meetings/templates"],"deps":["f.voice","f.documents","f.rag","f.calendar"],"name":"Réunions","role":"Enregistrer une réunion depuis le téléphone ou l'ordinateur et recevoir un compte rendu structuré, dans un modèle choisi automatiquement.","goal":"Assister à la réunion, pas à la prise de notes."},{"id":"f.heartbeat","group":"g.initiative","icon":"heart-pulse","domains":["heartbeat"],"surfaces":["/dashboard/notifications"],"deps":["f.habits","f.interests","f.calendar","f.mail","f.notifications","f.psyche","f.health","f.workboard","f.openloops"],"name":"Battement autonome","role":"Régulièrement, LIA regarde si elle a quelque chose d'utile à te dire — un e-mail qui arrive la réveille aussi —, puis décide sous des règles d'éligibilité strictes.","goal":"Parler au bon moment, ou se taire."},{"id":"f.initiative","group":"g.initiative","icon":"zap","domains":["agents"],"surfaces":["/dashboard/chat"],"deps":["f.planning","f.react"],"name":"Initiative de tour","role":"Après une action, LIA peut enchaîner d'elle-même ce qui s'impose : prévenir, vérifier, proposer la suite.","goal":"Finir le travail, pas seulement la phrase."},{"id":"f.moments","group":"g.initiative","icon":"alarm-clock","domains":["moments"],"surfaces":["/dashboard/notifications"],"deps":["f.calendar","f.meetings","f.notifications","f.heartbeat"],"name":"Moments anticipés","role":"Revenir à l'instant qui compte : juste après une réunion, ou à l'arrivée d'un e-mail que tu attendais.","goal":"Une question au bon moment vaut mieux qu'un rappel au hasard."},{"id":"f.briefing","group":"g.initiative","icon":"sunrise","domains":["briefing"],"surfaces":["/dashboard"],"deps":["f.calendar","f.mail","f.places","f.reminders","f.habits","f.journals"],"name":"Briefing du jour","role":"La page d'accueil : agenda, e-mails, météo, rappels et une synthèse, lus une seule fois par chargement.","goal":"Savoir où tu en es en un coup d'œil."},{"id":"f.routines","group":"g.initiative","icon":"calendar-sync","domains":["scheduled_actions"],"surfaces":["/dashboard/actions"],"deps":["f.planning","f.react","f.notifications","f.mail"],"name":"Routines","role":"Des actions planifiées récurrentes ou conditionnelles — dont la veille d'un e-mail attendu —, avec l'historique de la semaine.","goal":"Déléguer ce qui revient, sans y penser."},{"id":"f.reminders","group":"g.initiative","icon":"bell-ring","domains":["reminders"],"surfaces":["/dashboard/actions"],"deps":["f.notifications","f.llmconfig"],"name":"Rappels","role":"Un rappel qui sonne à l'heure dite et qui peut se répéter, formulé par LIA au moment où il sonne.","goal":"Ne plus oublier, sans post-it."},{"id":"f.workboard","group":"g.initiative","icon":"kanban","domains":["workboard"],"surfaces":["/dashboard/workboard"],"deps":["f.react","f.planning","f.peers","f.hitl","f.notifications"],"name":"Tableau de travail","role":"Des tickets confiés à LIA ou à un pair : cycle de vie, questions posées sur le ticket, résultat et coût.","goal":"Confier un travail qui dépasse une conversation."},{"id":"f.notifications","group":"g.initiative","icon":"bell","domains":["notifications","channels","push_relay"],"surfaces":["/dashboard/notifications"],"deps":["f.chat","f.privacy"],"name":"Notifications et canaux","role":"Notifications web et mobiles, et Telegram ; une notification envoyée par LIA est une action inscrite au registre.","goal":"Te joindre là où tu es, sans jamais le faire en silence."},{"id":"f.activity","group":"g.initiative","icon":"history","domains":["activity"],"surfaces":["/dashboard/activity"],"deps":["f.heartbeat","f.routines","f.interests","f.journals","f.openloops","f.habits"],"name":"Activité et propositions","role":"Tout ce que LIA a fait d'elle-même, lu depuis ses registres, et ses propositions en attente de ta décision.","goal":"Voir le travail invisible."},{"id":"f.voice","group":"g.voice","icon":"mic","domains":["voice"],"surfaces":["/dashboard/chat"],"deps":["f.chat","f.psyche","f.llmconfig"],"name":"Mode vocal","role":"Dicter tes messages, écouter les réponses, réveiller LIA par un mot ; la voix suit l'humeur.","goal":"Utiliser LIA les mains occupées. context","text":"« Le compte rendu » est retrouvé parmi ce qui vient d'être affiché."},{"brick":"f.planning","text":"Un plan typé est écrit et vérifié : trouver Marie, préparer l'e-mail."},{"brick":"f.contacts","text":"Marie est retrouvée dans tes contacts."},{"brick":"f.hitl","text":"Le brouillon t'est présenté : tu valides, modifies ou refuses."},{"brick":"f.mail","text":"L'e-mail part depuis ton propre compte."},{"brick":"f.provenance","text":"La réponse dit ce qui a été fait ; l'action est inscrite au registre."}]},{"id":"flow.react","icon":"repeat","name":"Une question ouverte, en mode ReAct","summary":"Quand le chemin n'est pas connu d'avance, la boucle explore — et finit sur un résultat ou un manque déclaré.","steps":[{"brick":"f.chat","text":"« Je vais chez mon frère demain en voiture : comment arriver à 19 h ? »"},{"brick":"f.routing","text":"Les outils disponibles sont classés par pertinence pour cette question."},{"brick":"f.react","text":"La boucle raisonne et appelle ses outils l'un après l'autre."},{"brick":"f.contacts","text":"L'adresse de ton frère est retrouvée."},{"brick":"f.places","text":"Trajet, heure de départ et météo à l'arrivée."},{"brick":"f.react","text":"Un fait manque ? Il est déclaré, et une passe de rattrapage bornée le cherche encore."},{"brick":"f.provenance","text":"La réponse dit ce qui a été obtenu, et ce qui n'a pas pu l'être."}]},{"id":"flow.initiative","icon":"sparkles","name":"LIA prend l'initiative","summary":"Un signal extérieur, une décision prudente, un message qui dit qu'il vient de LIA.","steps":[{"brick":"f.mail","text":"Un e-mail important arrive : la notification de ton fournisseur réveille LIA."},{"brick":"f.heartbeat","text":"Le battement évalue : est-ce utile, est-ce le bon moment ?"},{"brick":"f.habits","text":"Ton rythme habituel pèse dans la décision."},{"brick":"f.calendar","text":"Tu es en réunion ? LIA attend."},{"brick":"f.notifications","text":"La notification part — inscrite au registre comme une action."},{"brick":"f.chat","text":"Le message apparaît dans ton fil, teinté pour dire que LIA a parlé la première."}]},{"id":"flow.live","icon":"audio-lines","name":"Une conversation vocale en temps réel","summary":"Deux intelligences et une couture : la voix converse, le moteur de LIA agit.","steps":[{"brick":"f.live","text":"Tu ouvres une session Live sur ta propre clé."},{"brick":"f.live","text":"Le modèle vocal écoute et répond dans le même souffle."},{"brick":"f.chat","text":"« Qu'ai-je demain ? » est délégué au moteur de LIA comme un tour ordinaire."},{"brick":"f.calendar","text":"L'agenda est lu avec les mêmes règles que dans le chat."},{"brick":"f.hitl","text":"Une action sensible ? La question de validation devient la réponse vocale."},{"brick":"f.costs","text":"À la fin, une carte récapitule la session et ce qu'elle a coûté."}]},{"id":"flow.learn","icon":"brain","name":"LIA apprend à te connaître","summary":"Ce qui est dit en passant devient un souvenir, un intérêt, une habitude — tous visibles.","steps":[{"brick":"f.chat","text":"Tu mentionnes que tu es allergique aux fruits à coque."},{"brick":"f.memory","text":"Le fait est extrait en arrière-plan, rangé, corrigeable."},{"brick":"f.interests","text":"Les sujets qui reviennent deviennent des centres d'intérêt."},{"brick":"f.habits","text":"Les moments où tu fais les choses deviennent des habitudes, visibles et bloquables."},{"brick":"f.journals","text":"LIA compile ton portrait et dit quelles sources elle a lues."},{"brick":"f.psyche","text":"Son humeur et son ton s'ajustent à la relation."}]},{"id":"flow.knowledge","icon":"library","name":"Ce que tu sais, LIA le lit","summary":"Tes sources deviennent un corpus consultable, cité à chaque réponse.","steps":[{"brick":"f.drive","text":"Tu relies un dossier en ligne : ses sous-dossiers comptent, le nombre exact de fichiers est annoncé."},{"brick":"f.mail","text":"Ou un libellé d'e-mails : seuls les fils qui le portent sont indexés."},{"brick":"f.rag","text":"Les documents sont découpés, indexés, retrouvés par le sens et par les mots."},{"brick":"f.chat","text":"Une question retrouve le bon passage, cité avec sa source."},{"brick":"f.bookmarks","text":"Une réponse gardée rejoint ton espace et redevient trouvable."}]},{"id":"flow.costs","icon":"coins","name":"Chaque euro compté","summary":"De l'appel au registre : tarifé à son instant, borné avant, affiché après.","steps":[{"brick":"f.costs","text":"Avant chaque appel payé : le plafond du compte et le budget de l'instance sont vérifiés."},{"brick":"f.llmconfig","text":"Le tarif vient du catalogue : plage horaire, cache, jours de pointe."},{"brick":"f.chat","text":"Le coût s'affiche sous la réponse, dans la même unité pour tous les services."},{"brick":"f.privacy","text":"La dépense est attribuée au bon compte et à son auteur : toi, une routine, ou LIA."},{"brick":"f.admin","text":"L'administrateur voit la dépense par personne et par service."}]},{"id":"flow.ticket","icon":"kanban","name":"Un ticket confié","summary":"Un travail qui dépasse une conversation, avec ses questions et son résultat.","steps":[{"brick":"f.workboard","text":"Tu crées « organiser le séminaire » et le confies à LIA."},{"brick":"f.react","text":"LIA l'exécute avec tes outils, dans le mode choisi pour ce ticket."},{"brick":"f.hitl","text":"Une action à confirmer ? Le ticket passe « à confirmer », carte à l'appui."},{"brick":"f.notifications","text":"Tu es prévenu ; ton commentaire est la réponse."},{"brick":"f.workboard","text":"Résultat, coût et historique restent sur le ticket."}]},{"id":"flow.meeting","icon":"mic-vocal","name":"Une réunion enregistrée","summary":"De l'enregistrement au compte rendu, puis à la bonne question au bon moment.","steps":[{"brick":"f.meetings","text":"Le « + » transforme ton téléphone ou ton ordinateur en enregistreur."},{"brick":"f.voice","text":"L'audio est transcrit segment par segment."},{"brick":"f.documents","text":"Un compte rendu structuré est rédigé dans le modèle choisi eader","Gigue","Moteur de récurrence"]},{"id":"t.proactive","layer":"l.background","icon":"heart-pulse","paths":["apps/api/src/infrastructure/proactive","apps/api/src/domains/heartbeat","apps/api/src/domains/moments"],"domains":["heartbeat","moments"],"infra":["proactive"],"deps":["t.scheduler","t.llmfactory","t.push","t.registers"],"name":"Moteur proactif","role":"Sélectionne, vérifie, génère et envoie ce que LIA dit d'elle-même ; chaque envoi est revendiqué avant de partir et soldé depuis son résultat.","stack":["Éligibilité complète","Revendication avec jeton","Notification = action"]},{"id":"t.jobs","layer":"l.background","icon":"list-restart","paths":["apps/api/src/domains/meetings","apps/api/src/infrastructure/scheduler/voice_session_closing.py"],"domains":["meetings"],"deps":["t.postgres","t.scheduler"],"name":"Tâches durables","role":"Réunions, relais vocaux, projections : chaque travail long est une ligne revendiquée, reprise après un arrêt, soldée depuis un résultat explicite.","stack":["Lignes revendiquées","FOR UPDATE SKIP LOCKED","Reprise après arrêt"]},{"id":"t.selfdiag","layer":"l.background","icon":"stethoscope","paths":["apps/api/src/domains/diagnostics","apps/api/src/infrastructure/telemetry"],"domains":["diagnostics"],"infra":["telemetry"],"deps":["t.metrics","t.logs","t.alerts"],"name":"Auto-diagnostic","role":"LIA lit sa propre télémétrie, rassemble les preuves d'un incident au moment où il survient et en garde la mémoire.","stack":["Lecture Prometheus / Loki / Alertmanager","Preuves par recette"]},{"id":"t.postgres","layer":"l.data","icon":"database","paths":["apps/api/alembic","apps/api/src/infrastructure/database"],"infra":["database"],"deps":[],"name":"PostgreSQL et pgvector","role":"La source de vérité : comptes, conversations, checkpoints du graphe, vecteurs ; migrations en chaîne unique, sessions qui ne vivent pas plus longtemps que leurs requêtes.","stack":["PostgreSQL 16","pgvector","SQLAlchemy 2 async","Alembic"]},{"id":"t.redis","layer":"l.data","icon":"layers","paths":["apps/api/src/infrastructure/cache"],"infra":["cache"],"deps":[],"name":"Redis","role":"Caches, sessions, verrous et revendications ; chaque famille de clés déclare sa portée, et une purge ne retire que ce que sa famille déclare.","stack":["Redis 7","Familles de clés déclarées","Verrous à jeton propriétaire"]},{"id":"t.storage","layer":"l.data","icon":"hard-drive","paths":["apps/api/src/domains/attachments"],"domains":["attachments"],"deps":["t.postgres"],"name":"Fichiers","role":"Pièces jointes et fichiers produits par LIA ; chaque fichier dit qui l'a produit, et une réinitialisation ne retire que ce qu'elle doit.","stack":["Stockage local","Origine déclarée"]},{"id":"t.registers","layer":"l.data","icon":"scroll","paths":["apps/api/src/domains/agents/effects"],"domains":["agents"],"deps":["t.postgres"],"name":"Registres traçables","role":"Une ligne par action, par consultation et par tour ; l'instance peut les sceller dans une chaîne de hachage par compte ; exportables en entier, jamais réparées.","stack":["Effets","Consultations","Décisions","Chaîne de hachage par compte (activable)"]},{"id":"t.metrics","layer":"l.observability","icon":"chart-line","paths":["apps/api/src/infrastructure/observability","infrastructure/observability/prometheus"],"infra":["observability"],"deps":[],"name":"Métriques","role":"Chaque métrique définie dans le code est lue par un panneau, une règle ou une alerte — une métrique que personne ne voit est interdite.","stack":["Prometheus","Règles d'enregistrement","Exporters"]},{"id":"t.dashboards","layer":"l.observability","icon":"chart-no-axes-combined","paths":["infrastructure/observability/grafana"],"deps":["t.metrics","t.logs"],"name":"Tableaux de bord","role":"Des tableaux par sous-système, chaque requête résolue vers un vrai producteur.","stack":["Grafana"]},{"id":"t.alerts","layer":"l.observability","icon":"siren","paths":["infrastructure/observability/alertmanager","infrastructure/observability/prometheus/alerts-core.yml","docs/runbooks"],"deps":["t.metrics"],"name":"Alertes","role":"Des alertes qui réveillent pour une raison, chacune avec son runbook, validées comme une matrice de configurations.","stack":["Alertmanager","Seuils par environnement","Runbooks"]},{"id":"t.logs","layer":"l.observability","icon":"logs","paths":["apps/api/src/infrastructure/observability/logging.py","infrastructure/observability/loki","infrastructure/observability/promtail"],"deps":[],"name":"Journaux","role":"Des journaux structurés sans donnée personnelle au niveau INFO, des labels à ensemble fermé, relus par Loki.","stack":["structlog JSON","Loki","Promtail","Filtre PII"]},{"id":"t.tracing","layer":"l.observability","icon":"waypoints","paths":["apps/api/src/infrastructure/observability/tracing.py","apps/api/src/infrastructure/llm/callback_factory.py","infrastructure/observability/tempo"],"deps":[],"name":"Traces","role":"Suivre une requête à travers les couches, et chaque appel de modèle avec ses jetons.","stack":["Tempo","OpenTelemetry","Langfuse (option)"]},{"id":"t.docker","layer":"l.delivery","icon":"package","paths":["apps/api/Dockerfile.prod","apps/web/Dockerfile.prod","docker-compose.prod.yml","infrastructure/docker"],"deps":[],"name":"Images et composition","role":"Des images de production épinglées par version et empreinte, construites à partir d'installations figées.","stack":["Docker","Compose","Images épinglées par empreinte"]},{"id":"t.cicd","layer":"l.delivery","icon":"git-branch","paths":[".github/workflows/ci.yml","Taskfile.yml","scripts/audit"],"deps":["t.docker"],"name":"Intégration continue et gardes","role":"La CI orchestre, Taskfile implémente : chaque étape est une commande qu'un développeur peut lancer ; les seuils ne font que monter.","stack":["GitHub Actions","Task","Ratchets à sens unique"]},{"id":"t.release","layer":"l.delivery","icon":"rocket","paths":["scripts/release","scripts/deploy","scripts/install",".github/workflows/release.yml"],"deps":["t.cicd","t.docker"],"name":"Release, déploiement et installateur","role":"Un tag construit un candidat, une installation jetable le qualifie, puis la release le publie ; le déploiement lit son verdict dans un fichier ; un installateur guide l'auto-hébergement.","stack":["Candidats par empreinte","Qualification jetable","Déploiement détaché","Installateur guidé"]},{"id":"t.demo","layer":"l.delivery","icon":"flask-conical","paths":["infrastructure/demo-instance","docker-compose.demo-instance.yml","apps/api/src/domains/product"],"domains":["product"],"infra":["provisioning"],"deps":["t.release"],"name":"Démonstrateur","role":"Une instance publique de démonstration dont chaque protection est recalculée depuis la source de vérité, et vérifiée à chaque déploiement.","stack":["Instance isolée","Protections recalculées depuis la source"]}],"flows":[{"id":"tflow.request","icon":"send","name":"Le parcours d'un message de chat","summary":"Du clavier à l'écran, en passant par le graphe : une requête, un flux, aucun jeton exposé.","steps":[{"brick":"t.web","text":"Le navigateur envoie le message à l'API de sa propre origine."},{"brick":"t.edge","text":"Le tunnel l'achemine ; le débit de l'appelant est vérifié."},{"brick":"t.bff","text":"Le cookie de session est validé côté serveur."},{"brick":"t.fastapi","text":"La route du chat ouvre un flux et démarre le graphe."},{"brick":"t.langgraph","text":"L'état de la conversation est rechargé depuis son checkpoint."},{"brick":"t.router","text":"La demande est classée, les outils notés."},{"brick":"t.planner","text":"Un plan est écrit, validé, exécuté en parallèle."},{"brick":"t.toolsys","text":"Chaque outil passe la porte d'autorité et s'inscrit au registre."},{"brick":"t.connclients","text":"Le fournisseur est appelé, sans transaction de base ouverte."},{"brick":"t.response","text":"La réponse est synthétisée depuis les résultats."},{"brick":"t.sse","text":"Elle arrive mot à mot, avec son coût, sur le même flux."}]},{"id":"tflow.llmcall","icon":"cpu","name":"Un appel de modèle, de bout en bout","summary":"Borné avant, traduit pour le fournisseur, tarifé à son instant, tracé après.","steps":[{"brick":"t.promptsys","text":"Le prompt est assemblé : le stable d'abord, une seule frontière de cache."},{"brick":"t.pricing","text":"Les deux plafonds — compte et instance — sont interrogés avant la dépense."},{"brick":"t.reasoning","text":"L'intention de raisonnement est traduite pour ce modèle précis."},{"brick":"t.llmfactory","text":"Le client natif du fournisseur envoie la requête."},{"brick":"t.structured","text":"Une sortie coupée par la limite de jetons devient un refus explicite."},{"brick":"t.pricing","text":"L'usage est lu une seule fois et tarifé à la plage horaire de l'appel."},{"brick":"t.registers","text":"Les paramètres réellement envoyés rejoignent le registre de l'appel."},{"brick":"t.metrics","text":"Jetons, latence et coût deviennent des métriques."}]},{"id":"tflow.background","icon":"heart-pulse","name":"Une tâche de fond proactive","summary":"Un seul leader, une gigue, une revendication, un envoi soldé depuis son résultat.","steps":[{"brick":"t.scheduler","text":"Le leader déclenche le balayage, décalé par sa gigue."},{"brick":"t.proactive","text":"Les comptes éligibles sont sélectionnés sous toutes les règles."},{"brick":"t.connclients","text":"Les sources sont lues, chacune dans une transaction courte."},{"brick":"t.llmfactory","text":"Le message est rédigé sous les plafonds de dépense."},{"brick":"t.registers","text":"L'envoi est revendiqué avant de partir."},{"brick":"t.push","text":"La notification part vers le navigateur ou le téléphone."},{"brick":"t.registers","text":"L'effet est soldé depuis le résultat réel de l'envoi."}]},{"id":"tflow.live","icon":"audio-lines","name":"Une session Live","summary":"Le navigateur parle directement au fournisseur ; chaque demande revient au graphe.","steps":[{"brick":"t.web","text":"La personne ouvre une session Live."},{"brick":"t.live","text":"L'API émet un identifiant à usage unique et rend le mandat de la voix."},{"brick":"t.live","text":"Le navigateur ouvre le transport du fournisseur (WebSocket ou WebRTC)."},{"brick":"t.fastapi","text":"Une demande déléguée devient un tour de chat ordinaire."},{"brick":"t.langgraph","text":"Le graphe l'exécute avec ses validations et ses registres."},{"brick":"t.live","text":"La réponse, bornée et aplatie, est rendue à la voix."},{"brick":"t.jobs","text":"À la fin, une clôture unique archive, chiffre et relaie."}]},{"id":"tflow.delivery","icon":"rocket","name":"Du commit à la production","summary":"Chaque garde tourne avant le push ; rien n'est publié sans qualification.","steps":[{"brick":"t.cicd","text":"Le hook et la CI exécutent les mêmes commandes Task : lint, ratchets, tests."},{"brick":"t.cicd","text":"Sur le tag, les images candidates sont construites et étiquetées par empreinte."},{"brick":"t.release","text":"Une installation jetable qualifie le candidat."},{"brick":"t.release","text":"La release vérifie les preuves et publie les étiquettes de version."},{"brick":"t.docker","text":"Les images épinglées sont tirées sur le serveur."},{"brick":"t.release","text":"Le déploiement détaché écrit son verdict dans un fichier relu."},{"brick":"t.demo","text":"Le démonstrateur est redéployé et vérifié."}]},{"id":"tflow.observe","icon":"gauge","name":"Voir, alerter, se diagnostiquer","summary":"Chaque signal a un lecteur ; une alerte a un runbook ; LIA lit ses propres preuves.","steps":[{"brick":"t.metrics","text":"Les processus publient leurs métriques, mémoire comprise."},{"brick":"t.logs","text":"Les journaux structurés, sans donnée personnelle, rejoignent Loki."},{"brick":"t.dashboards","text":"Grafana montre chaque sous-système."},{"brick":"t.alerts","text":"Une alerte part avec son runbook."},{"brick":"t.selfdiag","text":"LIA rassemble les preuves de l'incident et le diagnostique."}]}]},"history":{"lede":"Chaque décision d'architecture, de la première à la dernière, racontée en quelques phrases et reliée aux briques qu'elle a façonnées.","themes":[{"id":"orchestration","icon":"workflow","tone":"violet","name":"Orchestration","summary":"Comment LIA comprend, planifie et exécute une demande."},{"id":"models","icon":"cpu","tone":"amber","name":"Modèles et coûts","summary":"Quels modèles, réglés comment, à quel prix et sous quels plafonds."},{"id":"memory","icon":"brain","tone":"fuchsia","name":"Mémoire et personnalisation","summary":"Ce que LIA retient de toi et comment elle s'en sert."},{"id":"connectors","icon":"plug","tone":"emerald","name":"Connecteurs et outils","summary":"Les services branchés et les protocoles ouverts."},{"id":"proactive","icon":"sparkles","tone":"rose","name":"Initiative","summary":"Ce que LIA fait d'elle-même, et quand."},{"id":"voice","icon":"audio-lines","tone":"cyan","name":"Voix","summary":"Dicter, écouter, converser, téléphoner."},{"id":"knowledge","icon":"library","tone":"lime","name":"Connaissances et documents","summary":"Tes documents consultables, et ceux que LIA produit."},{"id":"security","icon":"shield-check","tone":"sky","name":"Sécurité","summary":"Comptes, sessions, isolation, surface d'attaque."},{"id":"trust","icon":"badge-check","tone":"teal","name":"Traçabilité et honnêteté","summary":"Dire vrai, montrer d'où vient une réponse, garder la trace de ce qui est fait."},{"id":"reliability","icon":"gauge","tone":"orange","name":"Fiabilité et performance","summary":"Tenir la charge, ne rien perdre, se relever d'une panne."},{"id":"experience","icon":"palette","tone":"indigo","name":"Expérience et interface","summary":"Ce que tu vois et touches : écrans, accessibilité, visage de LIA."},{"id":"platform","icon":"rocket","tone":"slate","name":"Plateforme et livraison","summary":"Configuration, qualité du code, déploiement et installation."}],"eras":[{"id":"foundations","from":"2025-10-01","to":"2025-12-31","name":"Les fondations","summary":"Le graphe d'agents, les sessions tenues côté serveur, le planificateur, le registre de données, la mémoire, l'observabilité, les six langues et le déploiement sur un Raspberry Pi : la charpente sur laquelle tout le reste repose."},{"id":"beyond-keyboard","from":"2026-01-01","to":"2026-03-31","name":"Sortir du clavier","summary":"Un premier durcissement de sécurité, la dictée vocale, les espaces de connaissances et la synchronisation d'un dossier en ligne, les carnets de bord de LIA, le navigateur piloté, les limites d'usage — et la première version publique en open source."},{"id":"reasoning-voice","from":"2026-04-01","to":"2026-06-30","name":"Raisonner et prendre la parole","summary":"Le mode ReAct, une psyché qui évolue, les compétences, les données de santé, le briefing du matin, la voix de LIA, les sous-agents et un raisonnement réglé par fournisseur."},{"id":"audit","from":"2026-07-01","to":"2026-07-31","name":"L'audit et la rigueur","summary":"Un mois de cent décisions : un audit de bout en bout, la sécurité et les sauvegardes, une CI qui exécute exactement ce que le développeur lance, des alertes qui réveillent pour une raison, et les premières règles d'honnêteté."},{"id":"visibility","from":"2026-08-01","to":"2026-08-31","name":"Rendre tout visible","summary":"L'accessibilité par contrat, les réglages et les capacités affichés, les coûts à l'heure, l'installateur pour l'auto-hébergement, un catalogue de modèles qui dit vrai, les yeux expressifs et l'auto-diagnostic."},{"id":"promises","from":"2026-09-01","to":null,"name":"Tenir ses promesses","summary":"Des registres scellés, des comptes exacts, le tableau de travail, les réunions, le téléphone et le mode Live — et des échecs dits plutôt que devinés."}],"entries":[{"adr":1,"date":"2025-10-15","theme":"orchestration","functional":["f.planning","f.hitl"],"technical":["t.langgraph","t.sse"],"title":"LangGraph orchestre les agents","summary":"LIA a besoin d'un moteur capable de mener une conversation en plusieurs étapes, de s'arrêter pour demander un accord puis de reprendre. LangGraph fournit ce graphe d'exécution : l'état de chaque conversation est sauvegardé en base et les réponses arrivent mot à mot."},{"adr":2,"date":"2025-10-20","theme":"security","functional":["f.security"],"technical":["t.bff","t.redis"],"title":"Le navigateur ne voit jamais le jeton","summary":"Les jetons stockés dans le navigateur étaient exposés au vol et impossibles à révoquer. Un serveur intermédiaire (BFF) garde désormais la session côté serveur et ne confie au navigateur qu'un cookie inaccessible au JavaScript — une session se révoque instantanément."},{"adr":3,"date":"2025-11-09","theme":"models","functional":["f.routing"],"technical":["t.router","t.toolsys"],"title":"Ne charger que les outils utiles","summary":"Envoyer tout le catalogue d'outils au modèle à chaque question décuplait la taille du prompt et le coût. Le routeur détecte les domaines concernés et seul leur sous-ensemble d'outils est chargé, avec un repli sur le catalogue complet en cas de doute."},{"adr":4,"date":"2025-11-10","theme":"orchestration","functional":["f.planning"],"technical":["t.planner"],"title":"Un planificateur qui raisonne avant d'agir","summary":"Les premiers plans étaient trop simplistes et échouaient souvent. Le planificateur analyse désormais l'intention, décompose la demande, puis écrit un plan d'exécution justifié étape par étape."},{"adr":5,"date":"2025-11-14","theme":"orchestration","functional":["f.planning"],"technical":["t.planner"],"title":"Le plan de secours n'est plus joué en double","summary":"L'exécuteur parallèle lançait en même temps le plan principal et son alternative de secours : double appel, double coût. Les étapes écartées sont désormais retirées avant de lancer chaque vague."},{"adr":6,"date":"2025-11-14","theme":"models","functional":["f.contacts","f.planning"],"technical":["t.toolsys"],"title":"Jamais de liste sans limite","summary":"Demander « tous les contacts » pouvait ramener des centaines de fiches et exploser le coût. Trois barrières — avertissement du planificateur, plafond dur dans l'outil, journalisation — empêchent désormais une liste non bornée."},{"adr":7,"date":"2025-11-16","theme":"platform","functional":["f.planning"],"technical":["t.langgraph","t.fastapi"],"title":"Des nœuds minces, des services épais","summary":"Certains nœuds du graphe faisaient des centaines de lignes et étaient devenus illisibles. La logique métier part dans des services dédiés ; un nœud se contente de coordonner."},{"adr":8,"date":"2025-11-09","theme":"orchestration","functional":["f.hitl","f.planning"],"technical":["t.hitl","t.planner"],"nofile":"Documented in docs/technical/HITL.md (Phase 8 section) and in the ADR index.","title":"Valider le plan avant d'agir","summary":"Plutôt que d'interrompre l'exécution outil par outil, LIA présentait son plan à approuver avant de commencer. L'approbation du plan est aujourd'hui automatique : la validation se fait sur chaque action sensible."},{"adr":9,"date":"2025-11-20","theme":"platform","functional":["f.admin"],"technical":["t.config"],"title":"La configuration découpée par domaine","summary":"Un fichier de configuration de près de 1 800 lignes regroupait tous les réglages. Il est éclaté en modules par domaine, réunis en un seul objet de réglages validé au démarrage, sans changer la façon de l'importer."},{"adr":10,"date":"2025-11-20","theme":"connectors","functional":["f.mail","f.connectors"],"technical":["t.connclients"],"title":"« E-mails », pas « Gmail »","summary":"Le domaine s'appelait Gmail, comme s'il n'existait qu'un fournisseur. Il est renommé de façon générique pour accueillir Outlook, Apple Mail et d'autres sans tout renommer à chaque ajout."},{"adr":11,"date":"2025-12-21","theme":"orchestration","functional":["f.context"],"technical":["t.toolsys"],"title":"Deux familles d'outils","summary":"Faut-il un faux « connecteur » pour les outils internes (contexte, mémoire) ? Non : les outils qui parlent à un service externe et les outils utilitaires restent deux catégories distinctes, chacune avec son patron simple."},{"adr":12,"date":"2025-12-21","theme":"orchestration","functional":["f.context","f.hitl"],"technical":["t.dataregistry","t.toolsys"],"title":"Des résultats structurés et réutilisables","summary":"Les outils renvoyaient du texte brut que rien ne conservait. Un registre de données garde désormais chaque élément retourné, avec ses métadonnées, pour qu'une question suivante puisse y faire référence et qu'un brouillon puisse être confirmé."},{"adr":13,"date":"2025-12-21","theme":"memory","functional":["f.memory"],"technical":["t.postgres","t.embeddings"],"title":"Une mémoire qui survit aux conversations","summary":"L'assistante oubliait tout d'une session à l'autre. Une mémoire long terme, isolée par personne et interrogée par le sens, conserve préférences et faits importants — y compris les sujets sensibles à traiter avec tact."},{"adr":14,"date":"2025-12-21","theme":"orchestration","functional":["f.planning"],"technical":["t.planner"],"title":"Des plans exécutés en parallèle","summary":"Exécuter les outils l'un après l'autre additionnait les délais. Un plan d'exécution exprime dépendances, conditions et secours, et lance en même temps tout ce qui peut l'être."},{"adr":15,"date":"2025-12-21","theme":"connectors","functional":["f.connectors"],"technical":["t.toolsys","t.connclients"],"title":"Une base commune pour les outils connectés","summary":"Chaque outil de connecteur répétait 150 lignes identiques (authentification, erreurs, cache). Une classe de base factorise ce socle ; un nouvel outil n'écrit plus que ce qui lui est propre."},{"adr":16,"date":"2025-12-21","theme":"orchestration","functional":["f.context"],"technical":["t.dataregistry"],"title":"Retrouver « le deuxième » dans n'importe quel domaine","summary":"Chaque domaine identifie et affiche ses éléments différemment. Un registre de types de contexte décrit chaque domaine une fois, et la résolution de « celui-ci » ou « le troisième » fonctionne partout de la même façon."},{"adr":17,"date":"2025-12-21","theme":"reliability","functional":["f.costs"],"technical":["t.redis","t.fastapi"],"title":"Limiter le débit sans bloquer le service","summary":"Il fallait protéger à la fois les utilisateurs contre les abus et les quotas des API externes, même avec plusieurs instances. Une limitation distribuée par Redis, par personne et par catégorie, se replie localement si Redis tombe."},{"adr":18,"date":"2025-12-21","theme":"experience","functional":["f.chat"],"technical":["t.sse","t.web"],"title":"Des réponses qui s'écrivent en direct","summary":"Attendre dix secondes une réponse complète est pénible. Le serveur diffuse chaque mot, les étapes du plan et les demandes d'accord au fil de l'eau par Server-Sent Events."},{"adr":19,"date":"2025-12-21","theme":"orchestration","functional":["f.planning","f.routing"],"technical":["t.toolsys"],"title":"Un catalogue qui décrit agents et outils","summary":"Le planificateur doit savoir quels outils existent, ce qu'ils coûtent et ce qu'ils exigent. Des manifestes typés servent à la fois de documentation et de configuration, filtrés par domaine pour économiser des jetons."},{"adr":20,"date":"2025-12-21","theme":"reliability","functional":["f.diagnostics"],"technical":["t.metrics","t.tracing"],"title":"Trois couches d'observabilité","summary":"Aucun outil ne couvre à lui seul métriques, traces et suivi des appels aux modèles. Prometheus, Tempo et Langfuse travaillent chacun de leur côté, et l'application continue si l'un d'eux tombe."},{"adr":21,"date":"2025-12-21","theme":"security","functional":["f.connectors","f.security"],"technical":["t.connclients","t.redis"],"title":"Des jetons OAuth chiffrés et renouvelés","summary":"Les accès Google devaient rester illisibles en base, se renouveler avant expiration et ne jamais être rafraîchis deux fois en même temps. Chiffrement au repos, rafraîchissement anticipé sous verrou distribué et PKCE en couvrent le cycle de vie."},{"adr":22,"date":"2025-12-21","theme":"orchestration","functional":["f.chat","f.hitl"],"technical":["t.langgraph","t.postgres"],"title":"L'état d'une conversation, sauvegardé","summary":"Pour reprendre après une interruption ou un redémarrage, l'état du graphe est enregistré en PostgreSQL par fil de conversation, avec des règles de fusion qui tronquent l'historique au budget de jetons."},{"adr":23,"date":"2025-12-21","theme":"reliability","functional":["f.provenance"],"technical":["t.fastapi","t.toolsys"],"title":"Une stratégie d'erreurs unifiée","summary":"Chaque partie gérait ses erreurs à sa façon. Un format commun pour les outils, une hiérarchie d'exceptions journalisées et des messages traduits en six langues rendent les erreurs cohérentes et mesurables."},{"adr":24,"date":"2025-12-21","theme":"experience","functional":["f.chat"],"technical":["t.i18n","t.web"],"title":"Six langues, de bout en bout","summary":"L'interface, les messages du serveur et les URL doivent parler la langue de la personne. i18next côté navigateur, gettext côté serveur, six langues et des adresses localisées pour le référencement."},{"adr":25,"date":"2025-12-21","theme":"models","functional":["f.planning"],"technical":["t.promptsys"],"title":"Des prompts gérés comme du code","summary":"Les instructions données aux modèles doivent pouvoir évoluer et revenir en arrière. Elles vivent dans des fichiers versionnés, chargés selon une version configurable et remplis par des variables."},{"adr":26,"date":"2025-12-21","theme":"models","functional":["f.llmconfig"],"technical":["t.llmfactory"],"title":"Le bon modèle pour chaque rôle","summary":"Le routage, la planification et la réponse n'ont pas les mêmes besoins. Chaque composant reçoit son modèle, derrière une abstraction qui permet de changer de fournisseur sans toucher au code."},{"adr":27,"date":"2025-12-21","theme":"reliability","functional":["f.privacy"],"technical":["t.logs"],"title":"Des journaux structurés et sans données personnelles","summary":"Pour être exploités, les journaux doivent être lisibles par une machine. structlog produit du JSON contextualisé (requête, personne, conversation) et filtre les données personnelles avant écriture."},{"adr":28,"date":"2025-12-21","theme":"platform","functional":["f.admin"],"technical":["t.postgres"],"title":"Un schéma de base pensé pour durer","summary":"Identifiants UUID, dates toujours en UTC, suppression logique et métadonnées JSONB : les conventions du schéma PostgreSQL sont fixées une fois pour toute l'application."},{"adr":29,"date":"2025-12-21","theme":"platform","functional":["f.security"],"technical":["t.redis"],"title":"Redis, couteau suisse maîtrisé","summary":"Sessions, états OAuth, limitation de débit, verrous et caches passent par Redis. Chaque usage a sa base, ses expirations et ses opérations atomiques, et l'indisponibilité se dégrade sans bloquer."},{"adr":30,"date":"2025-12-21","theme":"orchestration","functional":["f.context"],"technical":["t.dataregistry","t.router"],"title":"Comprendre « envoie-lui un mail »","summary":"Une conversation est pleine de références implicites : « le deuxième », « celui-ci », « lui ». La résolution de contexte détecte le type de tour et relie ces mots aux bons éléments, sans mélanger les domaines, dans six langues."},{"adr":31,"date":"2025-12-21","theme":"platform","functional":[],"technical":["t.cicd"],"title":"Tester une application qui parle à des modèles","summary":"On ne peut pas appeler de vrais modèles à chaque test. La stratégie simule le fournisseur à sa frontière, isole la base de chaque test et couvre le code asynchrone."},{"adr":32,"date":"2025-12-21","theme":"platform","functional":["f.admin"],"technical":["t.fastapi"],"title":"Une API versionnée et typée","summary":"L'API REST suit une convention unique : préfixe de version, schémas Pydantic validés, routeurs par domaine et un format d'erreur commun, documentés automatiquement."},{"adr":33,"date":"2025-12-21","theme":"platform","functional":[],"technical":["t.docker"],"t dans un même tour sont présentés l'un après l'autre, chacun avec sa décision ; seul un lot déjà approuvé reste groupé."},{"adr":289,"date":"2026-09-16","theme":"experience","functional":["f.hitl","f.workboard"],"technical":["t.hitl","t.web"],"title":"Un brouillon décrit une fois, dessiné partout","summary":"Une carte de brouillon est décrite une seule fois et dessinée selon la surface : carte visuelle dans le chat, texte lisible sur un ticket."},{"adr":290,"date":"2026-09-16","theme":"voice","functional":["f.telephony"],"technical":["t.phone","t.voiceinfra"],"title":"Le téléphone devient un canal","summary":"LIA t'appelle sur un numéro vérifié par un code prononcé, lit tes données pendant l'appel, et ce que tu dis devient ton propre message dans le chat."},{"adr":291,"date":"2026-09-16","theme":"knowledge","functional":["f.bookmarks","f.rag"],"technical":["t.embeddings"],"title":"Les réponses conservées deviennent consultables","summary":"Chaque réponse conservée est indexée dans un espace de connaissances personnel : LIA peut la retrouver quand tu lui en reparles."},{"adr":292,"date":"2026-09-17","theme":"memory","functional":["f.journals","f.memory","f.habits","f.interests"],"technical":["t.promptsys"],"title":"Un portrait qui dit ses sources","summary":"Ton portrait se nourrit de quatre sources — souvenirs, intérêts, habitudes, relations — et dit lesquelles il a pu lire."},{"adr":293,"date":"2026-09-17","theme":"orchestration","functional":["f.react"],"technical":["t.react","t.embeddings"],"title":"La boucle ReAct choisit ses outils par pertinence","summary":"Au lieu d'un catalogue coupé dans l'ordre d'enregistrement, la boucle ReAct lie les outils les plus pertinents pour ta question, en couvrant chaque famille."},{"adr":294,"date":"2026-09-17","theme":"experience","functional":["f.psyche"],"technical":["t.web"],"title":"Un visage qui ne rejoue jamais la même scène","summary":"Sourcils posés sur l'œil, parole générée syllabe par syllabe, gestes variés et petites
