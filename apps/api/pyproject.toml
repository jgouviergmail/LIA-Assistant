[project]
name = "lia-api"
version = "1.30.9"
description = "LIA Assistant - AI conversational assistant with multi-agent orchestration"
license = "AGPL-3.0-or-later"
authors = [
    {name = "LIA Contributors"},
]
# Bounded to the range actually exercised (audit F041): 3.12 in Docker/CI/prod,
# 3.13 on developer hosts. Both are proven by the CI matrix (test-backend runs
# on 3.12 and 3.13). Untested majors (3.14+) are excluded until added to CI.
requires-python = ">=3.12,<3.14"
# NOTE: Dependencies are declared in requirements.txt / requirements-dev.txt
# (intent manifests) and installed from the compiled lockfiles
# requirements.lock.txt / requirements-dev.lock.txt (ADR-112, `task deps:lock`).
# This pyproject.toml file is only used for dev tools (black, ruff, mypy, pytest)
dependencies = []

[project.urls]
Homepage = "https://github.com/jgouviergmail/LIA-Assistant"
Repository = "https://github.com/jgouviergmail/LIA-Assistant"

# NOTE (2026-07-20) : pas de dependances ici.
# ADR-112 fait de requirements.txt / requirements-dev.txt les MANIFESTES, et des
# lockfiles compiles (`task deps:lock`) ce que tout environnement installe. Une
# section [project.optional-dependencies] dupliquerait ces pins sans aucun garde
# CI pour detecter la derive (check_requirements_lock.py compare manifestes et
# lockfiles, jamais pyproject). Ce fichier ne sert qu'a la configuration des
# outils : black, ruff, mypy, pytest.

[tool.black]
line-length = 100
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | alembic/versions
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
# Make Ruff format compatible with Black
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "UP042", # replace-str-enum (StrEnum migration deferred — 57 occurrences)
    "UP045", # non-pep604-annotation-optional (Optional[X] → X | None, cosmetic)
    "UP046", # non-pep695-generic-class (cosmetic)
    "UP047", # non-pep695-generic-function (cosmetic)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"alembic/*" = ["F401", "E501", "I001"]  # Alembic migrations - ignore import order
"alembic/versions/*" = ["F401", "E501", "I001"]
"src/domains/*/models.py" = ["F821"]  # SQLAlchemy forward references
"tests/**/*.py" = ["B017"]  # pytest.raises(Exception) is acceptable in tests
"scripts/**/*.py" = ["E402", "B007", "F401"]  # Scripts may have late imports and unused vars

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
# Type-check against the DEPLOYMENT target (Linux containers), not the
# developer host. Aligns the host pre-commit hook with the Linux CI runner so
# POSIX-only APIs (resource, os.setuid/setgroups, os.fork) resolve identically
# on both — closes the recurring host/Docker mypy divergence.
platform = "linux"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
strict_optional = true

[[tool.mypy.overrides]]
module = [
    # NOTE: "slowapi.*" was removed with the unenforced SlowAPI limiter (SEC-016).
    # The `slowapi` package itself is still pinned in requirements.txt and is now
    # unused — dropping it needs `task deps:lock` (ADR-112), so it is left for a
    # dedicated dependency change rather than regenerating the lockfile here.
    "prometheus_client.*",
    "pgvector.*",
    "langchain.agents.middleware.*",
    "anthropic.*",
    "langfuse.*",
    "langchain_deepseek.*",
    "apscheduler.*",
    "jinja2.*",
    "transformers.*",
    "sentence_transformers.*",
    "edge_tts.*",
    "networkx.*",
    "firebase_admin.*",
    "rank_bm25.*",
    "readability.*",
    "markdownify.*",
    "telegram.*",
    "pydub.*",
    "geoip2.*",
    "caldav.*",
    "imap_tools.*",
    "vobject.*",
    "lxml.*",
    "mcp.*",
    "sherpa_onnx.*",
    "yaml.*",
    "dateutil.*",
    "docx.*",
    "striprtf.*",
    "qrcode.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["src.domains.*.models"]
disable_error_code = ["name-defined"]

# ---------------------------------------------------------------------------
# Internal typing-debt exemptions (audit F020, measure_mypy_debt.py ratchet).
#
# Each block below is scoped to the error codes that its module(s) STILL emit,
# measured by running MyPy with every ``disable_error_code`` stripped
# (``scripts/audit/measure_mypy_debt.py --measure-errors``). Dead exemptions —
# codes that suppressed zero real errors — were removed, which re-enables strict
# checking for those codes going forward. No ``Any``, ``cast``, or blanket
# ``# type: ignore`` was introduced: this is pure exemption-surface tightening.
# The (module, code) surface is frozen shrink-only in ``.mypy-debt-baseline.json``.
# ---------------------------------------------------------------------------

# LangGraph pipeline: TypedDict state access and the dynamic plan executor
# trigger literal-required/index/typeddict-item false positives.
[[tool.mypy.overrides]]
module = ["src.domains.agents.nodes.*"]
disable_error_code = ["literal-required", "index", "arg-type", "operator", "attr-defined", "no-untyped-def", "no-any-return", "var-annotated", "misc", "union-attr", "dict-item", "return-value", "call-overload", "assignment"]

[[tool.mypy.overrides]]
module = ["src.domains.agents.graph"]
disable_error_code = ["index", "no-any-return", "type-var"]

[[tool.mypy.overrides]]
module = ["src.domains.agents.orchestration.*"]
disable_error_code = ["literal-required", "index", "arg-type", "operator", "attr-defined", "no-untyped-def", "typeddict-item", "no-any-return", "var-annotated", "union-attr", "assignment"]

# response_node.py is matched by the wildcard above but carries a concrete
# section (concrete wins for disable_error_code) scoped to its own residue.
[[tool.mypy.overrides]]
module = ["src.domains.agents.nodes.response_node"]
disable_error_code = ["no-any-return", "arg-type", "return-value", "union-attr", "attr-defined"]

# Agent framework — context resolution, tools and utilities use dynamic domain
# resolution; LangChain v1.0 callback/middleware patterns surface arg-type/misc.
[[tool.mypy.overrides]]
module = ["src.domains.agents.context.*"]
disable_error_code = ["no-any-return", "no-untyped-def", "arg-type", "misc", "assignment", "index", "attr-defined"]

# ``unused-ignore`` is retained here: several tools carry inline
# ``# type: ignore`` comments that this block's other disabled codes make
# redundant — dropping it would surface unused-ignore on those lines.
[[tool.mypy.overrides]]
module = ["src.domains.agents.tools.*"]
disable_error_code = ["no-any-return", "no-untyped-def", "arg-type", "misc", "call-arg", "assignment", "return-value", "var-annotated", "index", "operator", "union-attr", "attr-defined"]

[[tool.mypy.overrides]]
module = ["src.domains.agents.utils.*"]
disable_error_code = ["no-any-return", "no-untyped-def", "arg-type", "assignment", "dict-item", "return-value", "union-attr"]

[[tool.mypy.overrides]]
module = ["src.domains.agents.graphs.base_agent_builder"]
disable_error_code = ["arg-type", "dict-item", "index", "union-attr", "attr-defined"]

[[tool.mypy.overrides]]
module = ["src.domains.agents.services.hitl.*"]
disable_error_code = ["no-any-return", "arg-type", "var-annotated", "operator", "unused-ignore", "attr-defined", "call-overload"]

# Domain services with dynamic payloads / provider variance.
[[tool.mypy.overrides]]
module = ["src.domains.conversations.service"]
disable_error_code = ["arg-type", "assignment", "index", "operator", "attr-defined"]

[[tool.mypy.overrides]]
module = ["src.domains.connectors.clients.*"]
disable_error_code = ["no-any-return", "no-untyped-def", "arg-type", "call-arg", "assignment", "var-annotated"]

# LLM infrastructure: provider adapters return Awaitable[T] | T (redis-style
# false positives) and use dynamic callback patterns.
[[tool.mypy.overrides]]
module = ["src.infrastructure.llm.*"]
disable_error_code = ["no-any-return", "arg-type", "assignment", "override", "union-attr", "unused-ignore", "attr-defined"]

# NOTE (F020): the exemption surface was ratcheted from 481 → 91 (module, code)
# pairs. Modules removed entirely from the blocks above now type-check under
# strict MyPy with NO exemptions — via dead-exemption removal (no code change)
# and via genuine typed fixes (isinstance narrowing, precise annotations,
# TypedDict configs, TYPE_CHECKING/string forward-refs). No ``Any``, ``cast``,
# or blanket ``# type: ignore`` was introduced. See git history + the
# .mypy-debt-baseline.json ``pairs`` list for the current authoritative surface.

[tool.pytest.ini_options]
minversion = "9.0"
# Coverage gate ratchet doctrine: +2 points per release, never lowered
# (see docs/guides/GUIDE_TESTING.md and ADR-113). Keep in sync with ci.yml.
addopts = "-ra -q --strict-markers --cov=src --cov-report=term-missing --cov-report=html --cov-fail-under=66"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # Unclosed async resources (DB engine pool, Redis client, transports) that
    # surface as a pytest "unraisable" during a run are an ERROR, not a warning
    # — a green exit code must never hide a leaked socket (the false-green class
    # the audit flagged on task test:backend:unit:fast). Every client/session/
    # engine has an owner that closes it on its loop (per-test fixtures in the
    # agents suite; the session-scoped worker teardown in tests/unit/conftest.py
    # for app-booting unit tests). The narrowly-scoped ``ignore`` entries below
    # (pytest-asyncio self-pipe, starlette httpx) stay ahead of nothing — this
    # ``error`` only bites genuinely unclosed resources.
    "error::pytest.PytestUnraisableExceptionWarning",
    # AC-012: any call to a deprecated redis-py command API (setex, getset, …)
    # is an ERROR in every suite. Scoped by redis-py's exact deprecation
    # message prefix, not a broad category filter — the 27 setex call sites
    # were migrated to `set(..., ex=ttl)` and must never come back.
    "error:Call to deprecated:DeprecationWarning",
    # asyncio event-loop self-pipe transport occasionally GC'd after pytest-asyncio
    # tears down the per-test loop (asyncio_default_fixture_loop_scope="function") on
    # Windows. The tracemalloc allocation traceback contains ONLY pytest/pytest-asyncio
    # frames (no application or test code), confirming it is loop infrastructure, not a
    # leak in our code. Non-deterministic (GC attributes it to a random test), so it
    # cannot be fixed at a source site. Scoped to the transport-leak message + category.
    "ignore:unclosed transport:ResourceWarning",
    # starlette.testclient (imported via fastapi.testclient in conftest) deprecates
    # its httpx transport in favor of the httpx2 package. The real fix is a pinned
    # dependency migration (requirements manifests + `task deps:lock`, ADR-112) —
    # tracked as debt, not a test-code issue. Scoped to that exact deprecation
    # (StarletteDeprecationWarning subclasses UserWarning, not DeprecationWarning).
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
    # F028: asyncpg finalizes a GC'd Connection with a pending ``Connection._cancel``
    # coroutine that nobody awaits — a DRIVER teardown artifact at process shutdown,
    # non-deterministically attributed to whichever frame the GC runs in, NOT a
    # test-code await bug. The test-code class of un-awaited coroutine (AsyncMock's
    # ``_execute_mock_call``) is caught deterministically and made a hard failure by
    # ``tests/_coroutine_leak_guard.py``; this scoped ignore only silences the driver
    # artifact so it cannot mask that gate or flake the suite.
    #
    # BOUNDED ALLOWLIST (audit F028): this ignore is accepted ONLY for the pinned
    # asyncpg version and must be re-evaluated on any bump.
    #   driver:    asyncpg==0.31.0 (see requirements.txt)
    #   scope:     whole agents suite under warnings-as-errors; no single nodeid
    #              (GC attribution is non-deterministic across the run)
    #   owner:     backend-platform
    #   review_by: 2026-10-01
    #   guard:     tests/unit/test_asyncpg_cancel_allowlist_guard.py fails when the
    #              pinned version changes, forcing a re-check of whether the driver
    #              still leaks and this ignore is still needed.
    "ignore:coroutine 'Connection\\._cancel' was never awaited:RuntimeWarning",
]
pythonpath = ["."]
markers = [
    "e2e: End-to-end integration tests (deselect with '-m \"not e2e\"')",
    "integration: Integration tests requiring external services (Redis, DB)",
    "multiprocess: Multi-process tests for horizontal scaling simulation",
    "benchmark: Performance benchmark tests",
    "slow: Slow tests excluded from pre-commit hooks",
    "browser: Tests requiring Playwright browser (evolution F7)",
]
# Profiling configuration
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
log_file = "tests/profiling.log"
log_file_level = "INFO"
log_file_format = "%(asctime)s [%(levelname)s] %(name)s: %(message)s"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
