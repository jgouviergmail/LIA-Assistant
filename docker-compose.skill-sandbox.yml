# Skill-script sandbox overlay (ADR-215, B15 split).
#
# Grants the API service the Docker socket + host docker group required by
# the container-sandboxed script skills (SEC-001, skills/executor.py runs
# `docker run` against SKILLS_SCRIPT_SANDBOX_IMAGE). This is a deliberate
# privilege: generic self-host installs run WITHOUT this file (script skills
# stay off in the base); selecting the capability is an explicit operator
# choice:
#
#   COMPOSE_FILE=docker-compose.prod.yml:docker-compose.skill-sandbox.yml
#
# Compose overlays APPEND volumes and environment entries to the base.
#
# ADR-298: the same overlay carries the sandbox EGRESS proxy — the only way a
# model-written script may reach the Internet. It belongs here and not in the
# base because it exists for the sandbox alone: without the socket there is no
# sandbox, and without a sandbox a proxy would guard nothing. See the dev
# compose for the full commentary; the two declarations are held identical by
# tests/unit/test_self_host_compose_contract.py.
services:
  api:
    group_add:
      - "${DOCKER_GID:-999}" # Host docker group GID for socket access
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The API renders the egress ruleset and reads the management token here;
      # it never mounts the CA key volume.
      - lia-egress-config:/etc/lia-egress/config
    environment:
      - SKILLS_SCRIPTS_ENABLED=true
      - PYTHON_SANDBOX_EGRESS_ENABLED=true
    depends_on:
      egress:
        condition: service_healthy

  egress:
    image: ironsh/iron-proxy:0.49.0@sha256:c4628019c24f4cc8d77564a26b7c9cedb00accee6f93d06270e85fb8f9c6a7da
    restart: unless-stopped
    user: "${LIA_RUNTIME_UID:-1000}"
    # The entrypoint mints the CA, the management token and the bootstrap
    # ruleset as THIS uid into the three tmpfs volumes, then execs iron-proxy
    # (see infrastructure/sandbox-egress/entrypoint.sh). No init container, no
    # root, no chown.
    entrypoint: ["/bin/sh", "/opt/lia-egress/entrypoint.sh"]
    volumes:
      - ./infrastructure/sandbox-egress:/opt/lia-egress:ro
      - lia-egress-ca:/etc/lia-egress/ca
      - lia-egress-key:/etc/lia-egress/key
      - lia-egress-config:/etc/lia-egress/config
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks:
      - lia-sandbox
      - lia-network
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    mem_limit: 256m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9094/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  lia-egress-ca:
    name: lia-egress-ca
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "uid=${LIA_RUNTIME_UID:-1000},mode=0755"
  lia-egress-key:
    name: lia-egress-key
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "uid=${LIA_RUNTIME_UID:-1000},mode=0700"
  lia-egress-config:
    name: lia-egress-config
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: "uid=${LIA_RUNTIME_UID:-1000},mode=0700"

networks:
  lia-sandbox:
    name: lia-sandbox
    internal: true
