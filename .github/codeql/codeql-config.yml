name: "CodeQL Configuration"

# What ships, or runs on the operator's behalf, is analysed (ADR-326):
#   - the two applications' sources;
#   - `apps/api/scripts` — `COPY . .` puts them in the production image;
#   - `infrastructure/` — entrypoints, the sandbox egress, the DevOps CLI;
#   - `scripts/deploy`, `scripts/install`, `scripts/release` — what runs on
#     the operator's hosts (the probes and analyses under `scripts/` do not);
#   - the mobile shell's own scripts and config;
#   - the workflows, for the `actions` language (a workflow injection is a
#     supply-chain hole no other language sees).
# A local scan of HEAD with no restriction at all (2026-09-30, CodeQL 2.27.1)
# found 894 results outside the former two paths: 795 in `alembic` (the
# `revision`/`down_revision` convention, still excluded below), the rest in
# scripts — and no product vulnerability. The perimeter is widened so that
# stays measured rather than assumed.
paths:
  - 'apps/api/src/**'
  - 'apps/api/scripts/**'
  - 'apps/web/src/**'
  - 'apps/mobile/**'
  - 'infrastructure/**'
  - 'scripts/deploy/**'
  - 'scripts/install/**'
  - 'scripts/release/**'
  - '.github/workflows/**'

# Exclude non-production code that generates false positives
paths-ignore:
  # Tests — assertions, pytest.raises patterns, mock data trigger false positives.
  # `__tests__` is listed explicitly: `**/tests/**` does NOT match it, so every
  # frontend test directory (31 of them under apps/web/src) was analysed despite
  # the intent above — that is where the js/clear-text-cookie alerts on
  # useLiaGender.test.ts came from. Backend tests live outside `apps/api/src`,
  # so `paths` already excludes them.
  - '**/test/**'
  - '**/tests/**'
  - '**/__tests__/**'
  # Build artifacts and dependencies
  - '**/node_modules/**'
  - '**/dist/**'
  - '**/build/**'
  - '**/__pycache__/**'
  - '**/.venv/**'
  # Database migrations — Alembic uses module-level variables (revision, down_revision,
  # branch_labels, depends_on) read by introspection, not direct reference
  - '**/migrations/**'
  - '**/alembic/**'
  # Documentation templates
  - 'docs/**'
  # A throwaway tree a probe leaves behind (never shipped, never run by us)
  - 'tmp/**'

# Keep default queries enabled
disable-default-queries: false

# Exclude rules that produce excessive false positives in this codebase
query-filters:
  # Unused imports: Python re-exports (noqa: F401), TYPE_CHECKING guards,
  # SQLAlchemy side-effect imports are all legitimate patterns
  - exclude:
      id: py/unused-import
  # Unused global variables: Alembic conventions (revision, down_revision),
  # pytest fixtures, __all__ re-exports, module-level singletons
  - exclude:
      id: py/unused-global-variable
  # Ineffectual statements: Docstrings on class attributes, type: ignore comments,
  # and expression-level annotations are intentional Python patterns
  - exclude:
      id: py/ineffectual-statement
  # Import-and-import-from: Common in large codebases with both package-level
  # and specific imports (e.g., import structlog + from structlog import get_logger)
  - exclude:
      id: py/import-and-import-from
  # Cyclic imports: All instances use TYPE_CHECKING guards (standard Python pattern
  # for type annotations without runtime circular dependency)
  - exclude:
      id: py/unsafe-cyclic-import
  - exclude:
      id: py/cyclic-import
  # Repeated imports: Intentional in files with conditional/lazy imports
  - exclude:
      id: py/repeated-import
  # Mixed returns: Helper functions (raise_permission_denied, raise_internal_error, etc.)
  # are typed -> NoReturn but CodeQL does not track this annotation, causing false
  # positives in functions that delegate error-raising to shared helpers
  - exclude:
      id: py/mixed-returns
  # No SECURITY rule is excluded here any more (ADR-326). `py/bad-tag-filter`,
  # `js/disabling-certificate-validation` and `py/partial-ssrf` used to be, each
  # for a case that was sound — a display heuristic, a dev-only TLS switch, the
  # Google proxies with their hardcoded hosts — but a global exclusion hides the
  # NEXT occurrence anywhere in the tree. Measured on a local scan of HEAD: the
  # three rules hide exactly the three known sites and nothing else. Each is
  # dismissed on GitHub with its written reason instead, where a new finding of
  # the same rule surfaces as an alert of its own.

# Query suites
queries:
  - uses: security-and-quality
  - uses: security-extended
