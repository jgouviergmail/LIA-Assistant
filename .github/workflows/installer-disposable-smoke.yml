name: Installer Disposable Smoke

# ADR-215 G3/G4: prove the self-host installer on CLEAN disposable hosts —
# both native architectures, both modes — against a hermetic fake provider.
# Manual dispatch ONLY, behind an approval environment. This workflow can
# never run from a push and never touches a real provider, hostname, or
# credential. Its evidence file is what the release promotion verifies.

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: "Run ID of the candidate release build to qualify"
        required: true

permissions:
  contents: read
  actions: read
  # Prebuilt legs pull the candidate images from GHCR by digest. The package
  # is public at release time, but the candidate digests are qualified BEFORE
  # publication — authenticated pulls keep the legs independent of package
  # visibility timing.
  packages: read

env:
  # Hermetic provider endpoints — the ONLY provider surface in this workflow.
  OPENAI_BASE_URL: http://fake-provider:18080/v1
  QWEN_BASE_URL: http://fake-provider:18080/v1
  DEEPSEEK_BASE_URL: http://fake-provider:18080/v1
  FAKE_PROVIDER_KEY: sk-fake-qualification-key

jobs:
  qualify:
    name: ${{ matrix.platform }} / ${{ matrix.mode }}
    environment: installer-disposable-smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            mode: local
          - platform: linux/amd64
            runner: ubuntu-24.04
            mode: prebuilt
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            mode: local
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            mode: prebuilt
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Derive the unique disposable project name
        id: project
        run: |
          set -euo pipefail
          project="lia-installer-smoke-${{ github.run_id }}-$(echo '${{ matrix.platform }}-${{ matrix.mode }}' | tr '/' '-')"
          if ! echo "$project" | grep -Eq '^lia-installer-smoke-[a-zA-Z0-9-]+$'; then
            echo "::error::project name '$project' outside the required prefix" >&2
            exit 1
          fi
          echo "name=$project" >> "$GITHUB_OUTPUT"

      - name: Register the scoped cleanup trap BEFORE any Compose call
        run: |
          set -euo pipefail
          cat > cleanup.sh <<'EOF'
          #!/bin/sh
          # Cleanup selects EXACTLY this project — no prune, no unscoped removal.
          set -x
          docker compose -p "$1" down --volumes --remove-orphans || true
          EOF
          chmod +x cleanup.sh

      - name: Download the candidate bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Artifact NAME per release.yml's upload (`self-host-candidate`,
          # containing lia-self-host-bundle.tar.gz at its root). The old
          # `lia-self-host-bundle` name matched nothing — every matrix leg
          # died on "no artifact matches" (measured on the v1.30.1
          # qualification attempt).
          gh run download "${{ github.event.inputs.candidate_run_id }}" \
            -R "${{ github.repository }}" \
            --name self-host-candidate --dir candidate
          mkdir -p work && tar -xzf candidate/lia-self-host-bundle.tar.gz -C work

      - name: Stage the qualification runtime harness
        working-directory: work
        run: |
          set -euo pipefail
          # The bundle ships scripts/install WITHOUT tests/ (by design), so
          # the parent directory must be created first. The old
          # `cp ... || true` swallowed exactly that failure: the harness was
          # never staged and the post-install probes step died on a missing
          # assert_install.py after a fully green install (measured on the
          # v1.30.1 qualification). Loud by construction now.
          mkdir -p scripts/install/tests
          cp -r ../scripts/install/tests/runtime scripts/install/tests/runtime
          test -f scripts/install/tests/runtime/assert_install.py

      - name: Stage the qualification-stamped manifest (prebuilt only)
        if: matrix.mode == 'prebuilt'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The wizard refuses any manifest not stamped qualification="passed"
          # (preflight.resolve_install_mode) — a real user only ever receives
          # the stamped manifest from the published release. This workflow IS
          # the qualification producing that stamp, so its prebuilt legs
          # pre-stamp their own working copy; the candidate artifact itself
          # is never modified. Without this staging the prebuilt legs
          # silently resolved to LOCAL mode (no adjacent manifest at the
          # bundle root) and the matrix qualified local twice (measured on
          # the v1.30.1 qualification).
          python3 - <<'EOF'
          import json
          import pathlib

          manifest = json.loads(
              pathlib.Path("candidate/lia-self-host-manifest.json").read_text()
          )
          manifest["qualification"] = "passed"
          pathlib.Path("work/lia-self-host-manifest.json").write_text(
              json.dumps(manifest, indent=1) + "\n"
          )
          EOF
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Run the installer non-interactively (${{ matrix.mode }})
        working-directory: work
        env:
          ADMIN_PASSWORD: Xx12!!abcdA9$Z
        run: |
          set -euo pipefail
          umask 077
          cat > answers.env <<EOF
          wizard_language=en
          exposure=lan
          server_host=127.0.0.1
          admin_email=admin@qualification.lia
          admin_name=Smoke
          default_language=en
          observability=no
          skill_sandbox=no
          admin_password=$ADMIN_PASSWORD
          provider_key_deepseek=$FAKE_PROVIDER_KEY
          provider_key_openai=$FAKE_PROVIDER_KEY
          EOF
          chmod 600 answers.env
          # Explicit flag per mode: with NO flag the wizard resolves the mode
          # from the adjacent manifest, and a candidate (or absent) manifest
          # falls back to LOCAL — the prebuilt legs must demand their mode.
          if [ "${{ matrix.mode }}" = "local" ]; then
            mode_flag="--local-build"
          else
            mode_flag="--prebuilt"
          fi
          # NO cleanup trap here: `trap ... EXIT` fires on step SUCCESS too,
          # so it tore the freshly verified stack down the moment this step
          # ended — the probes then hit a removed web container (measured on
          # the v1.30.1 qualification). The `if: always()` cleanup step at
          # the end of the job is the single owner of teardown, and on
          # failure the dump steps must still find the stack alive first.
          COMPOSE_PROJECT_NAME="${{ steps.project.outputs.name }}" \
            ./install.sh $mode_flag --non-interactive --answers answers.env

      - name: Apply the hermetic fake-provider overlay
        working-directory: work
        run: |
          set -euo pipefail
          # docker-compose.disposable.yml adds the fake provider and points
          # OPENAI/QWEN/DEEPSEEK base URLs at it for the API service. It was
          # designed for exactly this harness and referenced by NOTHING — the
          # SSE chat probe would have reached the real providers with a fake
          # key. Applied AFTER the wizard's own sequence on purpose: the
          # public installer must be qualified unmodified, the overlay only
          # reshapes the already-verified stack for hermetic probing.
          files="-f docker-compose.prod.yml -f docker-compose.install.yml"
          if [ "${{ matrix.mode }}" = "prebuilt" ]; then
            files="$files -f docker-compose.images.yml"
          fi
          files="$files -f scripts/install/tests/runtime/docker-compose.disposable.yml"
          docker compose -p "${{ steps.project.outputs.name }}" $files \
            up -d --no-build api fake-provider
          # The recreation restarts the API (~40 s boot): the probes have no
          # readiness wait of their own, so the gate lives here.
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/ready >/dev/null && break
            if [ "$i" = "60" ]; then
              echo "::error::API not ready 180s after the overlay recreation" >&2
              exit 1
            fi
            sleep 3
          done

      - name: Post-install probes (login, SSE chat, image identities)
        working-directory: work
        env:
          ADMIN_PASSWORD: Xx12!!abcdA9$Z
        run: |
          set -euo pipefail
          manifest_args=""
          if [ "${{ matrix.mode }}" = "prebuilt" ]; then
            manifest_args="--manifest lia-self-host-manifest.json --platform ${{ matrix.platform }} --project ${{ steps.project.outputs.name }}"
          fi
          python3 -B scripts/install/tests/runtime/assert_install.py \
            --base-url http://127.0.0.1:3000 \
            --admin-email admin@qualification.lia \
            --admin-password-env ADMIN_PASSWORD \
            $manifest_args

      - name: Seed failure injection — atomic rollback then clean retry
        working-directory: work
        run: |
          set -euo pipefail
          python3 -B scripts/install/tests/runtime/inject_seed_failure.py arm
          python3 -B scripts/install/tests/runtime/inject_seed_failure.py disarm

      # The failure dumps sit AFTER every probing step on purpose: an
      # `if: failure()` step only fires when the job is already failing at
      # its own position, so dumps placed right after the install step
      # covered install failures only — the probe failures that followed had
      # no evidence at all (measured on the v1.30.1 qualification).
      - name: Dump the redacted install log on failure
        if: failure()
        working-directory: work
        run: |
          # install.log is the ONLY place the failing command's redacted
          # stderr tail lands (StepFailed.detail) — without this dump a
          # matrix failure costs a full run and teaches nothing.
          test -f install.log && cat install.log || echo "no install.log produced"

      - name: Dump the stack state on failure
        if: failure()
        run: |
          # A readiness_timeout carries no detail by construction (nothing
          # failed — something never became true): the container states and
          # logs are the only evidence. Hermetic disposable instance, fake
          # data only — nothing sensitive can land in these logs.
          p="${{ steps.project.outputs.name }}"
          docker compose -p "$p" ps -a || true
          for svc in postgres redis api web fake-provider; do
            echo "::group::logs $svc"
            docker compose -p "$p" logs --no-color --tail 300 "$svc" || true
            echo "::endgroup::"
          done

      - name: Emit qualification evidence
        run: |
          set -euo pipefail
          # Canonical evidence row for scripts/release/self_host_manifest.py:
          # candidate_sha256 binds the MANIFEST file (hash_file(candidate) in
          # the promotion CLI), platform/mode are separate fields, and the
          # verify job in release.yml merges the four rows into the single
          # {candidate_sha256, rows: []} document the CLI validates. The old
          # emission hashed the bundle tarball into a `row` string — a shape
          # nothing downstream could consume (measured on the v1.30.1
          # promotion: sha mismatch by construction).
          candidate_sha="$(sha256sum candidate/lia-self-host-manifest.json | cut -d' ' -f1)"
          printf '{"candidate_sha256": "%s", "platform": "%s", "mode": "%s", "result": "passed", "run_id": "%s"}\n' \
            "$candidate_sha" "${{ matrix.platform }}" "${{ matrix.mode }}" "${{ github.run_id }}" \
            > "qualification-evidence-$(echo '${{ matrix.platform }}-${{ matrix.mode }}' | tr '/' '-').json"

      - name: Upload evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-evidence-${{ strategy.job-index }}
          path: qualification-evidence-*.json

      - name: Cleanup (exact project only)
        if: always()
        run: ./cleanup.sh "${{ steps.project.outputs.name }}"
