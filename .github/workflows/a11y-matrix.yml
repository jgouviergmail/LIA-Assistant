name: A11y Browser Matrix (periodic)

# AC-002: engine-diverse accessibility evidence. The PR smoke (ci.yml
# e2e-frontend) is Chromium-only for speed; this weekly job replays the SAME
# hermetic Playwright + axe suite on Firefox and WebKit as well, so contrast,
# names/roles and reflow are proven across rendering engines. Reports are
# archived per run. The manual assistive-technology campaign
# (NVDA/Firefox, VoiceOver/Safari) is documented in docs/a11y/AT_CAMPAIGN.md.

on:
  schedule:
    # Monday 05:30 UTC — before the work week starts.
    - cron: "30 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  a11y-browser-matrix:
    name: E2E + a11y (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-jammy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      - name: Install E2E dependencies (reproducible)
        working-directory: ./apps/web/e2e
        run: npm ci --no-audit --no-fund

      - name: Run suite on all three engines
        working-directory: ./apps/web/e2e
        env:
          CI: "true"
          E2E_MANAGED_SERVER: "1"
          E2E_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: ""
          E2E_ALL_BROWSERS: "1"
          # Firefox refuses to start when $HOME is not owned by the current
          # user, which is exactly what Actions sets up inside this container:
          # every Firefox project failed with "Failed to launch the browser
          # process" while Chromium passed, so the run reported an
          # accessibility failure that was really an environment one. Scoped to
          # this step so the pnpm/npm caches of the earlier steps keep their own
          # HOME. The workaround is the one Playwright itself prints.
          HOME: /root
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: a11y-matrix-report
          path: apps/web/e2e/playwright-report
          retention-days: 30
