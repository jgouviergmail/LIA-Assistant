name: Release

# Two NON-OVERLAPPING graphs (ADR-215, B02/B15):
# - a tag push builds CANDIDATE artifacts (digest-addressed, unqualified) and
#   publishes their hashes — it can never qualify or promote them;
# - only a later manual dispatch, carrying the exact candidate and
#   qualification run IDs, verifies the hash-bound disposable evidence and
#   promotes the SAME digests to semver tags without any rebuild.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: "Run ID of the candidate build (this workflow, tag push)"
        required: true
      qualification_run_id:
        description: "Run ID of the approved installer-disposable-smoke run"
        required: true

permissions:
  contents: write
  packages: write
  actions: read # require-green-ci + evidence verification read workflow runs

env:
  REGISTRY: ghcr.io

jobs:
  # F008: a tag push must NOT publish images or cut a release for a commit whose
  # CI (ci.yml) is not green. This gate requires the latest COMPLETED ci.yml run
  # for the tagged SHA to have concluded 'success' before anything is built.
  require-green-ci:
    name: Require green CI for the tagged commit
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Verify ci.yml succeeded for this SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          conclusion="$(gh run list --workflow=ci.yml --commit "$sha" \
            --json conclusion,status \
            --jq 'map(select(.status=="completed"))[0].conclusion // ""' \
            -R "${{ github.repository }}")"
          echo "ci.yml conclusion for ${sha}: ${conclusion:-<none>}"
          if [ "${conclusion}" != "success" ]; then
            echo "::error::Release blocked — ci.yml for ${sha} is '${conclusion:-missing/incomplete}', not 'success'. Ensure CI is green on the tagged commit, then re-run this release." >&2
            exit 1
          fi

  build-candidates:
    name: Build candidate images (digest-addressed)
    needs: require-green-ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # The arm64 half is emulated through QEMU, and `pnpm install` under that
    # emulation can HANG rather than merely run slow: on 2026-08-24 the web
    # image stopped emitting output at `[linux/arm64 deps 6/6]` and printed
    # nothing for 5 h 54 min, until GitHub's own 6-hour ceiling killed it --
    # six hours of runner time, and a release blocked, to learn nothing.
    # Measured over the preceding runs, a legitimate build takes 25-30 min
    # (api) and 34-39 min (web); 90 min leaves more than twice the margin of
    # the slowest one while turning a hang into a fast, legible failure.
    timeout-minutes: 90
    strategy:
      matrix:
        include:
          - app: api
            context: ./apps/api
            dockerfile: ./apps/api/Dockerfile.prod
          - app: web
            context: .
            dockerfile: ./apps/web/Dockerfile.prod

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Free ~25 GB of preinstalled toolchains the runner does not need. The
      # multi-arch (amd64 + arm64) build of both the api and web prod images
      # otherwise exhausts the runner's ~14 GB free disk ("No space left on
      # device"), which failed the v1.21.4 / v1.21.5 releases.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR refuses an image reference whose repository part contains an
      # uppercase letter, and `github.repository` preserves the owner's
      # casing (jgouviergmail/LIA-Assistant). Workflow expressions have no
      # lowercase function, so the namespace is folded here, once, and every
      # reference below is built from it — including the digest identity that
      # the manifest carries into promote-images.
      - name: Fold the registry namespace to lowercase (GHCR requirement)
        run: echo "IMAGE_NS=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # Candidate tags are registry STAGING handles only (sha-<commit>).
      # Semver tags are attached exclusively by promote-images, from the
      # already-qualified digests, without rebuilding (B02).
      - name: Build and push candidate
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NS }}/${{ matrix.app }}:sha-${{ github.sha }}
          # Host-neutral release artifacts (B03/ADR-215): explicit empty API
          # URL = same-origin contract; no app URL is ever baked. API
          # provenance args come from the release context (B02).
          # NEXT_PUBLIC_SHOWROOM_PROOF_SHA is github.sha on purpose: on a tag
          # push that IS the commit the tag points at, so the proof links are
          # automatically immutable and correct — no manual step, and no way
          # to bake an annotated-tag object SHA by mistake. The variant stays
          # a deliberate repository setting (default: legacy).
          build-args: |
            NEXT_PUBLIC_API_URL=
            NEXT_PUBLIC_PUBLIC_SHOWROOM_VARIANT=${{ vars.PUBLIC_SHOWROOM_VARIANT || 'legacy' }}
            NEXT_PUBLIC_SHOWROOM_PROOF_SHA=${{ github.sha }}
            APP_VERSION=${{ github.ref_name }}
            GIT_COMMIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record candidate digest identity
        run: |
          set -euo pipefail
          repo="${{ env.REGISTRY }}/${{ env.IMAGE_NS }}/${{ matrix.app }}"
          digest="${{ steps.build.outputs.digest }}"
          raw="$(docker buildx imagetools inspect --raw "${repo}@${digest}")"
          amd64_manifest="$(echo "$raw" | jq -r '.manifests[] | select(.platform.architecture=="amd64" and .platform.os=="linux") | .digest')"
          arm64_manifest="$(echo "$raw" | jq -r '.manifests[] | select(.platform.architecture=="arm64" and .platform.os=="linux") | .digest')"
          amd64_config="$(docker buildx imagetools inspect --raw "${repo}@${amd64_manifest}" | jq -r '.config.digest')"
          arm64_config="$(docker buildx imagetools inspect --raw "${repo}@${arm64_manifest}" | jq -r '.config.digest')"
          jq -n \
            --arg reference "${repo}@${digest}" \
            --arg am "$amd64_manifest" --arg ac "$amd64_config" \
            --arg bm "$arm64_manifest" --arg bc "$arm64_config" \
            '{reference: $reference, platforms: [
               {platform: "linux/amd64", manifest_digest: $am, config_digest: $ac},
               {platform: "linux/arm64", manifest_digest: $bm, config_digest: $bc}]}' \
            > "candidate-digests-${{ matrix.app }}.json"
          cat "candidate-digests-${{ matrix.app }}.json"

      - name: Upload candidate digest record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-digests-${{ matrix.app }}
          path: candidate-digests-${{ matrix.app }}.json

  assemble-self-host-release:
    name: Assemble candidate manifest, bundle, and SBOMs
    needs: build-candidates
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download candidate digest records
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: candidate-digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Resolve dependency digests (index + per-platform child/config)
        run: |
          set -euo pipefail
          echo "[]" > dependency-digests.json
          while IFS= read -r entry; do
            service="$(echo "$entry" | jq -r '.service')"
            reference="$(echo "$entry" | jq -r '.reference')"
            raw="$(docker buildx imagetools inspect --raw "$reference")"
            index_digest="$(docker buildx imagetools inspect "$reference" --format '{{json .Manifest}}' | jq -r '.digest')"
            repo="${reference%%:*}"
            repo="${repo%%@*}"
            amd64_manifest="$(echo "$raw" | jq -r '[.manifests[] | select(.platform.architecture=="amd64" and .platform.os=="linux")][0].digest')"
            arm64_manifest="$(echo "$raw" | jq -r '[.manifests[] | select(.platform.architecture=="arm64" and .platform.os=="linux")][0].digest')"
            if [ "$amd64_manifest" = "null" ] || [ "$arm64_manifest" = "null" ]; then
              echo "::error::dependency ${service} (${reference}) lacks a required architecture — qualification blocked" >&2
              exit 1
            fi
            amd64_config="$(docker buildx imagetools inspect --raw "${repo}@${amd64_manifest}" | jq -r '.config.digest')"
            arm64_config="$(docker buildx imagetools inspect --raw "${repo}@${arm64_manifest}" | jq -r '.config.digest')"
            jq --arg service "$service" --arg reference "${repo}@${index_digest}" \
               --arg am "$amd64_manifest" --arg ac "$amd64_config" \
               --arg bm "$arm64_manifest" --arg bc "$arm64_config" \
               '. += [{service: $service, reference: $reference, platforms: [
                  {platform: "linux/amd64", manifest_digest: $am, config_digest: $ac},
                  {platform: "linux/arm64", manifest_digest: $bm, config_digest: $bc}]}]' \
               dependency-digests.json > tmp.json && mv tmp.json dependency-digests.json
          done < <(jq -c '.[]' scripts/install/self_host_dependencies.json)
          jq length dependency-digests.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Generate backend SBOM
        working-directory: apps/api
        run: |
          pip install cyclonedx-bom
          # SBOM from the lockfile: exact versions actually shipped, transitives included
          python -m cyclonedx_py requirements requirements.lock.txt --of json -o ../../sbom-api.cdx.json

      - name: Set up pnpm
        # No explicit version: the action reads `packageManager` from
        # package.json (same pattern as ci.yml). A hardcoded major here
        # conflicts with that field, and action-setup >=4.1 refuses the
        # ambiguity outright — measured on the v1.30.0 candidate run.
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4

      - name: Set up Node.js
        # Without this step the runner's default Node applies (22.x today)
        # and pnpm 10 enforces the root `engines.node >=24` strictly — the
        # v1.30.1 candidate run died on exactly that. Same pin as ci.yml.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"

      - name: Generate frontend SBOM
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --prod --ignore-scripts
          pnpm --dir apps/web licenses list --prod --json > pnpm-licenses.json
          python -m scripts.release.frontend_sbom < pnpm-licenses.json > sbom-web.cdx.json

      - name: Assemble candidate bundle and manifest
        run: |
          set -euo pipefail
          python -m scripts.release.assemble_candidate \
            --version "${{ github.ref_name }}" \
            --source-sha "${{ github.sha }}" \
            --built-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --app-digests api=candidate-digests-api.json \
            --app-digests web=candidate-digests-web.json \
            --dependency-digests dependency-digests.json \
            --sbom api=sbom-api.cdx.json \
            --sbom web=sbom-web.cdx.json \
            --out-dir dist/
          cp sbom-api.cdx.json sbom-web.cdx.json dist/

      - name: Upload candidate release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: self-host-candidate
          path: dist/

  publish-candidate-summary:
    name: Publish candidate hashes (no runtime is invoked)
    needs: assemble-self-host-release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Download candidate assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: self-host-candidate
          path: dist/

      - name: Print candidate identity
        run: |
          set -euo pipefail
          {
            echo "## Self-host candidate (UNQUALIFIED)"
            echo ""
            echo "| Asset | SHA-256 |"
            echo "|---|---|"
            for f in dist/*; do
              echo "| $(basename "$f") | $(sha256sum "$f" | cut -d' ' -f1) |"
            done
            echo ""
            echo "Qualify through the manually-approved installer-disposable-smoke"
            echo "workflow, then dispatch THIS workflow with both run IDs to promote."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Promotion graph — manual dispatch ONLY, never reachable from a tag push.
  # ---------------------------------------------------------------------------

  verify-qualified-evidence:
    name: Verify hash-bound qualification evidence
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify both runs' artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run_id in "${{ inputs.candidate_run_id }}" "${{ inputs.qualification_run_id }}"; do
            case "$run_id" in (*[!0-9]*|'') echo "::error::run id must be decimal" >&2; exit 1;; esac
          done
          check_run() {
            local run_id="$1" expected_workflow="$2"
            local info
            info="$(gh api "repos/${{ github.repository }}/actions/runs/${run_id}" \
              --jq '{workflow: .path, conclusion: .conclusion, repo: .repository.full_name}')"
            echo "$info"
            [ "$(echo "$info" | jq -r '.conclusion')" = "success" ] || { echo "::error::run ${run_id} did not succeed" >&2; exit 1; }
            [ "$(echo "$info" | jq -r '.repo')" = "${{ github.repository }}" ] || { echo "::error::run ${run_id} belongs to another repository" >&2; exit 1; }
            echo "$info" | jq -r '.workflow' | grep -q "$expected_workflow" || { echo "::error::run ${run_id} is not ${expected_workflow}" >&2; exit 1; }
          }
          check_run "${{ inputs.candidate_run_id }}" "release.yml"
          check_run "${{ inputs.qualification_run_id }}" "installer-disposable-smoke.yml"
          gh run download "${{ inputs.candidate_run_id }}" -R "${{ github.repository }}" -n self-host-candidate -D dist/
          # The smoke uploads ONE artifact per matrix leg
          # (qualification-evidence-<job-index>); the old single-name
          # download matched nothing and the old comparison hashed the
          # manifest against evidence that bound the bundle tarball — the
          # promotion could never succeed (measured on the v1.30.1
          # promotion, first ever dispatched). Every leg row must bind the
          # manifest sha, and the merged document is what the promotion CLI
          # re-validates (defense in depth).
          gh run download "${{ inputs.qualification_run_id }}" -R "${{ github.repository }}" -p "qualification-evidence-*" -D evidence-raw/
          candidate_sha="$(sha256sum dist/lia-self-host-manifest.json | cut -d' ' -f1)"
          mkdir -p evidence
          rows="[]"
          count=0
          for f in $(find evidence-raw -name 'qualification-evidence-*.json' | sort); do
            count=$((count+1))
            [ "$(jq -r '.candidate_sha256' "$f")" = "$candidate_sha" ] \
              || { echo "::error::evidence $f does not bind this candidate manifest" >&2; exit 1; }
            [ "$(jq -r '.result' "$f")" = "passed" ] \
              || { echo "::error::evidence row $f did not pass" >&2; exit 1; }
            rows="$(jq -c --argjson acc "$rows" '$acc + [{platform: .platform, mode: .mode, result: .result}]' "$f")"
          done
          if [ "$count" -ne 4 ]; then
            echo "::error::expected 4 qualification rows, got $count" >&2
            exit 1
          fi
          jq -n --arg sha "$candidate_sha" --argjson rows "$rows" \
            '{candidate_sha256: $sha, rows: $rows}' > evidence/qualification-evidence.json

      - name: Upload verified inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-promotion-inputs
          path: |
            dist/
            evidence/

  finalize-qualified-manifest:
    name: Flip candidate to passed (fields byte-identical)
    needs: verify-qualified-evidence
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download verified inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-promotion-inputs
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Promote the manifest
        run: |
          set -euo pipefail
          python -m scripts.release.self_host_manifest \
            --candidate dist/lia-self-host-manifest.json \
            --evidence evidence/qualification-evidence.json \
            --output dist/lia-self-host-manifest.json
      - name: Upload promoted assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promoted-release-assets
          path: dist/

  promote-images:
    name: Attach semver tags to the qualified digests (no rebuild)
    needs: finalize-qualified-manifest
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download promoted assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: promoted-release-assets
          path: dist/
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Tag the exact qualified digests
        run: |
          set -euo pipefail
          version="$(jq -r '.release_version' dist/lia-self-host-manifest.json)"
          version="${version#v}"
          major="${version%%.*}"
          minor="${version%.*}"
          python -m scripts.release.self_host_manifest --print-images dist/lia-self-host-manifest.json |
          while read -r app reference; do
            repo="${reference%@*}"
            for tag in "$version" "$minor" "$major" latest; do
              docker buildx imagetools create --tag "${repo}:${tag}" "$reference"
            done
          done

  create-release:
    name: Create GitHub Release (qualified assets only)
    needs: promote-images
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download promoted assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: promoted-release-assets
          path: dist/
      - name: Resolve release identity
        id: identity
        run: |
          set -euo pipefail
          echo "version=$(jq -r '.release_version' dist/lia-self-host-manifest.json)" >> "$GITHUB_OUTPUT"
          echo "api_ref=$(python -m scripts.release.self_host_manifest --print-images dist/lia-self-host-manifest.json | awk '$1=="api"{print $2}')" >> "$GITHUB_OUTPUT"
          echo "web_ref=$(python -m scripts.release.self_host_manifest --print-images dist/lia-self-host-manifest.json | awk '$1=="web"{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.identity.outputs.version }}
          generate_release_notes: true
          files: |
            dist/lia-self-host-manifest.json
            dist/lia-self-host-bundle.tar.gz
            dist/lia-self-host-bundle.tar.gz.sha256
            dist/sbom-api.cdx.json
            dist/sbom-web.cdx.json
          body: |
            ## Docker Images (immutable digests — the qualified artifacts)

            ```bash
            docker pull ${{ steps.identity.outputs.api_ref }}
            docker pull ${{ steps.identity.outputs.web_ref }}
            ```

            Semver tags point at these exact digests; the digest form above is
            the reproducible reference.

            ## Guided self-host installation

            OpenAI and DeepSeek are required for the current core.

            ```bash
            # Download lia-self-host-bundle.tar.gz, its .sha256, and
            # lia-self-host-manifest.json into ONE directory, then:
            sha256sum --check lia-self-host-bundle.tar.gz.sha256
            tar -xzf lia-self-host-bundle.tar.gz
            ./install.sh
            ```

            The adjacent passed manifest makes `./install.sh` resolve to the
            qualified prebuilt images; `./install.sh --local-build` builds from
            the embedded, manifest-verified source context instead. A complete
            source checkout always defaults to a local build. Upgrades and
            destructive reinstalls are outside v1 — see
            `docs/architecture/ADR-215-Self-Host-Installer.md`.
