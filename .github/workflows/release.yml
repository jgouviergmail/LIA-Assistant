name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  actions: read # require-green-ci reads the CI workflow's conclusion for this SHA

env:
  REGISTRY: ghcr.io

jobs:
  # F008: a tag push must NOT publish images or cut a release for a commit whose
  # CI (ci.yml) is not green. This gate requires the latest COMPLETED ci.yml run
  # for the tagged SHA to have concluded 'success' before anything is built.
  require-green-ci:
    name: Require green CI for the tagged commit
    runs-on: ubuntu-latest
    steps:
      - name: Verify ci.yml succeeded for this SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          conclusion="$(gh run list --workflow=ci.yml --commit "$sha" \
            --json conclusion,status \
            --jq 'map(select(.status=="completed"))[0].conclusion // ""' \
            -R "${{ github.repository }}")"
          echo "ci.yml conclusion for ${sha}: ${conclusion:-<none>}"
          if [ "${conclusion}" != "success" ]; then
            echo "::error::Release blocked — ci.yml for ${sha} is '${conclusion:-missing/incomplete}', not 'success'. Ensure CI is green on the tagged commit, then re-run this release." >&2
            exit 1
          fi

  build-and-push:
    name: Build & Push Docker Images
    needs: require-green-ci
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: api
            context: ./apps/api
            dockerfile: ./apps/api/Dockerfile.prod
          - app: web
            context: .
            dockerfile: ./apps/web/Dockerfile.prod

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Free ~25 GB of preinstalled toolchains the runner does not need. The
      # multi-arch (amd64 + arm64) build of both the api and web prod images
      # otherwise exhausts the runner's ~14 GB free disk ("No space left on
      # device"), which failed the v1.21.4 / v1.21.5 releases.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          df -h /

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.app }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  generate-sbom:
    name: Generate SBOM
    needs: require-green-ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Generate backend SBOM
        working-directory: apps/api
        run: |
          pip install cyclonedx-bom
          # SBOM from the lockfile: exact versions actually shipped, transitives included
          python -m cyclonedx_py requirements requirements.lock.txt --of json -o ../../sbom-backend.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom-backend.json

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-and-push, generate-sbom]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom

      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREV_TAG=$(git tag --sort=-version:refname | head -2 | tail -1)
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" HEAD)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" ${PREV_TAG}..HEAD)
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: sbom-backend.json
          body: |
            ## Changes

            ${{ steps.changelog.outputs.changelog }}

            ## Docker Images

            ```bash
            docker pull ${{ env.REGISTRY }}/${{ github.repository }}/api:${{ github.ref_name }}
            docker pull ${{ env.REGISTRY }}/${{ github.repository }}/web:${{ github.ref_name }}
            ```

            ## Quick Start

            ```bash
            git clone https://github.com/${{ github.repository }}.git
            cd LIA-Assistant
            cp .env.example .env
            docker compose up -d
            ```
