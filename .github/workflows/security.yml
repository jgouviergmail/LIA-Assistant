name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Every Monday at 9:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  # Required by codeql-action (analyze/upload-sarif) to read workflow-run
  # metadata; without it runs fail with "Resource not accessible by
  # integration", leaving the main-branch alert baseline permanently stale.
  actions: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript]

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4
        with:
          languages: ${{ matrix.language }}
          config-file: .github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@7188fc363630916deb702c7fdcf4e481b751f97a # v4

      - name: Perform Analysis
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4
        with:
          category: "/language:${{ matrix.language }}"

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install pip-audit
        working-directory: ./apps/api
        run: |
          pip install --upgrade pip
          pip install pip-audit

      - name: pip-audit (Python)
        working-directory: ./apps/api
        # Audits the compiled lockfile so transitive dependencies are covered.
        # (The previous `pip install -e .` audited an empty environment:
        # pyproject.toml declares no dependencies.)
        # CVE-2026-4539: Pygments ReDoS in AdlLexer (local-only, low severity,
        # no fix available upstream — 2.20.0 is the latest release; dev-only, it
        # is absent from the production image).
        # CVE-2024-23342: ecdsa timing attack on signing. LIA DOES sign JWTs
        # (`jwt.encode` in core/security/utils.py) — the earlier "only verifies"
        # rationale was wrong. What makes this inert is the algorithm: HS256
        # (HMAC, see JWT_ALGORITHM_DEFAULT), so python-jose never routes through
        # the ecdsa backend. `SecuritySettings.algorithm` is a Literal of HMAC
        # algorithms precisely so this exemption cannot be invalidated by an
        # .env change; widening it to an EC algorithm means dropping this ignore.
        run: pip-audit --desc -r requirements.lock.txt --ignore-vuln CVE-2026-4539 --ignore-vuln CVE-2024-23342

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      # Blocking, like its Python counterpart above. It ran with
      # `continue-on-error: true` for a long time, which is how a CRITICAL
      # advisory (websocket-driver, GHSA-xv26-6w52-cph6) lived on `main` for
      # months with a green pipeline: the step reported it and the job passed
      # anyway. Fix the advisory or pin a `pnpm.overrides` entry in the root
      # package.json — do not restore the flag.
      - name: npm audit (Node)
        working-directory: ./apps/web
        run: pnpm audit --audit-level=high

  trivy:
    name: Trivy Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: fs
          scan-ref: "."
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Generate SBOM (CycloneDX)
        uses: CycloneDX/gh-dotnet-generate-sbom@c183e4ac30e5b99354cb9a98c38548e07c538346 # v1.0.1
        continue-on-error: true

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Generate Python SBOM
        working-directory: ./apps/api
        # SBOM from the lockfile: exact versions actually shipped, transitives
        # included. (`pip install -e .` installed nothing: pyproject declares
        # no dependencies, so the previous environment-mode SBOM was empty.)
        run: |
          pip install --upgrade pip
          pip install cyclonedx-bom
          python -m cyclonedx_py requirements requirements.lock.txt -o sbom-backend.json --output-format json

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-backend
          path: ./apps/api/sbom-backend.json
          retention-days: 90
