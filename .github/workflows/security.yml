name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Every Monday at 9:00 UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  # Required by codeql-action (analyze/upload-sarif) to read workflow-run
  # metadata; without it runs fail with "Resource not accessible by
  # integration", leaving the main-branch alert baseline permanently stale.
  actions: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # `actions` reads the workflows themselves (ADR-326): an expression
        # injection or a poisonable step is a supply-chain hole neither of the
        # two application languages can see. It needs no build.
        language: [python, javascript, actions]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          config-file: .github/codeql/codeql-config.yml

      - name: Autobuild
        if: matrix.language != 'actions'
        uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4

      - name: Perform Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: "/language:${{ matrix.language }}"

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # The audits, their ignore list and the tool versions live in the
      # Taskfile (ADR-151): this job runs literally what a developer runs before
      # pushing. uv runs pip-audit isolated at the version Taskfile.yml pins;
      # this uv version is held equal to UV_VERSION by
      # apps/api/tests/unit/test_one_value_one_owner_guard.py.
      - name: Install uv
        run: pip install uv==0.12.18

      - name: pip-audit (the three Python lockfiles)
        run: task security:scan:backend

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # A frozen install is a gate of its own: on 2026-09-30 two Dependabot pull
      # requests merged five minutes apart left a lockfile no install could
      # read, and this is the step that said so.
      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      # Blocking, like its Python counterpart above. It ran with
      # `continue-on-error: true` for a long time, which is how a CRITICAL
      # advisory (websocket-driver, GHSA-xv26-6w52-cph6) lived on `main` for
      # months with a green pipeline: the step reported it and the job passed
      # anyway. Fix the advisory or pin a `pnpm.overrides` entry in the root
      # package.json — do not restore the flag.
      - name: pnpm audit (Node)
        run: task security:scan:frontend

  trivy:
    name: Trivy Scan
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Blocking, like pip-audit and pnpm audit above (SEC-021). It reported
      # into the Security tab and passed unconditionally, which makes a scanner
      # a dashboard rather than a gate — the same shape that let a CRITICAL
      # advisory live on `main` for months before pnpm audit was made blocking.
      #
      # Measured before flipping it: 0 findings at every severity on 2026-07-25,
      # so this cannot break the build on existing debt.
      #
      # What Trivy actually reads here is `apps/api/requirements.txt` (the
      # intent manifest) and `pnpm-lock.yaml` with dev dependencies excluded —
      # both narrower than what ships. That is deliberate rather than
      # overlooked: pip-audit already audits `requirements.lock.txt` and pnpm
      # audit already covers dev dependencies, both blocking. Pointing Trivy at
      # the same files would add a second opinion on an already-gated surface,
      # not close a gap.
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: fs
          scan-ref: "."
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        if: always()
        with:
          sarif_file: trivy-results.sarif

  sbom:
    name: Generate SBOM
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # NOTE: a `CycloneDX/gh-dotnet-generate-sbom` step used to run here with
      # `continue-on-error: true`. It is a .NET generator — this repo is Python +
      # TypeScript — so it produced nothing and swallowed its own failure. The
      # real SBOMs are the two steps below, both built from lockfiles.

      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        run: pip install uv==0.12.18

      # SBOM from the lockfile: exact versions actually shipped, transitives
      # included, at the cyclonedx-bom version the Taskfile pins.
      - name: Generate Python SBOM
        run: task security:sbom:backend

      - name: Upload backend SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-backend
          path: ./apps/api/sbom-backend.json
          retention-days: 90

      # SEC-021 — the frontend half, missing until now: half an inventory
      # answers "are we affected?" with "for Python, yes". Generated with Trivy
      # rather than a new toolchain because the scan job already runs it and it
      # reads `pnpm-lock.yaml` natively — `@cyclonedx/cyclonedx-npm` is
      # npm-specific and would need a separate pnpm-aware generator.
      #
      # Built from the lockfile, like its backend counterpart: exact resolved
      # versions with transitives, not the ranges declared in package.json.
      - name: Generate frontend SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          scan-type: fs
          scan-ref: "pnpm-lock.yaml"
          format: cyclonedx
          output: sbom-frontend.json

      - name: Upload frontend SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-frontend
          path: ./sbom-frontend.json
          retention-days: 90
