name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Build the urllib3 fork (urllib3-future, transitive via caldav -> niquests)
  # from sdist so it does NOT clobber the genuine urllib3 package. Must pair
  # with `--no-binary urllib3-future` on every lockfile install. See
  # apps/api/requirements.txt.
  URLLIB3_NO_OVERRIDE: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/api

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock.txt

      - name: Create venv and install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install --require-hashes --no-binary urllib3-future -r requirements-dev.lock.txt

      - name: Ruff check
        run: |
          source .venv/bin/activate
          ruff check src/ tests/

      - name: Black check
        run: |
          source .venv/bin/activate
          black --check src/ tests/

      - name: MyPy
        run: |
          source .venv/bin/activate
          mypy src/ --config-file=pyproject.toml

      - name: MyPy exemption ratchet (F020, shrink-only)
        # Freezes the disable_error_code exemption surface as (module, code)
        # pairs and fails on any NEW exemption. Pure pyproject.toml parse — no
        # MyPy run, deterministic across host/CI. Baseline lowers only via
        # `measure_mypy_debt.py --update` after exemptions are removed.
        run: |
          source .venv/bin/activate
          python ../../scripts/audit/measure_mypy_debt.py --check

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        working-directory: ./apps/web
        run: pnpm lint

      - name: Accessibility ratchet (jsx-a11y, shrink-only)
        # F012/F013/F021: freezes the ~50 existing a11y violations so the debt
        # cannot grow while the admin screens are remediated. New violations fail.
        working-directory: ./apps/web
        run: pnpm a11y:ratchet

      - name: React 19 strict-mode ratchet (shrink-only)
        # F021: freezes the 34 react-hooks/set-state-in-effect + immutability
        # violations so no new ones creep in while the components are fixed.
        working-directory: ./apps/web
        run: pnpm react-hooks:ratchet

      - name: Frontend complexity ratchet (per-function/file, shrink-only)
        # F011: freezes the 71 functions >= CC 15, the worst function (96) and a
        # per-file fingerprint, so a new complex function fails even below the
        # global eslint ceiling. Decompose to lower it; --update never raises it.
        working-directory: ./apps/web
        run: pnpm cc:ratchet

      - name: TypeScript type-check
        working-directory: ./apps/web
        run: pnpm exec tsc --noEmit

  e2e-frontend:
    # F031: hermetic Playwright + axe smoke. Runs in the official Playwright
    # image (glibc) — the Alpine dev container cannot run Playwright's bundled
    # browsers, which is why the suite is an isolated package (apps/web/e2e,
    # outside the pnpm workspace). Every spec intercepts /api/v1/** and serves
    # fixed payloads, so NO backend/LLM/paid provider is contacted; Playwright
    # builds + serves the app itself (E2E_MANAGED_SERVER). Chromium-only PR
    # smoke for speed; the SAME suite replays weekly on Firefox/WebKit via
    # a11y-matrix.yml (AC-002), and the manual NVDA/VoiceOver campaign is
    # docs/a11y/AT_CAMPAIGN.md. See apps/web/e2e/README.md.
    name: E2E + a11y smoke (Playwright)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-jammy
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      - name: Install E2E dependencies (reproducible)
        # F054: npm ci against the COMMITTED package-lock.json (exact pinned
        # versions) — it fails if package.json and the lock diverge, which is
        # the lock-drift guard. Never `npm install` here.
        working-directory: ./apps/web/e2e
        run: npm ci --no-audit --no-fund

      - name: Typecheck E2E suite
        working-directory: ./apps/web/e2e
        run: npm run typecheck

      - name: Run E2E + a11y smoke
        working-directory: ./apps/web/e2e
        env:
          CI: "true"
          # Managed server: Playwright runs `next build`, copies .next/static
          # and public/ into the standalone tree, then serves it with
          # `node .next/standalone/apps/web/server.js` (HTTP) — the app builds
          # with `output: standalone`, with which `next start` does not work.
          # No dev container, no backend.
          E2E_MANAGED_SERVER: "1"
          # 127.0.0.1, not localhost: the standalone server binds IPv4-only
          # (HOSTNAME=0.0.0.0) and `localhost` may resolve to ::1 first.
          E2E_BASE_URL: http://127.0.0.1:3000
          # Relative API URLs so browser traffic stays same-origin (intercepted).
          NEXT_PUBLIC_API_URL: ""
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/web/e2e/playwright-report
          retention-days: 7

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: lint-backend
    defaults:
      run:
        working-directory: ./apps/api

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379
      REDIS_PASSWORD: ""
      SECRET_KEY: test-secret-key-minimum-32-characters-long-for-testing
      # Fallback = the throwaway PUBLIC test key from apps/api/.env.test: the
      # TEST_FERNET_KEY repo secret is optional (absent on forks/this repo), and
      # jobs that drive alembic/settings directly (no pytest .env.test reload)
      # would otherwise fail Fernet validation on an empty value.
      FERNET_KEY: ${{ secrets.TEST_FERNET_KEY || 'nXQIoBSMZtcMuA30Zz8LUORRsD3zsV04L5oOJDoR0WM=' }} # gitleaks:allow
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock.txt

      - name: Create venv and install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install --require-hashes --no-binary urllib3-future -r requirements-dev.lock.txt

      - name: Run fast unit tests with coverage
        run: |
          source .venv/bin/activate
          pytest tests/unit/ \
            -v \
            --tb=short \
            -m "not integration and not slow and not e2e and not benchmark and not multiprocess" \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=45

      # Agents suite — wired into CI 2026-07 after the audit found it had
      # silently rotted (83 failures) because no gate ever ran it.
      - name: Run agents tests
        run: |
          source .venv/bin/activate
          pytest tests/agents/ \
            -v \
            --tb=short \
            -m "not slow and not e2e and not benchmark and not multiprocess" \
            --no-cov

      # F006: the path-level taxonomy guard proves test FILES live under a
      # CI-executed root, but a file can still be fully deselected by a job's
      # marker expression. This gate collects every nodeid + its markers and
      # fails if any test runs in NO job and is not in the justified,
      # shrink-only allowlist (apps/api/tests/marker_coverage_allowlist.json).
      - name: Marker-coverage gate (F006 — no test runs in zero jobs)
        run: |
          source .venv/bin/activate
          python ../../scripts/audit/check_test_marker_coverage.py

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./apps/api/coverage.xml
          flags: backend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  test-backend-integration:
    name: Test Backend Integration
    runs-on: ubuntu-latest
    needs: lint-backend
    defaults:
      run:
        working-directory: ./apps/api

    services:
      # Credentials deliberately match apps/api/.env.test: conftest.py loads
      # .env.test with override=True, so tests that read settings.database_url
      # directly (e.g. the LangGraph checkpointer) reach this same service.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # TEST_DATABASE_URL is the only DB variable that survives the .env.test
      # override (see tests/conftest.py::_detect_environment) — it routes the
      # fixtures to the service container instead of Testcontainers.
      TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_db
      # F019: this job provisions PostgreSQL as a service — it PROMISES a DB, so an
      # unreachable DB / Testcontainers error must FAIL the job, not silently skip
      # whole DB test groups (conftest.py::_db_unavailable honours this flag).
      LIA_REQUIRE_DB: "1"
      REDIS_URL: redis://localhost:6379
      REDIS_PASSWORD: ""
      SECRET_KEY: test-secret-key-minimum-32-characters-long-for-testing
      # Fallback = the throwaway PUBLIC test key from apps/api/.env.test: the
      # TEST_FERNET_KEY repo secret is optional (absent on forks/this repo), and
      # jobs that drive alembic/settings directly (no pytest .env.test reload)
      # would otherwise fail Fernet validation on an empty value.
      FERNET_KEY: ${{ secrets.TEST_FERNET_KEY || 'nXQIoBSMZtcMuA30Zz8LUORRsD3zsV04L5oOJDoR0WM=' }} # gitleaks:allow
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock.txt

      - name: Create venv and install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install --require-hashes --no-binary urllib3-future -r requirements-dev.lock.txt

      # Integration suite — wired into CI 2026-07 after the audit found it ran
      # in NO job (and had silently rotted, like the agents suite before it).
      # e2e/benchmark/multiprocess stay out of PR CI; slow is included (these
      # tests run nowhere else). --no-cov: the coverage gate applies to the
      # unit job only.
      - name: Run integration tests
        run: |
          source .venv/bin/activate
          pytest tests/integration/ \
            -v \
            --tb=short \
            -m "not e2e and not benchmark and not multiprocess" \
            --no-cov
          # F006: integration-marked tests that physically live under tests/unit
          # or tests/agents (functional DB/Redis tests co-located with unit ones)
          # would otherwise run in NO PR job. This services-equipped job is their
          # deterministic home — the marker-coverage guard mirrors this collection.
          pytest tests/unit/ tests/agents/ \
            -v \
            --tb=short \
            -m "integration and not e2e and not benchmark and not multiprocess" \
            --no-cov

  migration-replay:
    name: Migration Replay (from scratch)
    runs-on: ubuntu-latest
    needs: lint-backend
    defaults:
      run:
        working-directory: ./apps/api

    services:
      # An EMPTY database on purpose. The unit job builds its schema via
      # create_all() and NEVER runs the migrations, so only a from-scratch
      # `alembic upgrade head` on a virgin database catches a non-replayable
      # migration (F007 — the landmine that failed at the 71st migration on a
      # DELETE from a LangGraph runtime table absent on a fresh database).
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # alembic/env.py imports the full settings; DATABASE_URL (an env var) takes
      # precedence over the .env copied below, routing alembic to the service.
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379
      REDIS_PASSWORD: ""
      SECRET_KEY: test-secret-key-minimum-32-characters-long-for-testing
      # Fallback = the throwaway PUBLIC test key from apps/api/.env.test: the
      # TEST_FERNET_KEY repo secret is optional (absent on forks/this repo), and
      # jobs that drive alembic/settings directly (no pytest .env.test reload)
      # would otherwise fail Fernet validation on an empty value.
      FERNET_KEY: ${{ secrets.TEST_FERNET_KEY || 'nXQIoBSMZtcMuA30Zz8LUORRsD3zsV04L5oOJDoR0WM=' }} # gitleaks:allow
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock.txt

      - name: Create venv and install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install --require-hashes --no-binary urllib3-future -r requirements-dev.lock.txt

      - name: Create required PostgreSQL extensions (parity with postgres-init.sql)
        env:
          PGPASSWORD: test
        run: |
          psql -h localhost -U test -d test_db -v ON_ERROR_STOP=1 \
            -c 'CREATE EXTENSION IF NOT EXISTS vector;' \
            -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";' \
            -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm;'

      - name: Provide a full settings env for alembic (.env; DATABASE_URL overridden above)
        run: cp .env.test .env

      - name: Replay the migration chain from an empty database (F007)
        run: |
          source .venv/bin/activate
          bash ../../scripts/db/check_migrations_replay.sh

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    needs: lint-frontend

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest
        working-directory: ./apps/web
        # NOTE: must be the dedicated script, NOT `pnpm test -- --coverage`:
        # pnpm forwards the literal `--` to vitest, which silently ignores the
        # coverage flag (no report is produced and Codecov uploads nothing).
        run: pnpm test:coverage

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./apps/web/coverage/coverage-final.json
          flags: frontend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  code-hygiene:
    name: Code Hygiene
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Check for .bak files
        run: |
          BAK_FILES=$(find . -name "*.bak" -not -path "./.git/*" || true)
          if [ -n "$BAK_FILES" ]; then
            echo "::error::Backup files (.bak) found in repository:"
            echo "$BAK_FILES"
            exit 1
          fi

      - name: Check for synchronous Store calls in async context
        run: |
          SYNC_CALLS=$(grep -rn "runtime\.store\.put(\|runtime\.store\.get(\|runtime\.store\.delete(\|runtime\.store\.search(" apps/api/src/ | grep -v "await " || true)
          if [ -n "$SYNC_CALLS" ]; then
            echo "::error::Synchronous Store calls detected in async context (use aput/aget/adelete/asearch):"
            echo "$SYNC_CALLS"
            exit 1
          fi

      - name: Check for Redis setex without json.dumps
        run: |
          SETEX_LINES=$(grep -rn "\.setex(" apps/api/src/ || true)
          if [ -n "$SETEX_LINES" ]; then
            MISSING=$(echo "$SETEX_LINES" | grep -v "json\.dumps(" || true)
            if [ -n "$MISSING" ]; then
              echo "::warning::Redis setex() without json.dumps() detected — review these lines:"
              echo "$MISSING"
            fi
          fi

      - name: Check for raw HTTPException raises (rule #18, ADR-124)
        # Backend errors go through the centralized taxonomy in
        # src/core/exceptions.py (raisers or BaseAPIException subclasses) —
        # never a raw `raise HTTPException`. The whole tree was migrated to 0
        # sites (ADR-114 clients, ADR-124 routers/services). No exemptions.
        # Warning-only for one release to absorb in-flight branches; flip the
        # echo to ::error + `exit 1` afterwards.
        run: |
          RAW_RAISES=$(grep -rn "raise HTTPException" apps/api/src/ || true)
          if [ -n "$RAW_RAISES" ]; then
            echo "::warning::Raw 'raise HTTPException' detected — use the centralized raisers/classes of src/core/exceptions.py (rule #18, ADR-124):"
            echo "$RAW_RAISES"
          fi

      - name: Check i18n keys sync
        # Single source of truth: scripts/i18n/validate_translations.py (F027).
        # Fails on any missing language, invalid JSON, or key drift (missing/extra).
        run: python scripts/i18n/validate_translations.py

      - name: Deploy readiness-gate / rollback tests (F008)
        # Hermetic tests of the prod deploy readiness gate: success, red
        # readiness → automatic rollback → revalidation, and unrecoverable
        # failure. No Docker/network (all indirections mocked).
        run: bash scripts/deploy/lib/test_deploy_readiness_gate.sh

      - name: Deploy driver Pester tests (F008)
        # Hermetic Pester suite for the WHOLE deploy system as one wired unit:
        # driver deploy-prod.ps1 (param validation, DryRun, retry/backoff,
        # crash-safe SOPS encrypt), bundle built by prepare-prod.ps1 (code
        # copied, sensitive files scrubbed, LF-only bash artifacts, provenance
        # SHA), and the GENERATED deploy.sh executed under bash against the
        # shipped readiness-gate lib (green / red→rollback / rollback failure,
        # provenance identity landing in release-manifest.json). Every external
        # tool (ssh/scp/rsync/sops/docker/curl) is a PATH shim — no network, no
        # Docker, no production contact. This Linux run covers the `sh -c`
        # branch of Invoke-WithRetry; Windows dev machines cover `cmd /c`.
        shell: pwsh
        run: ./scripts/deploy/run-deploy-driver-tests.ps1

      - name: Documentation drift audit (F024)
        # Fails on any LIVING broken relative link, including ADR→ADR links
        # inside an actively-indexed ADR (escalated from HISTORICAL). With
        # --fail-on-stale it also fails on any LIVING doc referencing a code
        # path (*.py:line) that no longer exists — unless the reference is an
        # illustrative placeholder or annotated (example/obsolete/proposed).
        # HISTORICAL/ROADMAP stale paths and deleted session docs stay tolerated.
        run: python scripts/audit/doc_audit.py --fail-on-stale

      - name: Domain import-cycle ratchet (F009, shrink-only)
        # Freezes the 31 runtime bidirectional import cycles; a NEW cycle fails.
        # Baseline lowers only via `measure_coupling.py --update-cycles` after a
        # cycle is broken (ports/Protocol/events/injection).
        run: python scripts/audit/measure_coupling.py --check-cycles

      - name: Cyclomatic-complexity ratchet (F011/F015, shrink-only)
        # Freezes two monotone caps: count of functions >= CC 15 and the single
        # worst function. A new hotspot fails; decompose instead of raising caps.
        run: python scripts/audit/measure_cc.py --check-ratchet

      - name: Check Python lockfiles are in sync with manifests
        run: |
          pip install packaging
          python scripts/check_requirements_lock.py

      - name: Check Alembic migration conflicts
        run: |
          python -c "
          import re, pathlib, sys

          versions_dir = pathlib.Path('apps/api/alembic/versions')
          revisions = {}
          # Match both 'revision = \"val\"' and 'revision: str = \"val\"' formats
          rev_re = re.compile(r'^revision[^=]*=\s*[\"\\']([^\"\\' ]+)', re.MULTILINE)
          down_re = re.compile(r'^down_revision[^=]*=\s*[\"\\']([^\"\\' ]+)', re.MULTILINE)

          for f in sorted(versions_dir.glob('*.py')):
              content = f.read_text(encoding='utf-8')
              rev_match = rev_re.search(content)
              if rev_match:
                  revisions[rev_match.group(1)] = f.name

          # Heads = revisions not referenced as down_revision by any other migration
          referenced_as_parent = set()
          for f in sorted(versions_dir.glob('*.py')):
              content = f.read_text(encoding='utf-8')
              down_match = down_re.search(content)
              if down_match:
                  referenced_as_parent.add(down_match.group(1))

          heads = [r for r in revisions if r not in referenced_as_parent]

          if len(heads) > 1:
              print(f'::error::Multiple Alembic heads detected ({len(heads)}):')
              for h in heads:
                  print(f'  {h} ({revisions[h]})')
              sys.exit(1)
          elif len(heads) == 1:
              print(f'Single head: {heads[0]} ({revisions[heads[0]]})')
          else:
              print('No revisions found')
          "

      - name: Check .env.example completeness
        run: |
          python -c "
          import re, pathlib, sys

          env_example = pathlib.Path('.env.example').read_text(encoding='utf-8')
          env_keys = set(re.findall(r'^([A-Z][A-Z_0-9]+)=', env_example, re.MULTILINE))

          # Scan config files for env var references (Field default, env= parameter)
          config_dir = pathlib.Path('apps/api/src/core/config')
          env_refs = set()
          for f in config_dir.glob('*.py'):
              content = f.read_text(encoding='utf-8')
              # Match env='VAR_NAME' patterns in Pydantic settings
              env_refs |= set(re.findall(r'env=[\"\\']([A-Z][A-Z_0-9]+)[\"\\']', content))
              # Match Field(..., alias='VAR_NAME') or direct class var names that are UPPER_CASE
              for match in re.finditer(r'^    ([A-Z][A-Z_0-9]+):', content, re.MULTILINE):
                  env_refs.add(match.group(1))

          missing = sorted(env_refs - env_keys)
          # Filter out common false positives (internal Pydantic fields, etc.)
          missing = [v for v in missing if len(v) > 2 and not v.startswith('MODEL_')]

          if missing:
              print(f'::warning::Environment variables in config but missing from .env.example ({len(missing)}):')
              for v in missing:
                  print(f'  - {v}')
              # Warning only, not a hard failure
          else:
              print('.env.example is complete')
          "

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build API image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile.prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./apps/web/Dockerfile.prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  python-compat:
    name: Python 3.13 Compatibility (F041)
    runs-on: ubuntu-latest
    needs: lint-backend
    defaults:
      run:
        working-directory: ./apps/api
    env:
      SECRET_KEY: test-secret-key-minimum-32-characters-long-for-testing
      # Fallback = the throwaway PUBLIC test key from apps/api/.env.test: the
      # TEST_FERNET_KEY repo secret is optional (absent on forks/this repo), and
      # jobs that drive alembic/settings directly (no pytest .env.test reload)
      # would otherwise fail Fernet validation on an empty value.
      FERNET_KEY: ${{ secrets.TEST_FERNET_KEY || 'nXQIoBSMZtcMuA30Zz8LUORRsD3zsV04L5oOJDoR0WM=' }} # gitleaks:allow
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Proves the upper half of the bounded requires-python contract
      # (">=3.12,<3.14"): 3.12 is covered by test-backend, 3.13 is what
      # developer hosts run. Fast unit subset only — no DB/Redis/coverage.
      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock.txt

      - name: Create venv and install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install --require-hashes --no-binary urllib3-future -r requirements-dev.lock.txt

      - name: Run fast unit tests on Python 3.13
        run: |
          source .venv/bin/activate
          pytest tests/unit/ -q --no-cov -p no:cacheprovider \
            -m "not integration and not slow and not e2e and not benchmark and not multiprocess"

  observability:
    name: Observability Config
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Structural validation (dashboards + live rules, F025)
        # Deterministic, server-free: valid JSON/YAML, required dashboard keys,
        # unique uids, non-empty panel queries, balanced PromQL brackets.
        run: python scripts/observability/validate_observability.py

      - name: Install promtool
        run: |
          VER=2.53.2
          curl -fsSL -o promtool.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${VER}/prometheus-${VER}.linux-amd64.tar.gz"
          tar xzf promtool.tar.gz
          echo "$PWD/prometheus-${VER}.linux-amd64" >> "$GITHUB_PATH"

      - name: promtool check live rules (deep PromQL, F025)
        # Every rule file loaded by prometheus.yml is deep-checked, not just the
        # recording rules: recording_rules.yml (86 recording rules) AND
        # alerts-core.yml (the live core alerts — pure Prometheus templating
        # {{ $value }}/{{ $labels }}, no Jinja, so promtool parses it directly).
        # The legacy alerts.yml.template (Jinja, DISABLED in prometheus.yml) is
        # rendered at deploy time and stays covered structurally above.
        run: |
          promtool check rules \
            infrastructure/observability/prometheus/recording_rules.yml \
            infrastructure/observability/prometheus/alerts-core.yml

      - name: promtool test alert rules (functional, F025)
        # Unit-tests the core alerts against synthetic series: firing/not-firing,
        # labels, annotations and runbook links. A red expression, a divergent
        # annotation or a broken threshold fails the build — closing the gap
        # where a valid test file existed but never ran in CI.
        run: |
          promtool test rules \
            infrastructure/observability/prometheus/tests/alerts_core_test.yml

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
