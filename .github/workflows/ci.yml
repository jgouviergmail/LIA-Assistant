name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Build the urllib3 fork (urllib3-future, transitive via caldav -> niquests)
  # from sdist so it does NOT clobber the genuine urllib3 package. Must pair
  # with `--no-binary urllib3-future` on every lockfile install. See
  # apps/api/requirements.txt.
  URLLIB3_NO_OVERRIDE: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock.txt

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create venv and install dependencies
        working-directory: ./apps/api
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install --require-hashes --no-binary urllib3-future -r requirements-dev.lock.txt

      # Ruff + Black + MyPy, then the F020 exemption ratchet (shrink-only:
      # freezes the disable_error_code surface as (module, code) pairs and fails
      # on any NEW exemption; pure pyproject parse, no MyPy run).
      - name: Lint backend
        run: task lint:backend lint:mypy-debt

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ESLint, then three shrink-only ratchets, then tsc. The ratchets freeze
      # existing debt so it cannot grow: ~50 jsx-a11y violations (F012/F013/F021),
      # 34 react-hooks/immutability violations (F021), and the functions at
      # CC >= 15 with a per-file fingerprint (F011) — a new complex function fails
      # even below the global eslint ceiling. `--update` never raises a baseline.
      - name: Lint frontend
        run: task lint:frontend

  e2e-frontend:
    # F031: hermetic Playwright + axe smoke. Runs in the official Playwright
    # image (glibc) — the Alpine dev container cannot run Playwright's bundled
    # browsers, which is why the suite is an isolated package (apps/web/e2e,
    # outside the pnpm workspace). Every spec intercepts /api/v1/** and serves
    # fixed payloads, so NO backend/LLM/paid provider is contacted; Playwright
    # builds + serves the app itself (E2E_MANAGED_SERVER). Chromium-only PR
    # smoke for speed; the SAME suite replays weekly on Firefox/WebKit via
    # a11y-matrix.yml (AC-002), and the manual NVDA/VoiceOver campaign is
    # docs/a11y/AT_CAMPAIGN.md. See apps/web/e2e/README.md.
    name: E2E + a11y smoke (Playwright)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-jammy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      - name: Install E2E dependencies (reproducible)
        # F054: npm ci against the COMMITTED package-lock.json (exact pinned
        # versions) — it fails if package.json and the lock diverge, which is
        # the lock-drift guard. Never `npm install` here.
        working-directory: ./apps/web/e2e
        run: npm ci --no-audit --no-fund

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Typecheck then run. The managed-server / IPv4 / relative-API-URL
      # environment now lives in the task itself — it is how the suite runs at
      # all, not a CI knob, and keeping it here made a local run behave
      # differently from this job.
      - name: Run E2E + a11y smoke
        env:
          CI: "true"
        run: task test:e2e

      # Guided showroom P0 (public-web-showroom program): two SEQUENTIAL clean
      # managed builds — NEXT_PUBLIC_* flags are baked at build time, so each
      # oracle needs its own fresh artifact (E2E_FORCE_FRESH in the tasks).
      - name: Showroom contract — telemetry OFF (zero-API + axe)
        env:
          CI: "true"
        run: task test:e2e:showroom

      - name: Showroom contract — telemetry ON (credential-less collector)
        env:
          CI: "true"
        run: task test:e2e:showroom:telemetry

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/web/e2e/playwright-report
          retention-days: 7

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    needs: lint-backend

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://test_user:test_password@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379
      REDIS_PASSWORD: ""
      SECRET_KEY: test-secret-key-minimum-32-characters-long-for-testing
      # Fallback = the throwaway PUBLIC test key from apps/api/.env.test: the
      # TEST_FERNET_KEY repo secret is optional (absent on forks/this repo), and
      # jobs that drive alembic/settings directly (no pytest .env.test reload)
      # would otherwise fail Fernet validation on an empty value.
      FERNET_KEY: ${{ secrets.TEST_FERNET_KEY || 'nXQIoBSMZtcMuA30Zz8LUORRsD3zsV04L5oOJDoR0WM=' }} # gitleaks:allow
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock.txt

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create venv and install dependencies
        working-directory: ./apps/api
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install --require-hashes --no-binary urllib3-future -r requirements-dev.lock.txt

      - name: Run fast unit tests with coverage
        run: task test:backend:unit:coverage

      # Agents suite — wired into CI 2026-07 after the audit found it had
      # silently rotted (83 failures) because no gate ever ran it.
      - name: Run agents tests
        run: task test:backend:agents

      # F006: the path-level taxonomy guard proves test FILES live under a
      # CI-executed root, but a file can still be fully deselected by a job's
      # marker expression. This gate collects every nodeid + its markers and
      # fails if any test runs in NO job and is not in the justified,
      # shrink-only allowlist (apps/api/tests/marker_coverage_allowlist.json).
      - name: Marker-coverage gate (F006 — no test runs in zero jobs)
        run: task test:markers

      # ADR-215: the self-host installer must stay provably installable on
      # every commit — wizard suite, release-artifact suite, full Compose
      # scenario matrix (config --quiet only), installer lint, and the
      # focused backend contracts. No service is started, nothing is pulled.
      - name: Hermetic installer gate (ADR-215)
        run: task test:install:hermetic

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./apps/api/coverage.xml
          flags: backend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  test-backend-integration:
    name: Test Backend Integration
    runs-on: ubuntu-latest
    needs: lint-backend

    services:
      # Credentials deliberately match apps/api/.env.test: conftest.py loads
      # .env.test with override=True, so tests that read settings.database_url
      # directly (e.g. the LangGraph checkpointer) reach this same service.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # TEST_DATABASE_URL is the only DB variable that survives the .env.test
      # override (see tests/conftest.py::_detect_environment) — it routes the
      # fixtures to the service container instead of Testcontainers.
      TEST_DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_db
      # F019: this job provisions PostgreSQL as a service — it PROMISES a DB, so an
      # unreachable DB / Testcontainers error must FAIL the job, not silently skip
      # whole DB test groups (conftest.py::_db_unavailable honours this flag).
      LIA_REQUIRE_DB: "1"
      REDIS_URL: redis://localhost:6379
      REDIS_PASSWORD: ""
      SECRET_KEY: test-secret-key-minimum-32-characters-long-for-testing
      # Fallback = the throwaway PUBLIC test key from apps/api/.env.test: the
      # TEST_FERNET_KEY repo secret is optional (absent on forks/this repo), and
      # jobs that drive alembic/settings directly (no pytest .env.test reload)
      # would otherwise fail Fernet validation on an empty value.
      FERNET_KEY: ${{ secrets.TEST_FERNET_KEY || 'nXQIoBSMZtcMuA30Zz8LUORRsD3zsV04L5oOJDoR0WM=' }} # gitleaks:allow
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock.txt

      - name: Create venv and install dependencies
        working-directory: ./apps/api
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install --require-hashes --no-binary urllib3-future -r requirements-dev.lock.txt

      # Integration suite — wired into CI 2026-07 after the audit found it ran
      # in NO job (and had silently rotted, like the agents suite before it).
      # e2e/benchmark/multiprocess stay out of PR CI; slow is included (these
      # tests run nowhere else). --no-cov: the coverage gate applies to the
      # unit job only.
      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Two collections: tests/integration/, then the integration-marked tests
      # that physically live under tests/unit or tests/agents (F006) — this
      # services-equipped job is their only home. The task also runs the AC-001
      # preflight and sets LIA_REQUIRE_DB=1, so an infrastructure skip becomes a
      # loud failure instead of a green run that tested nothing.
      - name: Run integration tests
        run: task test:backend:integration

  migration-replay:
    name: Migration Replay (from scratch)
    runs-on: ubuntu-latest
    needs: lint-backend
    defaults:
      run:
        working-directory: ./apps/api

    services:
      # An EMPTY database on purpose. The unit job builds its schema via
      # create_all() and NEVER runs the migrations, so only a from-scratch
      # `alembic upgrade head` on a virgin database catches a non-replayable
      # migration (F007 — the landmine that failed at the 71st migration on a
      # DELETE from a LangGraph runtime table absent on a fresh database).
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # alembic/env.py imports the full settings; DATABASE_URL (an env var) takes
      # precedence over the .env copied below, routing alembic to the service.
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379
      REDIS_PASSWORD: ""
      SECRET_KEY: test-secret-key-minimum-32-characters-long-for-testing
      # Fallback = the throwaway PUBLIC test key from apps/api/.env.test: the
      # TEST_FERNET_KEY repo secret is optional (absent on forks/this repo), and
      # jobs that drive alembic/settings directly (no pytest .env.test reload)
      # would otherwise fail Fernet validation on an empty value.
      FERNET_KEY: ${{ secrets.TEST_FERNET_KEY || 'nXQIoBSMZtcMuA30Zz8LUORRsD3zsV04L5oOJDoR0WM=' }} # gitleaks:allow
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock.txt

      - name: Create venv and install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install --require-hashes --no-binary urllib3-future -r requirements-dev.lock.txt

      - name: Create required PostgreSQL extensions (parity with postgres-init.sql)
        env:
          PGPASSWORD: test
        run: |
          psql -h localhost -U test -d test_db -v ON_ERROR_STOP=1 \
            -c 'CREATE EXTENSION IF NOT EXISTS vector;' \
            -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";' \
            -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm;'

      - name: Provide a full settings env for alembic (.env; DATABASE_URL overridden above)
        run: cp .env.test .env

      - name: Replay the migration chain from an empty database (F007)
        run: |
          source .venv/bin/activate
          bash ../../scripts/db/check_migrations_replay.sh

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    needs: lint-frontend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The task runs the dedicated `test:coverage` script, NOT
      # `pnpm test -- --coverage`: pnpm forwards the literal `--` to vitest,
      # which silently ignores the flag (no report, Codecov uploads nothing).
      # It also blanks NEXT_PUBLIC_API_URL, which the Taskfile's global
      # `dotenv: .env` would otherwise inject locally and which measurably
      # changes branch coverage — here the variable is absent either way, so
      # the local and CI runs finally agree.
      - name: Run Vitest
        run: task test:frontend:coverage

      - name: Upload coverage
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./apps/web/coverage/coverage-final.json
          flags: frontend
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  code-hygiene:
    name: Code Hygiene
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Minimal venv at the path the tasks expect. The audit scripts are
      # stdlib-only except two: check_requirements_lock.py needs `packaging` and
      # check_ci_parity.py needs `pyyaml` to read the workflow. Keeping this to
      # two wheels rather than a full requirements-dev install is what makes the
      # job seconds instead of minutes — but a missing one is a
      # ModuleNotFoundError twenty minutes into a build, so the list is derived
      # from the scripts' imports, not guessed.
      - name: Create a minimal venv for the audit scripts
        working-directory: ./apps/api
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip --quiet
          .venv/bin/pip install packaging pyyaml --quiet

      # .bak files, synchronous Store calls on an async path, Redis setex
      # without serialization, raw `raise HTTPException` (rule #18, ADR-124),
      # multiple Alembic heads, and .env.example completeness. These were inline
      # bash until 2026-07-25, which made them impossible to run before pushing;
      # they now live in scripts/audit/check_code_hygiene.py and run identically
      # here and under `task lint:hygiene`. Severity is unchanged by the port:
      # setex, raw HTTPException and .env.example stay advisory.
      - name: Code hygiene checks
        run: task lint:hygiene -- --github

      # Single source of truth for i18n (F027): fails on any missing language,
      # invalid JSON, or key drift across the 6 locales.
      - name: Check i18n keys sync
        run: task lint:i18n

      # Hermetic deploy-path tests (F008): the readiness gate under bash
      # (success, red readiness -> rollback -> revalidation, unrecoverable
      # failure) and the Pester driver suite. No Docker, no network.
      - name: Deploy path tests
        run: task test:deploy

      # Documentation drift (F024), runtime import cycles (F009, shrink-only)
      # and backend cyclomatic complexity (F011/F015, shrink-only). Baselines
      # lower only via the scripts' own --update flags, never by hand.
      - name: Documentation, cycles and complexity ratchets
        run: task lint:docs lint:cycles lint:cc

      # ADR-112: the compiled lockfiles are what every environment installs, so
      # a manifest edit that was not re-locked is a divergence waiting to bite.
      - name: Check Python lockfiles are in sync with manifests
        run: task lint:lockfiles

      # The guard that keeps this workflow thin: every `run:` must be a task
      # call or declared infrastructure. Without it, the next gate gets added
      # inline, becomes unrunnable locally, and is discovered by a red build.
      - name: CI/local parity guard
        run: task lint:ci-parity

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build API image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile.prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./apps/web/Dockerfile.prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  python-compat:
    name: Python 3.13 Compatibility (F041)
    runs-on: ubuntu-latest
    needs: lint-backend
    defaults:
      run:
        working-directory: ./apps/api
    env:
      SECRET_KEY: test-secret-key-minimum-32-characters-long-for-testing
      # Fallback = the throwaway PUBLIC test key from apps/api/.env.test: the
      # TEST_FERNET_KEY repo secret is optional (absent on forks/this repo), and
      # jobs that drive alembic/settings directly (no pytest .env.test reload)
      # would otherwise fail Fernet validation on an empty value.
      FERNET_KEY: ${{ secrets.TEST_FERNET_KEY || 'nXQIoBSMZtcMuA30Zz8LUORRsD3zsV04L5oOJDoR0WM=' }} # gitleaks:allow
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Proves the upper half of the bounded requires-python contract
      # (">=3.12,<3.14"): 3.12 is covered by test-backend, 3.13 is what
      # developer hosts run. Fast unit subset only — no DB/Redis/coverage.
      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock.txt

      - name: Create venv and install dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install --require-hashes --no-binary urllib3-future -r requirements-dev.lock.txt

      - name: Run fast unit tests on Python 3.13
        run: |
          source .venv/bin/activate
          pytest tests/unit/ -q --no-cov -p no:cacheprovider \
            -m "not integration and not slow and not e2e and not benchmark and not multiprocess"

  installer-py310:
    name: Installer Python 3.10 floor (ADR-215)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The self-host installer runs on a bare host with only Python >= 3.10
      # — no repo venv, no pip install. Importing every wizard module under
      # EXACTLY 3.10 with bytecode writes disabled IS the gate: any 3.11+
      # syntax or runtime API (StrEnum, tomllib, datetime.UTC) fails here
      # instead of on an operator's machine.
      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Wizard self-check under the 3.10 floor
        run: python -B scripts/install/tests_py310.py

  observability:
    name: Observability Config
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Task
        uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52 # v3.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # The task expects the interpreter at apps/api/.venv; PyYAML is the only
      # dependency this script has.
      - name: Create a minimal venv for the observability validator
        working-directory: ./apps/api
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip --quiet
          .venv/bin/pip install pyyaml --quiet

      - name: Structural validation (dashboards + live rules, F025)
        # Deterministic, server-free: valid JSON/YAML, required dashboard keys,
        # unique uids, non-empty panel queries, balanced PromQL brackets.
        run: task lint:observability

      # NOTE: the two promtool steps below are deliberately NOT `task test:alerts`.
      # They run the same promtool version (v3.0.0 — the version docker-compose
      # actually runs, see below) on the same files with the same arguments, but
      # through the native binary rather than the container the local task uses — promtool is not installed on a dev machine, and
      # pulling an image on every CI run to avoid a 3-second download would be
      # the wrong trade. The MECHANISM differs, the checked artifact does not;
      # scripts/audit/check_ci_parity.py records this as a known divergence
      # rather than pretending the two are identical.
      - name: Install promtool
        # Pinned to the version docker-compose runs, not an older promtool: the
        # PromQL engine differs between majors, so validating on 2.53.2 while
        # production evaluates on 3.0.0 lets a rule pass CI and behave
        # differently in prod. Measured here: the SystemKnowledgeIndexationFailing
        # unit test passed on 2.53.2 and failed on 3.0.0, same rule, same data
        # (`increase()` extrapolation changed). Bump this with the image.
        run: |
          VER=3.0.0
          curl -fsSL -o promtool.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${VER}/prometheus-${VER}.linux-amd64.tar.gz"
          tar xzf promtool.tar.gz
          echo "$PWD/prometheus-${VER}.linux-amd64" >> "$GITHUB_PATH"

      - name: promtool check live rules (deep PromQL, F025)
        # Every rule file loaded by prometheus.yml is deep-checked, not just the
        # recording rules: recording_rules.yml (86 recording rules) AND
        # alerts-core.yml (the live core alerts — pure Prometheus templating
        # {{ $value }}/{{ $labels }}, no Jinja, so promtool parses it directly).
        # The legacy alerts.yml.template (Jinja, DISABLED in prometheus.yml) is
        # rendered at deploy time and stays covered structurally above.
        run: |
          promtool check rules \
            infrastructure/observability/prometheus/recording_rules.yml \
            infrastructure/observability/prometheus/alerts-core.yml

      - name: promtool test alert rules (functional, F025)
        # Unit-tests the core alerts against synthetic series: firing/not-firing,
        # labels, annotations and runbook links. A red expression, a divergent
        # annotation or a broken threshold fails the build — closing the gap
        # where a valid test file existed but never ran in CI.
        run: |
          promtool test rules \
            infrastructure/observability/prometheus/tests/alerts_core_test.yml

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
