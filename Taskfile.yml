  # ============================================================================
  # CI/CD Helpers
  # ============================================================================

  ci:fast:
    # Everything CI checks that needs NO external service. This is the gate to
    # run before a push: the pre-commit hook is deliberately ~5 min and skips
    # the ratchets, the deploy tests, the marker gate and the frontend coverage
    # thresholds — every one of which has redded a build after a green local run.
    desc: CI gates that need no service (~10 min) — run this before pushing
    cmds:
      - task: lint
      - task: test:backend:unit:coverage
      - task: test:markers
      - task: test:frontend:coverage
      - task: test:deploy

  ci:
    # ci:fast plus everything requiring PostgreSQL, Redis, Docker or a browser.
    # Deliberately NOT reproduced here: the Docker image builds, the Python 3.13
    # compatibility run and the gitleaks scan — all three are declared CI-only
    # in scripts/audit/check_ci_parity.py with their reason.
    desc: Full local CI (needs PostgreSQL + Redis + Docker; set TEST_DATABASE_URL to a DISPOSABLE db)
    cmds:
      - task: ci:fast
      - task: test:backend:agents
      - task: test:backend:integration
      - task: db:migrate:replay-check
      - task: test:alerts
      - task: test:e2e
      - task: security:scan

  pre-commit:
    desc: Run pre-commit checks (fast tests only)
    cmds:
      - task: format
      - task: lint
      - task: test:backend:unit:fast
