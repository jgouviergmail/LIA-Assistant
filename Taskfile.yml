version: '3'

# Load environment variables from .env file
dotenv:
  - .env

# Global variables
vars:
  API_DIR: ./apps/api
  WEB_DIR: ./apps/web
  PYTHON: python
  UV: uv  # Optional: faster pip alternative
  # Shared flags for Python lockfile compilation (deps:lock / deps:upgrade*).
  # --universal: single multi-platform lock (linux amd64/arm64, Windows, py>=3.12)
  UV_COMPILE_FLAGS: --universal --python-version 3.12 --generate-hashes --custom-compile-command "task deps:lock"
  # Pattern training settings (change these for different environments)
  PATTERNS_BASE_URL: https://localhost:8000/api/v1
  PATTERNS_SSL_FLAG: --insecure  # Use --insecure for self-signed certs, empty for valid certs
  # Reference-seed bundle digest, RECOMPUTED from the repository (ADR-215).
  # The demonstrator's database is recreated empty at every boot and must be
  # re-seeded each time: the seeds are the maintained catalogue, the migrations
  # carry an older partial copy, and running on the partial one is how the
  # daily spend ceiling went blind (measured 2026-08-07). A literal here would
  # be correct exactly until a seed is edited, and the wrapper would then
  # refuse the whole bundle. Same function the installer uses.
  DEMO_SEED_DIGEST_CMD: >-
    {{.PYTHON}} -c "import sys; sys.path.insert(0, '.');
    from pathlib import Path;
    from scripts.install.seed_bundle import compute_seed_bundle_sha256;
    print(compute_seed_bundle_sha256(Path('.')))"

tasks:
  # ============================================================================
  # Setup & Installation
  # ============================================================================

  setup:
    desc: Install all dependencies (backend + frontend + git hooks)
    deps:
      - setup:backend
      - setup:frontend
      - setup:hooks

  setup:backend:
    desc: Install backend Python dependencies (from the compiled lockfile)
    dir: "{{.API_DIR}}"
    cmds:
      - "{{.PYTHON}} -m venv .venv"
      # URLLIB3_NO_OVERRIDE + --no-binary urllib3-future: build the urllib3
      # fork from sdist so it does NOT clobber the genuine urllib3 package
      # (breaks docker-py/testcontainers on Windows). See requirements.txt.
      - cmd: URLLIB3_NO_OVERRIDE=1 .venv/Scripts/pip install --require-hashes --no-binary urllib3-future -r requirements-dev.lock.txt
        platforms: [windows]
      - cmd: URLLIB3_NO_OVERRIDE=1 .venv/bin/pip install --require-hashes --no-binary urllib3-future -r requirements-dev.lock.txt
        platforms: [linux, darwin]
    status:
      - test -d {{.API_DIR}}/.venv

  setup:frontend:
    desc: Install frontend Node dependencies
    dir: "{{.WEB_DIR}}"
    cmds:
      - pnpm install
    status:
      - test -d {{.WEB_DIR}}/node_modules

  setup:hooks:
    desc: Install Git pre-commit hooks (uses core.hooksPath)
    cmds:
      - cmd: bash ./scripts/install-hooks.sh
        platforms: [windows, linux, darwin]
    status:
      - git config core.hooksPath | grep -q ".github/hooks"

  # ============================================================================
  # Python Dependencies (lockfiles)
  # ============================================================================
  # requirements.txt / requirements-dev.txt are the intent manifests (loose pins
  # allowed); requirements.lock.txt / requirements-dev.lock.txt are the compiled
  # universal lockfiles actually installed everywhere (Docker, CI, venv).
  # Workflow: edit the manifest -> task deps:lock -> commit manifest + locks.

  deps:lock:
    desc: Regenerate Python lockfiles (keeps existing pins; only applies manifest changes)
    dir: "{{.API_DIR}}"
    cmds:
      - "{{.UV}} pip compile requirements.txt {{.UV_COMPILE_FLAGS}} -o requirements.lock.txt"
      - "{{.UV}} pip compile requirements-dev.txt -c requirements.lock.txt {{.UV_COMPILE_FLAGS}} -o requirements-dev.lock.txt"

  deps:upgrade:
    desc: "Upgrade specific packages in the lockfiles: task deps:upgrade -- <pkg> [<pkg>...]"
    dir: "{{.API_DIR}}"
    preconditions:
      - sh: test -n "{{.CLI_ARGS}}"
        msg: "Usage: task deps:upgrade -- <pkg> [<pkg>...] (use deps:upgrade:all for a full upgrade)"
    cmds:
      - |
        UPGRADE_FLAGS=""
        for pkg in {{.CLI_ARGS}}; do UPGRADE_FLAGS="$UPGRADE_FLAGS --upgrade-package $pkg"; done
        {{.UV}} pip compile requirements.txt $UPGRADE_FLAGS {{.UV_COMPILE_FLAGS}} -o requirements.lock.txt
        {{.UV}} pip compile requirements-dev.txt -c requirements.lock.txt $UPGRADE_FLAGS {{.UV_COMPILE_FLAGS}} -o requirements-dev.lock.txt

  deps:upgrade:all:
    desc: Upgrade ALL packages in the lockfiles to the latest versions allowed by the manifests
    dir: "{{.API_DIR}}"
    cmds:
      - "{{.UV}} pip compile requirements.txt --upgrade {{.UV_COMPILE_FLAGS}} -o requirements.lock.txt"
      - "{{.UV}} pip compile requirements-dev.txt -c requirements.lock.txt --upgrade {{.UV_COMPILE_FLAGS}} -o requirements-dev.lock.txt"

  # ============================================================================
  # Development
  # ============================================================================

  dev:
    desc: Start development environment (Docker Compose)
    cmds:
      - docker compose -f docker-compose.dev.yml up --build

  dev:detach:
    desc: Start development environment in background
    cmds:
      - docker compose -f docker-compose.dev.yml up -d --build

  dev:langfuse:
    desc: Start dev environment WITH the Langfuse observability stack (opt-in profile)
    cmds:
      - docker compose -f docker-compose.dev.yml --profile langfuse up -d --build

  dev:api:
    desc: Run API standalone (requires PostgreSQL + Redis running)
    dir: "{{.API_DIR}}"
    cmds:
      - cmd: .venv/Scripts/python -m uvicorn src.main:app --reload --host 0.0.0.0 --port 8000
        platforms: [windows]
      - cmd: .venv/bin/python -m uvicorn src.main:app --reload --host 0.0.0.0 --port 8000
        platforms: [linux, darwin]

  dev:web:
    desc: Run frontend standalone
    dir: "{{.WEB_DIR}}"
    cmds:
      - pnpm dev

  dev:trust-cert:
    desc: "Trust the dev TLS certificate (required for WebAuthn/passkeys — Chromium refuses ceremonies on untrusted certs)"
    cmds:
      # The bind mount auto-creates exports/ on the host if missing.
      - docker run --rm -v lia_ssl_certs:/certs -v "{{.ROOT_DIR}}/exports:/out" alpine cp /certs/cert.pem /out/lia-dev-cert.pem
      - cmd: certutil -f -user -addstore Root exports/lia-dev-cert.pem
        platforms: [windows]
      - cmd: 'echo "Linux/macOS: import exports/lia-dev-cert.pem into your trust store (see GETTING_STARTED > WebAuthn / Passkeys in Development)"'
        platforms: [linux, darwin]
      - cmd: 'echo "Done. RESTART YOUR BROWSER COMPLETELY (certificate verdicts are cached for the browser lifetime). Firefox users: import exports/lia-dev-cert.pem in Settings > Certificates. Re-run this task after ssl-init regenerates certificates (every ~30 days or after: docker volume rm lia_ssl_certs)."'

  dev:all:
    desc: "Dev: restart BOTH the application stack and the demonstrator, then check them"
    # Two separate Compose projects on purpose (the demonstrator shares no
    # network, no volume and no container name with dev). They are restarted
    # TOGETHER because they are validated together: the demonstrator runs the
    # standard image, so a change to the API belongs in both before it can be
    # judged. `demo:up:dev` publishes the loopback ports; `demo:provision`
    # re-arms the marker the tmpfs database loses at every recreation, and
    # refuses a model this catalogue cannot price.
    cmds:
      - task: stop:all
      - docker compose -f docker-compose.dev.yml up -d --build --wait
      - task: demo:up:dev
      - task: demo:provision
      - task: dev:all:status

  dev:all:status:
    desc: "Dev: what both stacks report right now"
    cmds:
      - cmd: docker compose -f docker-compose.dev.yml ps
      - cmd: docker compose --env-file .env.demo-instance -f docker-compose.demo-instance.yml ps
      # Single-quoted YAML: a double-quoted scalar would turn the curl format
      # escape into a real newline and break the parse.
      - cmd: 'curl -sk -o /dev/null -w "  application  https://localhost:8000/health -> %{http_code}
" https://localhost:8000/health'
        ignore_error: true
      - cmd: 'curl -s -o /dev/null -w "  demonstrator http://localhost:8090/health -> %{http_code}
" http://localhost:8090/health'
        ignore_error: true

  stop:all:
    desc: "Dev: stop BOTH the application stack and the demonstrator"
    # The demonstrator's database is in tmpfs and dies here, by design.
    cmds:
      - cmd: docker compose -f docker-compose.dev.yml down
        ignore_error: true
      - cmd: docker compose --env-file .env.demo-instance -f docker-compose.demo-instance.yml --profile tunnel down
        ignore_error: true

  stop:
    desc: Stop development environment
    cmds:
      - docker compose -f docker-compose.dev.yml down

  restart:
    desc: Restart development environment
    cmds:
      - task: stop
      - task: dev:detach

  # ============================================================================
  # Linting & Formatting
  # ============================================================================

  lint:
    desc: Run all linters
    deps:
      - lint:backend
      - lint:frontend
      - lint:i18n
      - lint:docs
      - lint:mypy-debt
      - lint:observability
      - lint:cycles
      - lint:cc
      - lint:hygiene
      - lint:lockfiles
      - lint:ci-parity

  lint:ci-parity:
    desc: The CI workflow must orchestrate (task calls), never implement (inline gates)
    cmds:
      - cmd: apps/api/.venv/Scripts/python scripts/audit/check_ci_parity.py
        platforms: [windows]
      - cmd: apps/api/.venv/bin/python scripts/audit/check_ci_parity.py
        platforms: [linux, darwin]

  lint:hygiene:
    desc: Code-hygiene checks (.bak, sync Store calls, Redis setex, raw HTTPException, alembic heads, .env.example)
    cmds:
      # CLI_ARGS lets CI pass --github for workflow annotations:
      #   task lint:hygiene -- --github
      - cmd: apps/api/.venv/Scripts/python scripts/audit/check_code_hygiene.py {{.CLI_ARGS}}
        platforms: [windows]
      - cmd: apps/api/.venv/bin/python scripts/audit/check_code_hygiene.py {{.CLI_ARGS}}
        platforms: [linux, darwin]

  lint:lockfiles:
    desc: Verify the Python lockfiles are in sync with their manifests (ADR-112)
    cmds:
      - cmd: apps/api/.venv/Scripts/python scripts/check_requirements_lock.py
        platforms: [windows]
      - cmd: apps/api/.venv/bin/python scripts/check_requirements_lock.py
        platforms: [linux, darwin]

  test:markers:
    # Runs from apps/api like the CI step: the script resolves the allowlist
    # relative to the working directory (`tests/marker_coverage_allowlist.json`).
    desc: Marker-coverage gate (F006) — no test may run in zero CI jobs
    dir: "{{.API_DIR}}"
    cmds:
      - cmd: .venv/Scripts/python ../../scripts/audit/check_test_marker_coverage.py
        platforms: [windows]
      - cmd: .venv/bin/python ../../scripts/audit/check_test_marker_coverage.py
        platforms: [linux, darwin]

  test:frontend:coverage:
    desc: Frontend tests WITH the per-file coverage thresholds CI enforces
    dir: "{{.WEB_DIR}}"
    # This Taskfile declares `dotenv: - .env` GLOBALLY, so every task inherits
    # the developer's environment — including NEXT_PUBLIC_API_URL. The CI runner
    # has no such file, and the difference is not cosmetic: measured 2026-07-25,
    # `voice-input-service.ts` drops from passing to 80% branch coverage against
    # an 83% floor purely because that variable is set, because the code reads
    # `process.env.NEXT_PUBLIC_API_URL || ''` and the empty branch stops being
    # exercised. Blanking it reproduces the CI environment exactly (empty and
    # absent are equivalent to the code, and to the coverage counter).
    # Same leak class for NEXT_PUBLIC_PRODUCT_TELEMETRY (ADR-178): a developer
    # .env with the flag on would flip the telemetry "inert by default" tests.
    env:
      NEXT_PUBLIC_API_URL: ""
      NEXT_PUBLIC_PRODUCT_TELEMETRY: ""
    cmds:
      - pnpm test:coverage

  test:e2e:
    desc: Playwright E2E + axe accessibility journeys (hermetic, mocked API)
    dir: "{{.WEB_DIR}}/e2e"
    # These are not CI-specific knobs, they are how the suite runs at all:
    # Playwright builds the app and serves the standalone output itself
    # (`next start` does not work with output: standalone), binds IPv4 because
    # the standalone server is IPv4-only, and keeps API URLs relative so browser
    # traffic stays same-origin and interceptable. Declared here so a local run
    # and the CI job behave identically.
    env:
      E2E_MANAGED_SERVER: "1"
      E2E_BASE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_API_URL: ""
    cmds:
      - npm run typecheck
      - npx playwright test

  test:e2e:showroom:
    desc: Guided showroom P0 — CLEAN managed build, telemetry OFF (zero-API oracle + axe)
    dir: "{{.WEB_DIR}}/e2e"
    # E2E_FORCE_FRESH purges .next and forbids server reuse: NEXT_PUBLIC_*
    # flags are baked at build time, so a stale build would test the wrong
    # variant (ADR-192 evidence doctrine). Vitals sample rate is zeroed so the
    # layout TelemetryBootstrap cannot blur the network oracle.
    env:
      E2E_MANAGED_SERVER: "1"
      E2E_FORCE_FRESH: "1"
      E2E_SHOWROOM: "1"
      E2E_BASE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_API_URL: ""
      NEXT_PUBLIC_PUBLIC_SHOWROOM_VARIANT: guided
      NEXT_PUBLIC_PRODUCT_TELEMETRY: "false"
      NEXT_PUBLIC_WEB_VITALS_SAMPLE_RATE: "0"
    cmds:
      - npx playwright test smoke/public-demo-showroom.spec.ts a11y/axe-public-demo-showroom.spec.ts

  test:e2e:showroom:telemetry:
    desc: Guided showroom P0 — CLEAN managed build, telemetry ON (credential-less contract)
    dir: "{{.WEB_DIR}}/e2e"
    env:
      E2E_MANAGED_SERVER: "1"
      E2E_FORCE_FRESH: "1"
      E2E_SHOWROOM: "1"
      E2E_BASE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_API_URL: ""
      NEXT_PUBLIC_PUBLIC_SHOWROOM_VARIANT: guided
      NEXT_PUBLIC_PRODUCT_TELEMETRY: "true"
      NEXT_PUBLIC_WEB_VITALS_SAMPLE_RATE: "0"
    cmds:
      - npx playwright test smoke/public-demo-showroom-telemetry.spec.ts

  test:e2e:showroom:capture:
    desc: Guided showroom P0 — reproducible launch-asset capture (video + stills)
    dir: "{{.WEB_DIR}}/e2e"
    env:
      E2E_MANAGED_SERVER: "1"
      E2E_FORCE_FRESH: "1"
      E2E_SHOWROOM: "1"
      E2E_BASE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_API_URL: ""
      NEXT_PUBLIC_PUBLIC_SHOWROOM_VARIANT: guided
      NEXT_PUBLIC_PRODUCT_TELEMETRY: "false"
      NEXT_PUBLIC_WEB_VITALS_SAMPLE_RATE: "0"
    cmds:
      - npx playwright test capture/public-demo-showroom.spec.ts

  # --- Public-demo isolated deployment (P2 live — owner protocol Étape 1/3) --
  # ---------------------------------------------------------------------
  # Demonstrator instance (ADR-216→218). The STANDARD image in an isolated
  # envelope: what a visitor tries is what LIA actually does, and the limits
  # sit around it rather than inside it.
  #
  # `demo:start` is the one command for a local validation; the others exist
  # for when something needs to be looked at separately.
  # ---------------------------------------------------------------------
  demo:start:
    desc: "Demonstrator: build, start, wait for health, provision the marker (one command)"
    cmds:
      - task: demo:up:dev
      - task: demo:provision
      - task: demo:status

  demo:up:
    desc: "Demonstrator: build + start the isolated envelope (no tunnel)"
    # The tunnel lives behind `--profile tunnel` (task demo:up:tunnel): a
    # laptop validation reaches the edge on localhost and needs no Cloudflare.
    env:
      SEED_BUNDLE_SHA256:
        sh: "{{.DEMO_SEED_DIGEST_CMD}}"
    cmds:
      - docker compose --env-file .env.demo-instance -f docker-compose.demo-instance.yml up -d --build --wait

  demo:up:dev:
    desc: "Demonstrator: same, plus the API on 127.0.0.1:8100 to reach the administration"
    # The edge 404s /api/v1/admin/* on purpose, so the ceiling and the
    # capability switches are not reachable from https://localhost/. On a
    # laptop the operator's door is a loopback port — never in production.
    env:
      SEED_BUNDLE_SHA256:
        sh: "{{.DEMO_SEED_DIGEST_CMD}}"
    cmds:
      - docker compose --env-file .env.demo-instance -f docker-compose.demo-instance.yml -f docker-compose.demo-instance.dev.yml up -d --build --wait

  demo:up:tunnel:
    desc: "Demonstrator: start WITH the Cloudflare tunnel (the public way in)"
    # The only path that needs the connector token, so the only place that
    # checks it. Reads the PRODUCTION env file: the tunnel is what puts this
    # instance on the Internet.
    env:
      SEED_BUNDLE_SHA256:
        sh: "{{.DEMO_SEED_DIGEST_CMD}}"
    cmds:
      - grep -q "^DEMO_INSTANCE_TUNNEL_TOKEN=." .env.demo-instance.prod || (echo "DEMO_INSTANCE_TUNNEL_TOKEN is empty in .env.demo-instance.prod — the tunnel cannot connect" && exit 1)
      - docker compose --env-file .env.demo-instance.prod -f docker-compose.demo-instance.yml --profile tunnel up -d --build --wait

  demo:provision:
    desc: "Demonstrator: write the instance marker (REFUSES a populated database)"
    # The marker is what authorizes the nightly purge, and it lives IN THE
    # DATABASE: the environment flag alone never authorizes deleting accounts.
    # That safeguard exists because a proof script once forced the flag
    # against the development database and destroyed real accounts.
    cmds:
      - docker compose --env-file .env.demo-instance -f docker-compose.demo-instance.yml exec -T -w /app demo-instance-api python -m src.infrastructure.provisioning.cli

  demo:provision:force:
    desc: "Demonstrator: write the marker on a database that ALREADY holds accounts"
    # The plain `demo:provision` refuses a populated database — the guard the
    # 2026-08-06 incident earned, when a proof script armed the purge against
    # development data. But a demonstrator's database is in tmpfs: recreating
    # that container drops the marker while visitors keep signing up, and the
    # nightly purge then never arms. This is the deliberate way back, typed
    # by an operator who knows which instance they are on.
    prompt: "Arm the NIGHTLY DELETION of every non-superuser account on this database. Continue?"
    cmds:
      - docker compose --env-file .env.demo-instance -f docker-compose.demo-instance.yml exec -T -w /app demo-instance-api python -m src.infrastructure.provisioning.cli --force

  demo:verify:
    desc: "Demonstrator: check the closed surface is closed AND the spend ceiling can see"
    # Two protections, two checks. The surface one runs from a container on
    # the ingress network (a host curl cannot reach an edge that publishes no
    # port). The money one runs inside the API, because only it can ask the
    # catalogue whether the configured model has a price — and a ceiling that
    # reads a flat ledger is not a ceiling (measured 2026-08-07).
    cmds:
      - docker compose --env-file .env.demo-instance -f docker-compose.demo-instance.yml exec -T -w /app demo-instance-api python -m src.infrastructure.provisioning.cli --verify
      # Third protection, and the only one that used to be assumed rather than
      # measured: can this container reach the machine that hosts it? Docker's
      # `internal` networks do not cover the bridge gateway, which IS the host
      # (measured 2026-08-07 with disposable containers). The probe opens real
      # connections and fails if any answers.
      - docker compose --env-file .env.demo-instance -f docker-compose.demo-instance.yml exec -T -w /app demo-instance-api python scripts/ops/probe_host_isolation.py
      - docker run --rm --network lia-demo-instance_demo-instance-ingress curlimages/curl:8.11.1 sh -c 'fail=0; for p in /api/v1/connectors/gmail/authorize /api/v1/auth/google/login /api/v1/auth/apple/login /api/v1/admin/capabilities /api/v1/usage-limits/admin/instance-daily-budget /metrics; do c=$(curl -s -o /dev/null -w "%{http_code}" http://demo-instance-edge$p); echo "  $c  $p"; [ "$c" = "404" ] || fail=1; done; for p in /api/v1/auth/login /api/v1/auth/register /api/v1/capabilities; do c=$(curl -s -o /dev/null -w "%{http_code}" http://demo-instance-edge$p); echo "  $c  $p (must NOT be 404)"; [ "$c" = "404" ] && fail=1; done; [ $fail = 0 ] && echo "surface OK" || echo "SURFACE REGRESSED"; exit $fail'

  demo:harden:
    desc: "Demonstrator: cut the container->host path Docker's `internal` leaves open (run ON the host)"
    # `internal: true` blocks routing outward, NOT the bridge gateway, and that
    # gateway is the host. On the production machine that means sshd. The rules
    # are idempotent — deleted before inserted — so this converges on every
    # deploy rather than stacking duplicates.
    #
    # Linux only: it drives iptables. Running it from a Windows workstation is
    # meaningless, which is why `deploy:prod` invokes it over SSH instead.
    cmds:
      - cmd: sh scripts/deploy/harden-demo-host.sh
        platforms: [linux, darwin]
      - cmd: echo "harden-demo-host.sh runs ON the Docker host (Linux). Use task deploy:prod, or run it over SSH."
        platforms: [windows]

  demo:harden:check:
    desc: "Demonstrator: report whether the host-isolation rules are installed (exit 1 if not)"
    cmds:
      - cmd: sh scripts/deploy/harden-demo-host.sh --check
        platforms: [linux, darwin]
      - cmd: echo "harden-demo-host.sh --check runs ON the Docker host (Linux)."
        platforms: [windows]

  demo:status:
    desc: "Demonstrator: container state + what the instance reports"
    cmds:
      - docker compose --env-file .env.demo-instance -f docker-compose.demo-instance.yml ps
      - cmd: docker compose --env-file .env.demo-instance -f docker-compose.demo-instance.yml exec -T demo-instance-api python -c "import urllib.request,json;print(json.dumps(json.load(urllib.request.urlopen('http://127.0.0.1:8000/ready',timeout=10)),indent=1))"
        ignore_error: true

  demo:logs:
    desc: "Demonstrator: follow the API logs (CLI_ARGS for another service)"
    cmds:
      - docker compose --env-file .env.demo-instance -f docker-compose.demo-instance.yml logs -f {{.CLI_ARGS | default "demo-instance-api"}}

  demo:down:
    desc: "Demonstrator: stop everything (the tmpfs database dies with it, by design)"
    cmds:
      - docker compose --env-file .env.demo-instance -f docker-compose.demo-instance.yml --profile tunnel down


  test:alerts:
    # promtool is not installed locally; this uses the image, and the CI job
    # installs the same version, so a rule that passes here passes there.
    # The version is pinned to the one docker-compose runs (v3.0.0), NOT an
    # older promtool: the PromQL engine differs between majors and a rule
    # validated on 2.53.2 could behave differently in production. Measured on
    # this very repository — the SystemKnowledgeIndexationFailing unit test
    # passed on 2.53.2 and failed on 3.0.0 for the same rule and the same data,
    # because `increase()` extrapolation changed. Bump this with the image.
    desc: promtool validation of the live Prometheus rules + alert unit tests (F025)
    cmds:
      - cmd: docker run --rm -v "{{.ROOT_DIR}}/infrastructure/observability/prometheus:/cfg"
          --entrypoint promtool prom/prometheus:v3.0.0
          check rules /cfg/recording_rules.yml /cfg/alerts-core.yml
      - cmd: docker run --rm -v "{{.ROOT_DIR}}/infrastructure/observability/prometheus:/cfg"
          --entrypoint promtool prom/prometheus:v3.0.0
          test rules /cfg/tests/alerts_core_test.yml

  lint:i18n:
    desc: Validate frontend i18n key parity across all 6 languages (en reference)
    cmds:
      - cmd: apps/api/.venv/Scripts/python scripts/i18n/validate_translations.py
        platforms: [windows]
      - cmd: apps/api/.venv/bin/python scripts/i18n/validate_translations.py
        platforms: [linux, darwin]

  lint:docs:
    desc: Audit documentation drift (broken links; ADR→ADR escalated to failing — F024)
    cmds:
      # --fail-on-stale mirrors the CI step: without it the local task was the
      # more permissive of the two, which is the wrong direction for a gate.
      - cmd: apps/api/.venv/Scripts/python scripts/audit/doc_audit.py --fail-on-stale
        platforms: [windows]
      - cmd: apps/api/.venv/bin/python scripts/audit/doc_audit.py --fail-on-stale
        platforms: [linux, darwin]

  lint:mypy-debt:
    desc: Ratchet the MyPy exemption surface (shrink-only; fails on new exemptions — F020)
    cmds:
      - cmd: apps/api/.venv/Scripts/python scripts/audit/measure_mypy_debt.py --check
        platforms: [windows]
      - cmd: apps/api/.venv/bin/python scripts/audit/measure_mypy_debt.py --check
        platforms: [linux, darwin]

  lint:observability:
    desc: Validate Grafana dashboards + Prometheus rules (structural, F025)
    cmds:
      - cmd: apps/api/.venv/Scripts/python scripts/observability/validate_observability.py
        platforms: [windows]
      - cmd: apps/api/.venv/bin/python scripts/observability/validate_observability.py
        platforms: [linux, darwin]

  lint:cycles:
    desc: Ratchet runtime domain import cycles (shrink-only; fails on new cycles — F009)
    cmds:
      - cmd: apps/api/.venv/Scripts/python scripts/audit/measure_coupling.py --check-cycles
        platforms: [windows]
      - cmd: apps/api/.venv/bin/python scripts/audit/measure_coupling.py --check-cycles
        platforms: [linux, darwin]

  lint:cc:
    desc: Ratchet backend cyclomatic complexity (shrink-only; fails on new hotspots — F011/F015)
    cmds:
      - cmd: apps/api/.venv/Scripts/python scripts/audit/measure_cc.py --check-ratchet
        platforms: [windows]
      - cmd: apps/api/.venv/bin/python scripts/audit/measure_cc.py --check-ratchet
        platforms: [linux, darwin]

  lint:backend:
    desc: Lint backend code
    dir: "{{.API_DIR}}"
    cmds:
      - cmd: .venv/Scripts/ruff check src tests
        platforms: [windows]
      - cmd: .venv/bin/ruff check src tests
        platforms: [linux, darwin]
      - cmd: .venv/Scripts/black --check src tests
        platforms: [windows]
      - cmd: .venv/bin/black --check src tests
        platforms: [linux, darwin]
      - cmd: .venv/Scripts/mypy src --config-file=pyproject.toml
        platforms: [windows]
      - cmd: .venv/bin/mypy src --config-file=pyproject.toml
        platforms: [linux, darwin]

  lint:frontend:
    # Mirrors the CI job `lint-frontend` step for step. The three ratchets were
    # CI-only until 2026-07-25, which is how a one-line a11y fix redded the
    # complexity ratchet one commit after passing every local gate.
    desc: Lint frontend code (eslint + tsc + a11y/react-hooks/complexity ratchets)
    dir: "{{.WEB_DIR}}"
    cmds:
      - pnpm lint
      - pnpm a11y:ratchet
      - pnpm react-hooks:ratchet
      - pnpm cc:ratchet
      - pnpm type-check

  format:
    desc: Auto-format all code
    deps:
      - format:backend
      - format:frontend

  format:backend:
    desc: Format backend code
    dir: "{{.API_DIR}}"
    cmds:
      - cmd: .venv/Scripts/black src tests
        platforms: [windows]
      - cmd: .venv/bin/black src tests
        platforms: [linux, darwin]
      - cmd: .venv/Scripts/ruff check --fix src tests
        platforms: [windows]
      - cmd: .venv/bin/ruff check --fix src tests
        platforms: [linux, darwin]

  format:frontend:
    desc: Format frontend code
    dir: "{{.WEB_DIR}}"
    cmds:
      - pnpm format

  # ============================================================================
  # Testing
  # ============================================================================

  test:
    desc: Run all tests
    deps:
      - test:backend
      - test:frontend

  test:backend:
    desc: Run backend tests
    dir: "{{.API_DIR}}"
    cmds:
      - cmd: .venv/Scripts/pytest tests/ --cov=src --cov-report=term-missing --cov-report=html
        platforms: [windows]
      - cmd: .venv/bin/pytest tests/ --cov=src --cov-report=term-missing --cov-report=html
        platforms: [linux, darwin]

  test:backend:unit:
    desc: Run backend unit tests only (all, including slow)
    dir: "{{.API_DIR}}"
    cmds:
      - cmd: .venv/Scripts/pytest tests/unit/ -v
        platforms: [windows]
      - cmd: .venv/bin/pytest tests/unit/ -v
        platforms: [linux, darwin]

  test:backend:unit:fast:
    desc: Run fast unit tests only (excludes slow/integration tests) - used by pre-commit
    dir: "{{.API_DIR}}"
    cmds:
      # -n 8 --dist loadscope (pytest-xdist): parallel workers, tests
      # grouped by module — same flags as the pre-commit hook pytest step.
      #
      # The worker count is CAPPED on purpose. Measured 2026-08-03 on a
      # 24-core host: `-n auto` wedges the run at 99 % (five reproductions,
      # including on a clean worktree of the previous release). py-spy on the
      # stuck workers showed 16 of 24 blocked in `socket.accept` inside
      # `_fallback_socketpair` — asyncio building the Windows proactor
      # self-pipe as pytest-asyncio creates an event loop. The suite completes
      # at -n 4 and -n 8; a cap keeps the gate deterministic.
      - cmd: .venv/Scripts/pytest tests/unit/ -v --no-cov -m "not integration and not slow and not e2e and not benchmark and not multiprocess" -n 8 --dist loadscope
        platforms: [windows]
      - cmd: .venv/bin/pytest tests/unit/ -v --no-cov -m "not integration and not slow and not e2e and not benchmark and not multiprocess" -n 8 --dist loadscope
        platforms: [linux, darwin]

  test:backend:integration:
    desc: Run backend integration tests (mirrors CI test-backend-integration; needs PG+Redis)
    dir: "{{.API_DIR}}"
    cmds:
      # AC-001 preflight: classify the DB strategy (explicit URL / in-docker /
      # Testcontainers) and fail fast with an actionable diagnostic when none
      # is available. Once it passes, a database is PROMISED: LIA_REQUIRE_DB=1
      # turns any downstream infrastructure skip into a loud failure so a green
      # exit code can never be produced by mass DB skips (F019).
      - cmd: .venv/Scripts/python scripts/integration_preflight.py
        platforms: [windows]
      - cmd: .venv/bin/python scripts/integration_preflight.py
        platforms: [linux, darwin]
      - cmd: LIA_REQUIRE_DB=1 .venv/Scripts/pytest tests/integration/ -v --tb=short --no-cov -m "not e2e and not benchmark and not multiprocess"
        platforms: [windows]
      - cmd: LIA_REQUIRE_DB=1 .venv/bin/pytest tests/integration/ -v --tb=short --no-cov -m "not e2e and not benchmark and not multiprocess"
        platforms: [linux, darwin]
      # F006: integration-marked tests co-located under tests/unit / tests/agents
      # run in this services-equipped job (they'd otherwise run in no job), and
      # the marker-coverage guard mirrors exactly this collection. ONE block on
      # purpose: a second, identical invocation was added on 2026-07-25 on the
      # false premise that this one was missing, and ran the whole collection
      # twice here AND in CI (which now calls this task).
      - cmd: LIA_REQUIRE_DB=1 .venv/Scripts/pytest tests/unit/ tests/agents/ -v --tb=short --no-cov -m "integration and not e2e and not benchmark and not multiprocess"
        platforms: [windows]
      - cmd: LIA_REQUIRE_DB=1 .venv/bin/pytest tests/unit/ tests/agents/ -v --tb=short --no-cov -m "integration and not e2e and not benchmark and not multiprocess"
        platforms: [linux, darwin]

  test:backend:exhaustive:
    desc: Run ALL backend tests (unit + integration + agents + e2e) - FULL test suite
    dir: "{{.API_DIR}}"
    cmds:
      - echo "=== Running EXHAUSTIVE test suite (this may take several minutes) ==="
      - cmd: .venv/Scripts/pytest tests/ -v --tb=short --cov=src --cov-report=term-missing --durations=20
        platforms: [windows]
      - cmd: .venv/bin/pytest tests/ -v --tb=short --cov=src --cov-report=term-missing --durations=20
        platforms: [linux, darwin]
      - echo "=== Exhaustive test suite completed ==="

  test:backend:slow:
    desc: Run ONLY slow tests (integration, slow, e2e, benchmark, multiprocess)
    dir: "{{.API_DIR}}"
    cmds:
      - cmd: .venv/Scripts/pytest tests/ -v -m "integration or slow or e2e or benchmark or multiprocess" --tb=short
        platforms: [windows]
      - cmd: .venv/bin/pytest tests/ -v -m "integration or slow or e2e or benchmark or multiprocess" --tb=short
        platforms: [linux, darwin]

  test:backend:unit:coverage:
    # The CI command, verbatim — including the 65% floor (raised from 63 on
    # 2026-08-01; measured 66.54% after ADR-194 and its follow-up lots, so the
    # floor stays at 64: 65 would leave 1.54 pt of headroom, under the >=2 pt
    # rule. Re-measured 2026-08-04 after ADR-201→204 (provenance, the reading
    # hub's two read-only routes, interest explainability and the capability
    # map): 66.87% — still 64, since 65 would leave 1.87 pt. Re-measured again
    # 2026-08-04 after the hub-counts lot: 66.89% — still 64, 1.89 pt.
    # Re-measured 2026-08-05 after the production-log remediation lots
    # (graceful shutdown, deploy staging, checkpoint allowlist, FCM token
    # invalidation, Loki label policy, client-IP chokepoint, batch concurrency):
    # 66.99% — still 64, since 65 would leave 1.99 pt, a hair under the >=2 rule.
    # Re-measured 2026-08-07 after the demonstrator's security-audit lots and
    # the removal of the legacy live showroom: 67.79% — the floor moves to 65,
    # since 66 would leave 1.79 pt, again under the >=2 rule.)
    # `test:backend:unit:fast`
    # trades coverage for xdist parallelism because the pre-commit hook has a
    # 5-minute budget; that makes it the right gate for a commit and the wrong
    # one for reproducing CI, which is what this task is for.
    desc: Backend unit tests with coverage and the CI floor (mirrors the CI job step)
    dir: "{{.API_DIR}}"
    cmds:
      - cmd: .venv/Scripts/pytest tests/unit/ -v --tb=short -m "not integration and not slow and not e2e and not benchmark and not multiprocess" --cov=src --cov-report=xml --cov-report=term-missing --cov-fail-under=67
        platforms: [windows]
      - cmd: .venv/bin/pytest tests/unit/ -v --tb=short -m "not integration and not slow and not e2e and not benchmark and not multiprocess" --cov=src --cov-report=xml --cov-report=term-missing --cov-fail-under=67
        platforms: [linux, darwin]

  test:backend:agents:
    desc: Run agent-specific tests only (mirrors the CI "Run agents tests" job)
    dir: "{{.API_DIR}}"
    cmds:
      # Must match .github/workflows/ci.yml exactly (F022): --no-cov because the
      # global --cov-fail-under gate belongs to the exhaustive run, not this
      # partial subset (otherwise the command exits 1 despite all tests passing);
      # same marker filter as CI so the local suite equals the gated suite.
      - cmd: .venv/Scripts/pytest tests/agents/ -v --tb=short -m "not slow and not e2e and not benchmark and not multiprocess" --no-cov
        platforms: [windows]
      - cmd: .venv/bin/pytest tests/agents/ -v --tb=short -m "not slow and not e2e and not benchmark and not multiprocess" --no-cov
        platforms: [linux, darwin]

  test:frontend:
    desc: Run frontend tests
    dir: "{{.WEB_DIR}}"
    # Same environment neutralisation as test:frontend:coverage below — a test
    # that behaves differently under `task` than under `pnpm` is a trap.
    env:
      NEXT_PUBLIC_API_URL: ""
      NEXT_PUBLIC_PRODUCT_TELEMETRY: ""
    cmds:
      - pnpm test

  test:deploy:
    desc: Hermetic deploy-path tests (F008) — readiness-gate lib + Pester driver suite (needs Pester >= 5.5)
    cmds:
      - cmd: bash scripts/deploy/lib/test_deploy_readiness_gate.sh
      - cmd: pwsh -NoProfile -File scripts/deploy/run-deploy-driver-tests.ps1

  test:install:
    desc: Hermetic installer wizard tests (ADR-215) — stdlib wizard, no Docker
    cmds:
      - cmd: apps/api/.venv/Scripts/pytest scripts/install/tests -q
        platforms: [windows]
      - cmd: apps/api/.venv/bin/pytest scripts/install/tests -q
        platforms: [linux, darwin]

  test:release:self-host:
    desc: Self-host release artifact tests (manifest, bundle, SBOM — ADR-215)
    cmds:
      - cmd: apps/api/.venv/Scripts/pytest scripts/release/tests -q
        platforms: [windows]
      - cmd: apps/api/.venv/bin/pytest scripts/release/tests -q
        platforms: [linux, darwin]

  test:install:compose-matrix:
    desc: Render every installer Compose scenario and validate with `docker compose config --quiet` (no pull/build/up)
    cmds:
      - cmd: apps/api/.venv/Scripts/python scripts/install/tests/render_compose_matrix.py
        platforms: [windows]
      - cmd: apps/api/.venv/bin/python scripts/install/tests/render_compose_matrix.py
        platforms: [linux, darwin]

  lint:install:
    desc: Ruff + strict MyPy over the stdlib installer and release tooling
    cmds:
      - cmd: apps/api/.venv/Scripts/python -m ruff check scripts/install scripts/release
        platforms: [windows]
      - cmd: apps/api/.venv/bin/python -m ruff check scripts/install scripts/release
        platforms: [linux, darwin]
      - cmd: apps/api/.venv/Scripts/python -m mypy --strict scripts/install scripts/release --exclude "scripts/(install|release)/tests" --explicit-package-bases
        platforms: [windows]
      - cmd: apps/api/.venv/bin/python -m mypy --strict scripts/install scripts/release --exclude "scripts/(install|release)/tests" --explicit-package-bases
        platforms: [linux, darwin]

  test:install:hermetic:
    desc: The complete no-service installer gate (ADR-215) — wizard, release artifacts, Compose matrix, lint, focused backend contracts
    cmds:
      - task: test:install
      - task: lint:install
      - task: test:install:compose-matrix
      - task: test:release:self-host
      - task: test:install:backend-contracts

  test:install:backend-contracts:
    desc: Focused backend contracts of the installer chain (Tasks 2/7/8/9 + CI parity)
    dir: "{{.API_DIR}}"
    cmds:
      - cmd: .venv/Scripts/pytest tests/unit/test_validate_settings_script.py tests/unit/test_reference_seed_bundle_contract.py tests/unit/test_bootstrap_install_contract.py tests/unit/test_verify_installation_script.py tests/unit/test_installer_wizard_backend_alignment.py tests/unit/test_installer_ci_contract.py -q --no-cov
        platforms: [windows]
      - cmd: .venv/bin/pytest tests/unit/test_validate_settings_script.py tests/unit/test_reference_seed_bundle_contract.py tests/unit/test_bootstrap_install_contract.py tests/unit/test_verify_installation_script.py tests/unit/test_installer_wizard_backend_alignment.py tests/unit/test_installer_ci_contract.py -q --no-cov
        platforms: [linux, darwin]

  test:watch:
    desc: Run backend tests in watch mode
    dir: "{{.API_DIR}}"
    cmds:
      - cmd: .venv/Scripts/pytest-watch
        platforms: [windows]
      - cmd: .venv/bin/pytest-watch
        platforms: [linux, darwin]

  # File-size ratchet (test_file_size_ratchet_guard.py): caps can only go DOWN.
  # Run after shrinking a frozen file so its cap follows it (current SLOC +2%).
  ratchet:update:
    desc: Lower file-size ratchet caps to current sizes (never raises, never adds)
    dir: "{{.API_DIR}}"
    cmds:
      - cmd: .venv/Scripts/python ../../scripts/audit/update_file_size_baseline.py
        platforms: [windows]
      - cmd: .venv/bin/python ../../scripts/audit/update_file_size_baseline.py
        platforms: [linux, darwin]

  # ============================================================================
  # Database
  # ============================================================================

  db:migrate:
    desc: Run database migrations
    dir: "{{.API_DIR}}"
    # F047 defense-in-depth: force UTF-8 so a Windows CP1252 console can never
    # break a migration on its output (the root cause — print()/emoji — is also
    # removed from the migrations and guarded). Harmless on Linux/macOS.
    env:
      PYTHONUTF8: "1"
    cmds:
      - cmd: .venv/Scripts/alembic upgrade head
        platforms: [windows]
      - cmd: .venv/bin/alembic upgrade head
        platforms: [linux, darwin]

  db:migrate:create:
    desc: Create a new migration
    dir: "{{.API_DIR}}"
    env:
      PYTHONUTF8: "1"  # F047: UTF-8 output regardless of the Windows console code page
    cmds:
      - cmd: .venv/Scripts/alembic revision --autogenerate -m "{{.CLI_ARGS}}"
        platforms: [windows]
      - cmd: .venv/bin/alembic revision --autogenerate -m "{{.CLI_ARGS}}"
        platforms: [linux, darwin]
    requires:
      vars: [CLI_ARGS]

  db:migrate:down:
    desc: Rollback last migration
    dir: "{{.API_DIR}}"
    env:
      PYTHONUTF8: "1"  # F047: UTF-8 output regardless of the Windows console code page
    cmds:
      - cmd: .venv/Scripts/alembic downgrade -1
        platforms: [windows]
      - cmd: .venv/bin/alembic downgrade -1
        platforms: [linux, darwin]

  db:migrate:replay-check:
    desc: Verify migrations replay from an EMPTY database (F007) — throwaway DB in the dev PostgreSQL
    dir: "{{.API_DIR}}"
    # F048: a portable Python launcher drives the host `docker` CLI directly, so
    # this runs identically on Windows PowerShell / Git Bash / macOS / Linux. The
    # old `bash scripts/db/replay_check_local.sh` resolved `bash` to WSL on Windows,
    # which cannot see Docker Desktop, making the local check unrunnable there.
    cmds:
      - cmd: .venv/Scripts/python ../../scripts/db/replay_check_local.py
        platforms: [windows]
      - cmd: .venv/bin/python ../../scripts/db/replay_check_local.py
        platforms: [linux, darwin]

  db:seed:
    desc: Seed database with dev data
    dir: "{{.API_DIR}}"
    cmds:
      - cmd: .venv/Scripts/python scripts/seed_dev.py
        platforms: [windows]
      - cmd: .venv/bin/python scripts/seed_dev.py
        platforms: [linux, darwin]

  db:reset:
    desc: Reset database (drop all + migrate + seed)
    cmds:
      - docker compose -f docker-compose.dev.yml down -v postgres
      - docker compose -f docker-compose.dev.yml up -d postgres
      - sleep 5
      - task: db:migrate
      - task: db:create-admin
      - task: db:seed
      - task: db:seed:sql

  db:create-admin:
    desc: Create admin user for first-time setup
    cmds:
      - docker compose -f docker-compose.dev.yml exec -T api python -m scripts.data.create_admin {{.CLI_ARGS}}

  db:create-grafana-reader:
    desc: Create/refresh the read-only Grafana product role (ADR-178 — GRANT on product views only)
    cmds:
      - docker compose -f docker-compose.dev.yml exec -T -e GRAFANA_PRODUCT_DB_PASSWORD api python -m scripts.data.create_grafana_reader

  db:seed:sql:
    desc: Apply SQL seed files (personalities, pricing, etc.)
    cmds:
      - cmd: bash -c 'for f in infrastructure/database/seeds/*.sql; do echo "Applying $f..."; cat "$f" | docker exec -i lia-postgres-dev psql -U "$POSTGRES_USER" -d "$POSTGRES_DB"; done'
        platforms: [windows, linux, darwin]

  db:seed:sql:personalities:
    desc: Apply personalities seed only
    cmds:
      - cmd: bash -c 'cat infrastructure/database/seeds/personalities_seed.sql | docker exec -i lia-postgres-dev psql -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
        platforms: [windows, linux, darwin]

  db:seed:sql:pricing:
    desc: Apply LLM pricing seed only
    cmds:
      - cmd: bash -c 'cat infrastructure/database/seeds/llm_pricing_seed.sql | docker exec -i lia-postgres-dev psql -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
        platforms: [windows, linux, darwin]

  db:seed:system-rag:
    desc: Seed/reindex system RAG spaces (FAQ knowledge base)
    cmds:
      - docker compose -f docker-compose.dev.yml exec -T api python -m scripts.seed_system_rag

  # ============================================================================
  # Database Backup (ADR-109 — runbook: docs/runbooks/DATABASE_BACKUP_RESTORE.md)
  # Defaults target dev; on the prod host pass COMPOSE_FILE / containers:
  #   task backup:now COMPOSE_FILE=docker-compose.prod.yml
  #   BACKUP_CONTAINER=lia-postgres-backup-prod SOURCE_CONTAINER=lia-postgres-prod task backup:verify
  # ============================================================================

  backup:now:
    desc: Trigger an immediate PostgreSQL backup via the postgres-backup sidecar
    vars:
      COMPOSE_FILE: '{{.COMPOSE_FILE | default "docker-compose.dev.yml"}}'
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} exec -T postgres-backup /backup.sh

  backup:verify:
    desc: Restore the latest dump into a throwaway container and compare schema + row counts
    cmds:
      - cmd: bash infrastructure/docker/backup/verify-backup.sh
        platforms: [windows, linux, darwin]

  # ============================================================================
  # Build & Deploy
  # ============================================================================

  build:
    desc: Build all Docker images for production
    cmds:
      - docker compose -f docker-compose.prod.yml build

  build:api:
    desc: Build API Docker image
    dir: "{{.API_DIR}}"
    cmds:
      - docker build -f Dockerfile.prod -t lia-api:latest .

  build:web:
    desc: Build web Docker image
    # Context MUST be the monorepo root: apps/web/Dockerfile.prod COPYs
    # pnpm-workspace.yaml / pnpm-lock.yaml / package.json from the root (pnpm
    # workspace). Building from apps/web (context ".") fails those COPY steps —
    # this mirrors the CI build (context ".", file ./apps/web/Dockerfile.prod). (F039)
    cmds:
      - docker build -f apps/web/Dockerfile.prod -t lia-web:latest .

  push:
    desc: Push Docker images to registry
    cmds:
      - docker compose -f docker-compose.prod.yml push

  deploy:
    desc: Deploy to production (local docker-compose)
    cmds:
      - echo "Deploying to production..."
      - docker compose -f docker-compose.prod.yml up -d

  # ---------------------------------------------------------------------
  # Demonstrator ON THE PRODUCTION HOST.
  #
  # `deploy:prod` ships its files and does NOT start it: putting an instance
  # in front of the Internet is a decision, not a side effect of a deployment.
  # These tasks are that decision, typed on purpose. The host/port/user come
  # from scripts/deploy/deploy.local.ps1 — the same gitignored file the deploy
  # driver reads, so the address lives in one place and never in git.
  # ---------------------------------------------------------------------

  demo:prod:status:
    desc: "Demonstrator (PROD): containers + what the instance reports"
    cmds:
      - cmd: powershell -ExecutionPolicy Bypass -File ./scripts/deploy/demo-prod.ps1 -Action status
        platforms: [windows]
      - cmd: pwsh -File ./scripts/deploy/demo-prod.ps1 -Action status
        platforms: [linux, darwin]

  demo:prod:push-env:
    desc: "Demonstrator (PROD): send the local secrets file to the host, mode 600"
    # `deploy:prod` deliberately does NOT ship it: it carries a different set
    # of credentials from the production instance. This is that act, with its
    # own refusals — a file pointing at localhost is the DEVELOPMENT one, and
    # sending it would break the verification link a visitor clicks.
    prompt: "Send .env.demo-instance.prod (provider keys, SMTP password, tunnel token) to the production host?"
    cmds:
      - cmd: powershell -ExecutionPolicy Bypass -File ./scripts/deploy/demo-prod.ps1 -Action push-env
        platforms: [windows]
      - cmd: pwsh -File ./scripts/deploy/demo-prod.ps1 -Action push-env
        platforms: [linux, darwin]

  demo:prod:up:
    desc: "Demonstrator (PROD): START it, with the Cloudflare tunnel — it becomes PUBLIC"
    prompt: "This puts the demonstrator on the Internet at its public hostname. Continue?"
    cmds:
      - cmd: powershell -ExecutionPolicy Bypass -File ./scripts/deploy/demo-prod.ps1 -Action up
        platforms: [windows]
      - cmd: pwsh -File ./scripts/deploy/demo-prod.ps1 -Action up
        platforms: [linux, darwin]

  demo:prod:down:
    desc: "Demonstrator (PROD): stop it (its tmpfs database dies with it, by design)"
    cmds:
      - cmd: powershell -ExecutionPolicy Bypass -File ./scripts/deploy/demo-prod.ps1 -Action down
        platforms: [windows]
      - cmd: pwsh -File ./scripts/deploy/demo-prod.ps1 -Action down
        platforms: [linux, darwin]

  demo:prod:verify:
    desc: "Demonstrator (PROD): closed surface + spend ceiling + host isolation, measured"
    cmds:
      - cmd: powershell -ExecutionPolicy Bypass -File ./scripts/deploy/demo-prod.ps1 -Action verify
        platforms: [windows]
      - cmd: pwsh -File ./scripts/deploy/demo-prod.ps1 -Action verify
        platforms: [linux, darwin]

  demo:prod:harden:
    desc: "Demonstrator (PROD): install the container->host firewall rules (idempotent)"
    cmds:
      - cmd: powershell -ExecutionPolicy Bypass -File ./scripts/deploy/demo-prod.ps1 -Action harden
        platforms: [windows]
      - cmd: pwsh -File ./scripts/deploy/demo-prod.ps1 -Action harden
        platforms: [linux, darwin]

  deploy:prod:
    desc: Full deployment to Raspberry Pi (encrypt + prepare + scp + deploy)
    cmds:
      - cmd: powershell -ExecutionPolicy Bypass -File ./scripts/deploy/deploy-prod.ps1
        platforms: [windows]
      - cmd: pwsh -File ./scripts/deploy/deploy-prod.ps1
        platforms: [linux, darwin]

  deploy:prod:dry-run:
    desc: Simulate deployment without executing (dry run)
    cmds:
      - cmd: powershell -ExecutionPolicy Bypass -File ./scripts/deploy/deploy-prod.ps1 -DryRun
        platforms: [windows]
      - cmd: pwsh -File ./scripts/deploy/deploy-prod.ps1 -DryRun
        platforms: [linux, darwin]

  deploy:prepare:
    desc: Prepare PROD folder only (without deployment)
    cmds:
      - cmd: powershell -ExecutionPolicy Bypass -File ./scripts/deploy/prepare-prod.ps1 -Clean
        platforms: [windows]
      - cmd: pwsh -File ./scripts/deploy/prepare-prod.ps1 -Clean
        platforms: [linux, darwin]

  # ============================================================================
  # Security & Quality
  # ============================================================================

  security:scan:
    desc: Run security scans
    deps:
      - security:scan:backend
      - security:scan:docker

  security:scan:backend:
    desc: Scan backend dependencies for vulnerabilities
    dir: "{{.API_DIR}}"
    cmds:
      # --ignore-vuln: ecdsa CVE-2024-23342 is a timing attack on ECDSA *signing* (P-256 nonce leak).
      # LIA uses python-jose only for JWT *verification*, which is explicitly unaffected.
      # The ecdsa maintainer has declared side-channel attacks out of scope with no planned fix.
      # Audits the lockfile (not the manifest) so transitive dependencies are covered too.
      - cmd: python -m pip_audit -r requirements.lock.txt --ignore-vuln CVE-2024-23342
        platforms: [windows]
      - cmd: python3 -m pip_audit -r requirements.lock.txt --ignore-vuln CVE-2024-23342
        platforms: [linux, darwin]

  security:scan:docker:
    desc: Scan Docker images with Trivy (using Docker)
    cmds:
      - cmd: docker run --rm -v //var/run/docker.sock:/var/run/docker.sock aquasec/trivy image --severity HIGH,CRITICAL lia-api:latest
        platforms: [windows]
      - cmd: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy image --severity HIGH,CRITICAL lia-api:latest
        platforms: [linux, darwin]
      - cmd: docker run --rm -v //var/run/docker.sock:/var/run/docker.sock aquasec/trivy image --severity HIGH,CRITICAL lia-web:latest
        platforms: [windows]
      - cmd: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy image --severity HIGH,CRITICAL lia-web:latest
        platforms: [linux, darwin]

  sbom:generate:
    desc: Generate SBOM (Software Bill of Materials) - Requires 'pip install cyclonedx-bom'
    dir: "{{.API_DIR}}"
    cmds:
      # SBOM from the lockfile: exact versions actually shipped, transitives included
      - cmd: pip install cyclonedx-bom && python -m cyclonedx_py requirements requirements.lock.txt --of json -o ../../sbom-backend.json
        platforms: [windows]
      - cmd: pip3 install cyclonedx-bom && python3 -m cyclonedx_py requirements requirements.lock.txt --of json -o ../../sbom-backend.json
        platforms: [linux, darwin]
      - echo "SBOM generated at sbom-backend.json"

  # ============================================================================
  # Logs & Monitoring
  # ============================================================================

  logs:
    desc: Tail logs from all services
    cmds:
      - docker compose -f docker-compose.dev.yml logs -f

  logs:api:
    desc: Tail API logs
    cmds:
      - docker compose -f docker-compose.dev.yml logs -f api

  logs:web:
    desc: Tail web logs
    cmds:
      - docker compose -f docker-compose.dev.yml logs -f web

  logs:db:
    desc: Tail PostgreSQL logs
    cmds:
      - docker compose -f docker-compose.dev.yml logs -f postgres

  logs:redis:
    desc: Tail Redis logs
    cmds:
      - docker compose -f docker-compose.dev.yml logs -f redis

  health:
    desc: Check health of all services (dev stack — API/Web serve HTTPS with self-signed certs)
    cmds:
      - curl -fsk https://localhost:8000/health || echo "API down"
      - curl -fsk https://localhost:8000/ready || echo "API not ready (PostgreSQL or Redis down)"
      - curl -fsk https://localhost:3000/ > /dev/null && echo "Web up" || echo "Web down"
      - curl -fs http://localhost:9090/-/healthy || echo "Prometheus down"
      - curl -f -s http://localhost:3001/api/health || echo "Grafana down"

  # ============================================================================
  # Cleanup
  # ============================================================================

  clean:
    desc: Clean all build artifacts and caches
    deps:
      - clean:backend
      - clean:frontend
      - clean:docker

  clean:backend:
    desc: Clean backend artifacts
    dir: "{{.API_DIR}}"
    cmds:
      - cmd: powershell -Command "Remove-Item -Recurse -Force -ErrorAction SilentlyContinue .venv, __pycache__, .pytest_cache, .mypy_cache, .ruff_cache, htmlcov, .coverage; Get-ChildItem -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue; Get-ChildItem -Recurse -File -Filter *.pyc | Remove-Item -Force -ErrorAction SilentlyContinue"
        platforms: [windows]
      - cmd: rm -rf .venv __pycache__ .pytest_cache .mypy_cache .ruff_cache htmlcov .coverage && find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true && find . -type f -name "*.pyc" -delete 2>/dev/null || true
        platforms: [linux, darwin]

  clean:frontend:
    desc: Clean frontend artifacts
    dir: "{{.WEB_DIR}}"
    cmds:
      - cmd: powershell -Command "Remove-Item -Recurse -Force -ErrorAction SilentlyContinue node_modules, .next, out, coverage"
        platforms: [windows]
      - cmd: rm -rf node_modules .next out coverage
        platforms: [linux, darwin]

  clean:docker:
    desc: Stop containers and prune unused images (preserves data)
    cmds:
      - docker compose -f docker-compose.dev.yml down
      - docker system prune -f

  clean:docker:full:
    desc: "DESTRUCTIVE: Stop containers AND delete all volumes (database, redis...)"
    cmds:
      - echo "WARNING - This will DELETE ALL DATA (PostgreSQL, Redis volumes)"
      - echo "Press Ctrl+C within 5 seconds to cancel..."
      - cmd: "timeout /t 5"
        platforms: [windows]
      - cmd: "sleep 5"
        platforms: [linux, darwin]
      - docker compose -f docker-compose.dev.yml down -v
      - docker system prune -f

  # ============================================================================
  # Documentation
  # ============================================================================

  docs:diagrams:
    desc: Generate architecture diagrams from Mermaid
    vars:
      MMD_FILES:
        sh: find docs/architecture -name "*.mmd" 2>/dev/null || true
    cmds:
      - |
        {{- if .MMD_FILES}}
        {{range $file := splitList "\n" .MMD_FILES}}
        {{- if $file}}
        mmdc -i "{{$file}}" -o "{{trimSuffix ".mmd" $file}}.svg"
        mmdc -i "{{$file}}" -o "{{trimSuffix ".mmd" $file}}.png" -s 4 -w 2400
        {{end}}
        {{- end}}
        {{- else}}
        echo "No .mmd files found in docs/architecture/"
        {{- end}}

  docs:serve:
    desc: Serve documentation locally
    cmds:
      - echo "Open README.md and ARCHITECTURE.md in your browser"

  # ============================================================================
  # Utilities
  # ============================================================================

  claude:repair:
    desc: "Repair Claude session (fix thinking blocks, API errors, etc). Usage: task claude:repair -- SESSION_ID"
    cmds:
      - python ./scripts/utils/repair_session.py {{.CLI_ARGS}}

  claude:repair:backup:
    desc: "Repair Claude session with backup. Usage: task claude:repair:backup -- SESSION_ID"
    cmds:
      - python ./scripts/utils/repair_session.py {{.CLI_ARGS}} --backup

  claude:repair:dry-run:
    desc: "Preview Claude session repair without modifying. Usage: task claude:repair:dry-run -- SESSION_ID"
    cmds:
      - python ./scripts/utils/repair_session.py {{.CLI_ARGS}} --dry-run

  claude:list:
    desc: List all Claude sessions for current project
    cmds:
      - python ./scripts/utils/repair_session.py --list

  claude:list:problems:
    desc: List only Claude sessions with problems (thinking blocks, API errors, etc)
    cmds:
      - python ./scripts/utils/repair_session.py --list --problems

  shell:api:
    desc: Open shell in API container
    cmds:
      - docker compose -f docker-compose.dev.yml exec api /bin/bash

  shell:db:
    desc: Open PostgreSQL shell
    cmds:
      - docker compose -f docker-compose.dev.yml exec postgres psql -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lia}

  shell:redis:
    desc: Open Redis CLI
    cmds:
      - docker compose -f docker-compose.dev.yml exec redis redis-cli

  status:
    desc: Show status of all services
    cmds:
      - docker compose -f docker-compose.dev.yml ps

  # ============================================================================
  # Plan Pattern Learning (Planner optimization via learned patterns)
  # ============================================================================
  # Manages learned planning patterns stored in Redis.
  # Patterns are learned from planner validation outcomes (success/failure).
  # High-confidence patterns are suggested to the planner to reduce replanification.

  patterns:list:
    desc: List all learned planning patterns (sorted by confidence)
    dir: "{{.API_DIR}}"
    cmds:
      - cmd: .venv/Scripts/python scripts/manage_plan_patterns.py list
        platforms: [windows]
      - cmd: .venv/bin/python scripts/manage_plan_patterns.py list
        platforms: [linux, darwin]

  patterns:list:suggerable:
    desc: List only patterns eligible for suggestion (confidence >= 75%)
    dir: "{{.API_DIR}}"
    cmds:
      - cmd: .venv/Scripts/python scripts/manage_plan_patterns.py list --suggerable
        platforms: [windows]
      - cmd: .venv/bin/python scripts/manage_plan_patterns.py list --suggerable
        platforms: [linux, darwin]

  patterns:list:bypassable:
    desc: List patterns that can bypass validation (confidence >= 90%)
    dir: "{{.API_DIR}}"
    cmds:
      - cmd: .venv/Scripts/python scripts/manage_plan_patterns.py list --bypassable
        platforms: [windows]
      - cmd: .venv/bin/python scripts/manage_plan_patterns.py list --bypassable
        platforms: [linux, darwin]

  patterns:stats:
    desc: Show global statistics for plan pattern learning
    dir: "{{.API_DIR}}"
    cmds:
      - cmd: .venv/Scripts/python scripts/manage_plan_patterns.py stats
        platforms: [windows]
      - cmd: .venv/bin/python scripts/manage_plan_patterns.py stats
        platforms: [linux, darwin]

  patterns:show:
    desc: "Show details of a specific pattern. Usage: task patterns:show -- PATTERN_KEY"
    dir: "{{.API_DIR}}"
    cmds:
      - cmd: .venv/Scripts/python scripts/manage_plan_patterns.py show "{{.CLI_ARGS}}"
        platforms: [windows]
      - cmd: .venv/bin/python scripts/manage_plan_patterns.py show "{{.CLI_ARGS}}"
        platforms: [linux, darwin]
    requires:
      vars: [CLI_ARGS]

  patterns:delete:
    desc: "Delete a specific pattern. Usage: task patterns:delete -- PATTERN_KEY"
    dir: "{{.API_DIR}}"
    cmds:
      - cmd: .venv/Scripts/python scripts/manage_plan_patterns.py delete "{{.CLI_ARGS}}" --confirm
        platforms: [windows]
      - cmd: .venv/bin/python scripts/manage_plan_patterns.py delete "{{.CLI_ARGS}}" --confirm
        platforms: [linux, darwin]
    requires:
      vars: [CLI_ARGS]

  patterns:reset:
    desc: Delete ALL patterns (reset learning). Requires confirmation.
    dir: "{{.API_DIR}}"
    cmds:
      - cmd: .venv/Scripts/python scripts/manage_plan_patterns.py reset --confirm
        platforms: [windows]
      - cmd: .venv/bin/python scripts/manage_plan_patterns.py reset --confirm
        platforms: [linux, darwin]

  patterns:export:
    desc: "Export all patterns to JSON file. Usage: task patterns:export -- OUTPUT_FILE"
    dir: "{{.API_DIR}}"
    cmds:
      - cmd: .venv/Scripts/python scripts/manage_plan_patterns.py export -o "{{.CLI_ARGS}}"
        platforms: [windows]
      - cmd: .venv/bin/python scripts/manage_plan_patterns.py export -o "{{.CLI_ARGS}}"
        platforms: [linux, darwin]
    requires:
      vars: [CLI_ARGS]

  patterns:import:
    desc: "Import patterns from JSON file. Usage: task patterns:import -- INPUT_FILE"
    dir: "{{.API_DIR}}"
    cmds:
      - cmd: .venv/Scripts/python scripts/manage_plan_patterns.py import "{{.CLI_ARGS}}" --confirm
        platforms: [windows]
      - cmd: .venv/bin/python scripts/manage_plan_patterns.py import "{{.CLI_ARGS}}" --confirm
        platforms: [linux, darwin]
    requires:
      vars: [CLI_ARGS]

  patterns:seed:
    desc: "Seed a pattern with initial values. Usage: task patterns:seed -- 'PATTERN_KEY --domains d1,d2 --intent mutation'"
    dir: "{{.API_DIR}}"
    cmds:
      - cmd: .venv/Scripts/python scripts/manage_plan_patterns.py seed {{.CLI_ARGS}}
        platforms: [windows]
      - cmd: .venv/bin/python scripts/manage_plan_patterns.py seed {{.CLI_ARGS}}
        platforms: [linux, darwin]
    requires:
      vars: [CLI_ARGS]

  patterns:golden:list:
    desc: List all predefined golden patterns (without seeding)
    dir: "{{.API_DIR}}"
    cmds:
      - cmd: .venv/Scripts/python scripts/manage_plan_patterns.py seed-golden --list
        platforms: [windows]
      - cmd: .venv/bin/python scripts/manage_plan_patterns.py seed-golden --list
        platforms: [linux, darwin]

  patterns:golden:seed:
    desc: Seed golden patterns (preserves existing patterns)
    dir: "{{.API_DIR}}"
    cmds:
      - cmd: .venv/Scripts/python scripts/manage_plan_patterns.py seed-golden --confirm
        platforms: [windows]
      - cmd: .venv/bin/python scripts/manage_plan_patterns.py seed-golden --confirm
        platforms: [linux, darwin]

  patterns:golden:reset:
    desc: Reset to golden patterns (DELETES ALL existing patterns first)
    dir: "{{.API_DIR}}"
    cmds:
      - cmd: .venv/Scripts/python scripts/manage_plan_patterns.py seed-golden --reset --confirm
        platforms: [windows]
      - cmd: .venv/bin/python scripts/manage_plan_patterns.py seed-golden --reset --confirm
        platforms: [linux, darwin]

  patterns:train:
    desc: "Train pattern learner by sending queries to API. Usage: task patterns:train -- -q 'query1' -q 'query2' --repeat 20"
    dir: "{{.API_DIR}}"
    cmds:
      - cmd: .venv/Scripts/python scripts/train_pattern_learner.py --base-url {{.PATTERNS_BASE_URL}} {{.PATTERNS_SSL_FLAG}} {{.CLI_ARGS}}
        platforms: [windows]
      - cmd: .venv/bin/python scripts/train_pattern_learner.py --base-url {{.PATTERNS_BASE_URL}} {{.PATTERNS_SSL_FLAG}} {{.CLI_ARGS}}
        platforms: [linux, darwin]
    requires:
      vars: [CLI_ARGS]

  patterns:train:file:
    desc: "Train pattern learner from a queries file. Usage: task patterns:train:file -- queries.txt [--repeat N]"
    dir: "{{.API_DIR}}"
    cmds:
      - cmd: .venv/Scripts/python scripts/train_pattern_learner.py --base-url {{.PATTERNS_BASE_URL}} {{.PATTERNS_SSL_FLAG}} --file {{.CLI_ARGS}}
        platforms: [windows]
      - cmd: .venv/bin/python scripts/train_pattern_learner.py --base-url {{.PATTERNS_BASE_URL}} {{.PATTERNS_SSL_FLAG}} --file {{.CLI_ARGS}}
        platforms: [linux, darwin]
    requires:
      vars: [CLI_ARGS]

  # --------------------------------------------------------------------------
  # Pattern Training by Domain
  # --------------------------------------------------------------------------
  # SAFE = read-only queries (can be repeated without side effects)
  # UNSAFE = mutations (create, modify, delete, send emails) - use with caution
  #
  # AUTHENTICATION REQUIRED:
  #   1. Open app in browser, login
  #   2. DevTools (F12) > Application > Cookies > copy 'lia_session'
  #   3. Set environment variable:
  #      PowerShell: $env:LIA_SESSION = "your_cookie_value"
  #      CMD:        set LIA_SESSION=your_cookie_value
  #      Linux/Mac:  export LIA_SESSION=your_cookie_value
  # --------------------------------------------------------------------------

  patterns:train:auth:
    desc: "Check authentication setup for pattern training"
    cmds:
      - |
        python -c "
        import os
        s = os.environ.get('LIA_SESSION', '')
        if s:
            print(f'[OK] LIA_SESSION is set (first 20 chars: {s[:20]}...)')
        else:
            print('[ERROR] LIA_SESSION not set!')
            print()
            print('How to set it:')
            print('  1. Open app in browser and login')
            print('  2. DevTools F12 > Application > Cookies')
            print('  3. Copy lia_session cookie value')
            print('  4. Run:')
            print('       PowerShell: $env:LIA_SESSION = \"value\"')
            print('       CMD:        set LIA_SESSION=value')
            print('       Linux/Mac:  export LIA_SESSION=value')
        "
    silent: true

  patterns:train:all:
    desc: "Train ALL domains (SAFE queries only). Usage: task patterns:train:all [-- --repeat N]"
    dir: "{{.API_DIR}}"
    vars:
      REPEAT: '{{.CLI_ARGS | default "--repeat 20"}}'
    cmds:
      - task: patterns:train:contacts
        vars: { CLI_ARGS: "{{.REPEAT}}" }
      - task: patterns:train:emails
        vars: { CLI_ARGS: "{{.REPEAT}}" }
      - task: patterns:train:calendar
        vars: { CLI_ARGS: "{{.REPEAT}}" }
      - task: patterns:train:tasks
        vars: { CLI_ARGS: "{{.REPEAT}}" }
      - task: patterns:train:drive
        vars: { CLI_ARGS: "{{.REPEAT}}" }
      - task: patterns:train:places
        vars: { CLI_ARGS: "{{.REPEAT}}" }
      - task: patterns:train:routes
        vars: { CLI_ARGS: "{{.REPEAT}}" }
      - task: patterns:train:weather
        vars: { CLI_ARGS: "{{.REPEAT}}" }
      - task: patterns:train:perplexity
        vars: { CLI_ARGS: "{{.REPEAT}}" }
      - task: patterns:train:wikipedia
        vars: { CLI_ARGS: "{{.REPEAT}}" }
      - task: patterns:train:multi
        vars: { CLI_ARGS: "{{.REPEAT}}" }

  patterns:train:all:unsafe:
    desc: "⚠️  Train ALL domains INCLUDING mutations. WARNING: Creates/modifies/deletes real data!"
    dir: "{{.API_DIR}}"
    vars:
      REPEAT: '{{.CLI_ARGS | default "--repeat 1"}}'
    cmds:
      - echo "⚠️  WARNING - This will execute MUTATION queries (create, modify, delete, send emails)"
      - echo "⚠️  Press Ctrl+C to cancel within 5 seconds..."
      - cmd: timeout /t 5
        platforms: [windows]
      - cmd: sleep 5
        platforms: [linux, darwin]
      - task: patterns:train:contacts:unsafe
        vars: { CLI_ARGS: "{{.REPEAT}}" }
      - task: patterns:train:calendar:unsafe
        vars: { CLI_ARGS: "{{.REPEAT}}" }
      - task: patterns:train:tasks:unsafe
        vars: { CLI_ARGS: "{{.REPEAT}}" }
      - task: patterns:train:multi:unsafe
        vars: { CLI_ARGS: "{{.REPEAT}}" }

  patterns:train:mono:
    desc: "Train all mono-domain patterns (SAFE only). Usage: task patterns:train:mono [-- --repeat N]"
    dir: "{{.API_DIR}}"
    vars:
      REPEAT: '{{.CLI_ARGS | default "--repeat 20"}}'
    cmds:
      - task: patterns:train:contacts
        vars: { CLI_ARGS: "{{.REPEAT}}" }
      - task: patterns:train:emails
        vars: { CLI_ARGS: "{{.REPEAT}}" }
      - task: patterns:train:calendar
        vars: { CLI_ARGS: "{{.REPEAT}}" }
      - task: patterns:train:tasks
        vars: { CLI_ARGS: "{{.REPEAT}}" }
      - task: patterns:train:drive
        vars: { CLI_ARGS: "{{.REPEAT}}" }
      - task: patterns:train:places
        vars: { CLI_ARGS: "{{.REPEAT}}" }
      - task: patterns:train:routes
        vars: { CLI_ARGS: "{{.REPEAT}}" }
      - task: patterns:train:weather
        vars: { CLI_ARGS: "{{.REPEAT}}" }
      - task: patterns:train:perplexity
        vars: { CLI_ARGS: "{{.REPEAT}}" }
      - task: patterns:train:wikipedia
        vars: { CLI_ARGS: "{{.REPEAT}}" }

  patterns:train:contacts:
    desc: "Train contacts domain (SAFE queries). Usage: task patterns:train:contacts [-- --repeat N]"
    dir: "{{.API_DIR}}"
    vars:
      REPEAT: '{{.CLI_ARGS | default "--repeat 20"}}'
    cmds:
