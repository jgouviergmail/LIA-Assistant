    dir: "{{.API_DIR}}"
    vars:
      REPEAT: '{{.CLI_ARGS | default "--repeat 20"}}'
    cmds:
      - cmd: .venv/Scripts/python scripts/train_pattern_learner.py --base-url {{.PATTERNS_BASE_URL}} {{.PATTERNS_SSL_FLAG}} --file scripts/training/calendar_safe.txt {{.REPEAT}}
        platforms: [windows]
      - cmd: .venv/bin/python scripts/train_pattern_learner.py --base-url {{.PATTERNS_BASE_URL}} {{.PATTERNS_SSL_FLAG}} --file scripts/training/calendar_safe.txt {{.REPEAT}}
        platforms: [linux, darwin]

  patterns:train:calendar:unsafe:
    desc: "⚠️  Train calendar MUTATIONS. WARNING: Creates/modifies/deletes events!"
    dir: "{{.API_DIR}}"
    vars:
      REPEAT: '{{.CLI_ARGS | default "--repeat 1"}}'
    cmds:
      - cmd: .venv/Scripts/python scripts/train_pattern_learner.py --base-url {{.PATTERNS_BASE_URL}} {{.PATTERNS_SSL_FLAG}} --file scripts/training/calendar_unsafe.txt {{.REPEAT}}
        platforms: [windows]
      - cmd: .venv/bin/python scripts/train_pattern_learner.py --base-url {{.PATTERNS_BASE_URL}} {{.PATTERNS_SSL_FLAG}} --file scripts/training/calendar_unsafe.txt {{.REPEAT}}
        platforms: [linux, darwin]

  patterns:train:tasks:
    desc: "Train tasks domain (SAFE queries). Usage: task patterns:train:tasks [-- --repeat N]"
    dir: "{{.API_DIR}}"
    vars:
      REPEAT: '{{.CLI_ARGS | default "--repeat 20"}}'
    cmds:
      - cmd: .venv/Scripts/python scripts/train_pattern_learner.py --base-url {{.PATTERNS_BASE_URL}} {{.PATTERNS_SSL_FLAG}} --file scripts/training/tasks_safe.txt {{.REPEAT}}
        platforms: [windows]
      - cmd: .venv/bin/python scripts/train_pattern_learner.py --base-url {{.PATTERNS_BASE_URL}} {{.PATTERNS_SSL_FLAG}} --file scripts/training/tasks_safe.txt {{.REPEAT}}
        platforms: [linux, darwin]

  patterns:train:tasks:unsafe:
    desc: "⚠️  Train tasks MUTATIONS. WARNING: Creates/modifies tasks!"
    dir: "{{.API_DIR}}"
    vars:
