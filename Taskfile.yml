  patterns:train:contacts:unsafe:
    desc: "⚠️  Train contacts MUTATIONS. WARNING: Creates/modifies/deletes contacts!"
    dir: "{{.API_DIR}}"
    vars:
      REPEAT: '{{.CLI_ARGS | default "--repeat 1"}}'
    cmds:
      - cmd: .venv/Scripts/python scripts/train_pattern_learner.py --base-url {{.PATTERNS_BASE_URL}} {{.PATTERNS_SSL_FLAG}} --file scripts/training/contacts_unsafe.txt {{.REPEAT}}
        platforms: [windows]
      - cmd: .venv/bin/python scripts/train_pattern_learner.py --base-url {{.PATTERNS_BASE_URL}} {{.PATTERNS_SSL_FLAG}} --file scripts/training/contacts_unsafe.txt {{.REPEAT}}
        platforms: [linux, darwin]

  patterns:train:emails:
    desc: "Train emails domain (SAFE queries). Usage: task patterns:train:emails [-- --repeat N]"
    dir: "{{.API_DIR}}"
    vars:
      REPEAT: '{{.CLI_ARGS | default "--repeat 20"}}'
    cmds:
      - cmd: .venv/Scripts/python scripts/train_pattern_learner.py --base-url {{.PATTERNS_BASE_URL}} {{.PATTERNS_SSL_FLAG}} --file scripts/training/emails_safe.txt {{.REPEAT}}
        platforms: [windows]
      - cmd: .venv/bin/python scripts/train_pattern_learner.py --base-url {{.PATTERNS_BASE_URL}} {{.PATTERNS_SSL_FLAG}} --file scripts/training/emails_safe.txt {{.REPEAT}}
