# =============================================================================
# LIA - Docker Compose Development
# =============================================================================
#
# SANDBOX ALIGNMENT:
#   The postgres and redis services inherit from compose.services.yml
#   to ensure the same image versions as .devcontainer/sandbox
#
# =============================================================================

services:
  # PostgreSQL with pgvector - INHERITED FROM compose.services.yml
  postgres:
    extends:
      file: infrastructure/docker/compose.services.yml
      service: postgres-base
    container_name: lia-postgres-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DEV_BIND_HOST:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
    networks:
      - lia-network

  # pgAdmin for PostgreSQL administration
  pgadmin:
    image: dpage/pgadmin4:9.9
    container_name: lia-pgadmin-dev
    security_opt:
      - no-new-privileges:true
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      PGADMIN_CONFIG_ALLOW_SPECIAL_EMAIL_DOMAINS: "['local']"
    ports:
      - "${DEV_BIND_HOST:-127.0.0.1}:${PGADMIN_HOST_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./infrastructure/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lia-network

  # PostgreSQL scheduled backups (ADR-109) — same sidecar as production
  # Named volume here (not a bind mount like prod): the image's rotation uses
  # hardlinks/symlinks, which are unreliable on Windows bind mounts. The
  # verification script reads dumps via `docker cp`, so storage type is opaque.
  # Runbook: docs/runbooks/DATABASE_BACKUP_RESTORE.md
  postgres-backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    container_name: lia-postgres-backup-dev
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "${POSTGRES_BACKUP_SCHEDULE:-@daily}"
      BACKUP_KEEP_DAYS: "${POSTGRES_BACKUP_KEEP_DAYS:-7}"
      BACKUP_KEEP_WEEKS: "${POSTGRES_BACKUP_KEEP_WEEKS:-4}"
      BACKUP_KEEP_MONTHS: "${POSTGRES_BACKUP_KEEP_MONTHS:-6}"
      POSTGRES_EXTRA_OPTS: "${POSTGRES_BACKUP_EXTRA_OPTS:--Z6 --clean --if-exists}"
      TZ: "${POSTGRES_BACKUP_TZ:-Etc/UTC}"
    volumes:
      - postgres_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lia-network

  # Redis for caching and sessions - INHERITED FROM compose.services.yml
  redis:
    extends:
      file: infrastructure/docker/compose.services.yml
      service: redis-base
    container_name: lia-redis-dev
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}"
    ports:
      - "${DEV_BIND_HOST:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - lia-network

  # SSL Certificate Generator (runs once to create shared certs)
  # SSL_DOMAIN is read from .env (e.g., 192.168.1.100.nip.io for LAN access)
  ssl-init:
    image: alpine:latest
    container_name: lia-ssl-init
    environment:
      - SSL_DOMAIN=${SSL_DOMAIN:-localhost}
    volumes:
      - ssl_certs:/certs
      - ./infrastructure/ssl/generate-certs.sh:/generate-certs.sh:ro
    command: sh /generate-certs.sh
    networks:
      - lia-network

  # Backend API
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    # Explicit and DISTINCT from the production tag. Without it Compose names
    # the built image after the project + service — `lia-api:latest` — which is
    # exactly what `task build:api` (Taskfile.yml) tags the PRODUCTION build
    # with. Any local prod build then silently replaced the dev image, and the
    # next `up` without `--build` reused it: the container started with the dev
    # COMMAND (`python -m debugpy …`) inside a prod image that has no dev
    # dependencies, and died on `No module named debugpy`.
    # Twice now — 2026-07-24 (web) and 2026-08-03 (web AND api).
    image: lia-api-dev:latest
    container_name: lia-api-dev
    # The import corruption documented on the `command` below is NOT
    # deterministic: measured 2026-08-23 evening, three consecutive cold starts
    # died with SIGSEGV and the fourth came up. Without a policy the container
    # simply stays down, and the only symptom is a frontend failing every fetch
    # -- `/auth/features` returning nothing takes the Google button and the
    # passkeys off the sign-in screen, which reads like a feature bug.
    restart: unless-stopped
    # ADR-117: parity with prod — lifespan shutdown drains in-flight chat
    # runs + background tasks before exit (see docker-compose.prod.yml).
    stop_grace_period: 90s
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      # Only overrides - rest comes from .env via env_file
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      - LANGFUSE_DEBUG=true
      # Trust X-Forwarded-Proto from reverse proxies
      - FORWARDED_ALLOW_IPS=*
      # SEC-001: the skill-script sandbox reuses THIS service's image. The dev
      # image is built by compose (no explicit tag) and installs its
      # dependencies system-wide, so no PYTHONPATH override applies here —
      # unlike the prod image, which uses `pip install --user`.
      - SKILLS_SCRIPT_SANDBOX_IMAGE=lia-api
      - SKILLS_SCRIPT_SANDBOX_PYTHONPATH=
      # Bytecode stays INSIDE the container. `/app` is a bind mount shared with
      # the host, whose own Python (pytest, mypy) writes `__pycache__` there too;
      # a cache written by one interpreter and read by the other produced
      # nonsensical import failures (`UnboundLocalError: cls` inside
      # typing_extensions, `Config has no attribute 'list'` inside pydantic)
      # until the API could not boot — measured 2026-09-03: the same import
      # succeeded with the mount-side caches ignored, and every file read
      # through the mount matched the host byte for byte.
      - PYTHONPYCACHEPREFIX=/tmp/pycache
    ports:
      - "${DEV_BIND_HOST_APP:-${DEV_BIND_HOST:-127.0.0.1}}:${API_HOST_PORT:-8000}:8000"
      - "${DEV_BIND_HOST:-127.0.0.1}:${DEBUG_HOST_PORT:-5678}:5678"  # Debug port
      - "${DEV_BIND_HOST:-127.0.0.1}:${API_METRICS_HOST_PORT:-9091}:9091"  # Prometheus metrics (HTTP-only, no TLS)
    volumes:
      - ./apps/api:/app
      - api_venv:/app/.venv
      - ./.git:/app/.git:ro  # Mount .git for prompt versioning (read-only)
      - ./docs/knowledge:/app/docs/knowledge:ro  # System RAG knowledge files
      - ./docs/runbooks:/app/docs/runbooks:ro  # Self-diagnostics runbook grounding (spec 2026-08-27)
      # Reference content for a fresh install. Mounted in dev for PARITY: the
      # seed gate was dead code precisely because nothing exercised it locally,
      # the same asymmetry that hid the missing gettext catalogues in prod.
      # Inert unless APPLY_SEEDS=true (the seed files delete before inserting).
      - ./infrastructure/database/seeds:/app/infrastructure/database/seeds:ro
      - ssl_certs:/certs:ro  # Shared SSL certificates (kept for future use)
      # Persistent storage for file attachments (images, PDF)
      - attachments_data:/app/data/attachments
      # Meeting recordings (segments while recording, normalized audio; ADR-258)
      - meetings_data:/app/data/meetings
      # Skills directories (full bind-mount for dev — both system and user skills editable)
      - ./data/skills:/app/data/skills
      # DevOps Claude CLI: Docker socket for container management + auth + workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.claude:/root/.claude
      - ./infrastructure/claude-cli/CLAUDE.server.md:/opt/claude-workspace/CLAUDE.md:ro
      # Note: STT model is baked into Docker image (Dockerfile.dev multi-stage build)
    # HTTPS required for Google OAuth callbacks
    # Next.js proxy uses NODE_TLS_REJECT_UNAUTHORIZED=0 for self-signed certs
    # --reload-dir src: watch ONLY the app source. The whole ./apps/api tree is
    # bind-mounted (tests/, htmlcov/, .pytest_cache/), so without this a test run
    # or coverage write triggers a reload storm — and the reloader can wedge in
    # restart()->join() waiting on a slow worker shutdown (2026-07 incident).
    # -Xfrozen_modules=off is NOT optional here, it is the flag debugpy prints a
    # warning about on every boot. pydevd patches the import machinery, and on
    # Python 3.14 that collides with the frozen importlib modules: the container
    # then dies at import with a DIFFERENT error each time — SIGSEGV,
    # "cannot use 'dict' as a dict key", "'_List' object is not callable",
    # "'AdaptersMap' has no attribute 'oid'", "can only concatenate tuple (not
    # \"int\") to tuple" — all of them inside third-party or importlib frames, none
    # of them in application code (`python -c "import src.main"` in the same
    # image and mounts succeeds every time).
    # Measured 2026-08-23 morning, same command, 4 cold starts each way:
    # without the flag 2 boots / 2 crashes, with it 4 boots / 0 crashes. The
    # SAME evening it crashed 3 times out of 3 WITH the flag, so the flag is a
    # mitigation and not a cure -- hence `restart: unless-stopped` above, and
    # hence debugpy is now OFF by default: an attachable debugger nobody
    # attaches to is not worth a launcher that dies at import.
    #   To attach one: set DEV_API_DEBUGPY in .env, then `docker compose up -d api`
    #   DEV_API_DEBUGPY=-m debugpy --listen 0.0.0.0:5678
    # (port 5678 is already published below; expect the import instability back)
    #
    # --reload-exclude on the bytecode caches: `--reload-dir src` watches a
    # bind-mounted tree that the HOST also writes to, and a host-side pytest run
    # regenerates .pyc by the hundred (observed: `122 changes detected`, all
    # __pycache__). The reloader then restarts the worker in the middle of an
    # import, which is the other way this container reaches SIGSEGV.
    command: python -Xfrozen_modules=off ${DEV_API_DEBUGPY:-} -m uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir src --reload-exclude=*.pyc --reload-exclude=*/__pycache__/* --ssl-keyfile=/certs/key.pem --ssl-certfile=/certs/cert.pem
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ssl-init:
        condition: service_completed_successfully
    healthcheck:
      # Liveness probe on purpose (/health is 200 even if PG/Redis are down):
      # restarting the API cannot fix a dependency outage. Readiness = /ready.
      test: ["CMD", "curl", "-f", "-k", "https://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # start_period covers the real boot path: alembic migrations in the
      # entrypoint, then the app imported twice by uvicorn --reload (watcher
      # + worker) — ~45s measured. Whisper STT loads lazily on first voice
      # use, not at boot.
      start_period: 60s
    networks:
      - lia-network

  # Frontend Web
  web:
    build:
      context: .  # Build from monorepo root (changed from ./apps/web)
      dockerfile: apps/web/Dockerfile.dev  # Path to Dockerfile relative to context
    # Same collision, same fix (see the api service above): `task build:web`
    # tags the production image `lia-web:latest`, which is the name Compose
    # would give this one by default. The symptom was
    # `Cannot find module '/monorepo/apps/web/.next/standalone/pnpm'` — the dev
    # COMMAND run against the prod image's standalone WORKDIR.
    image: lia-web-dev:latest
    container_name: lia-web-dev
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      # Bind Next.js to all interfaces (required for Docker)
      - HOSTNAME=0.0.0.0
      # API_URL_SERVER uses Docker service name for container-to-container communication
      # HTTPS required for Google OAuth callback
      # NODE_TLS_REJECT_UNAUTHORIZED=0 handles self-signed certs (set in next.config.ts)
      - API_URL_SERVER=https://api:8000
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      # Fast Refresh only works here in POLLING mode. The source tree reaches
      # this container through a 9p/drvfs bind-mount, and that transport does
      # not forward the host's filesystem events: measured 2026-08-23, an edit
      # made on the host produced ZERO fs.watch events in the container while
      # the file content was already updated — the exact trap documented for
      # this container (edit invisible to Next, source correct on disk). The
      # backend never had the problem because watchfiles auto-enables polling
      # on a `microsoft-standard-WSL2` kernel; watchpack (bundled in Next)
      # does not, but it reads this variable.
      #
      # 5000 ms, and the value is NOT arbitrary. Polling stats the whole
      # watched tree over a transport where one stat costs ~3 ms, and a short
      # interval keeps webpack's graph permanently invalidated: measured on
      # three consecutive requests to an ALREADY COMPILED /dashboard, with
      # nothing edited in between —
      #     polling off   : 19.3 s, then 211 ms, 168 ms
      #     polling 1000  : 44.5 s, then 3406 ms, 1958 ms
      #     polling 5000  :  5.6 s, then 313 ms, 200 ms
      # At 1000 ms every page view paid a rebuild, which is exactly the
      # "compiling on every page" symptom this whole change set set out to
      # remove. At 5000 ms navigation is back to 162-605 ms and Fast Refresh
      # still lands in 12.4 s (4.8-14 s at 1000 ms). Lower this only from a
      # fresh measurement of BOTH numbers, never from the reload latency
      # alone. `false` disables polling: navigation is at its fastest and
      # nothing reloads at all on a Windows/macOS host.
      - WATCHPACK_POLLING=${WEB_WATCH_POLL_MS:-5000}
      # Other NEXT_PUBLIC_* variables are read from .env
    ports:
      - "${DEV_BIND_HOST_APP:-${DEV_BIND_HOST:-127.0.0.1}}:${WEB_HOST_PORT:-3000}:3000"
    volumes:
      # Mount the entire web app directory for hot-reload
      - ./apps/web:/monorepo/apps/web
      # Use named volumes for node_modules and .next to avoid conflicts with host
      - web_node_modules:/monorepo/apps/web/node_modules
      - web_next_build:/monorepo/apps/web/.next
      # Shared SSL certificates from ssl-init (covers configured SSL_DOMAIN)
      - ssl_certs:/certs:ro
    # Enable HTTPS with ssl-init certificates (covers nip.io domain for LAN access)
    command: ["pnpm", "run", "dev", "--experimental-https", "--experimental-https-key", "/certs/key.pem", "--experimental-https-cert", "/certs/cert.pem"]
    depends_on:
      api:
        condition: service_started
      ssl-init:
        condition: service_completed_successfully
    networks:
      - lia-network

  # Prometheus
  # Entrypoint wrapper (ADR-119): renders the blackbox public-probe file_sd
  # target from BLACKBOX_PUBLIC_PROBE_URL at startup. Leave the variable unset
  # in development — zero probe targets, PublicEndpointDown stays silent.
  prometheus:
    image: prom/prometheus:v3.0.0
    container_name: lia-prometheus-dev
    security_opt:
      - no-new-privileges:true
    environment:
      BLACKBOX_PUBLIC_PROBE_URL: ${BLACKBOX_PUBLIC_PROBE_URL:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -n "$$BLACKBOX_PUBLIC_PROBE_URL" ]; then
          printf -- "- targets:\n  - '%s'\n" "$$BLACKBOX_PUBLIC_PROBE_URL" > /etc/prometheus/file_sd/public_probe.yml
        else
          echo "[]" > /etc/prometheus/file_sd/public_probe.yml
        fi
        exec /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time=15d \
          --storage.tsdb.retention.size=10GB \
          --web.console.libraries=/usr/share/prometheus/console_libraries \
          --web.console.templates=/usr/share/prometheus/consoles \
          --web.enable-remote-write-receiver
    tmpfs:
      - /etc/prometheus/file_sd:mode=0777,size=1m
    ports:
      - "${DEV_BIND_HOST:-127.0.0.1}:${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./infrastructure/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./infrastructure/observability/prometheus/alerts-core.yml:/etc/prometheus/alerts-core.yml
      - ./infrastructure/observability/prometheus/recording_rules.yml:/etc/prometheus/recording_rules.yml
      - prometheus_data:/prometheus
    depends_on:
      - alertmanager
    networks:
      - lia-network

  # Alertmanager (Prometheus Alert Notifications)
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: lia-alertmanager-dev
    security_opt:
      - no-new-privileges:true
    # Run BY the shell, never executed: this script arrives through a bind
    # mount, so its mode is the HOST's — a bit that has to survive a Windows
    # checkout (NTFS has none) and then rsync/scp. It did not, on 2026-08-31:
    # production refused the container with `permission denied` although the
    # file is 100755 in git. `sh <script>` needs only read permission.
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.external-url=http://localhost:${ALERTMANAGER_HOST_PORT:-9094}'
    ports:
      - "${DEV_BIND_HOST:-127.0.0.1}:${ALERTMANAGER_HOST_PORT:-9094}:9093"
    volumes:
      - ./infrastructure/observability/alertmanager/docker-entrypoint.sh:/docker-entrypoint.sh:ro
      - ./infrastructure/observability/alertmanager/alertmanager.yml.template:/etc/alertmanager/alertmanager.yml.template:ro
      - ./infrastructure/observability/alertmanager/alertmanager-email-only.yml.template:/etc/alertmanager/alertmanager-email-only.yml.template:ro
      - ./infrastructure/observability/alertmanager/lia-webhook-route.fragment:/etc/alertmanager/lia-webhook-route.fragment:ro
      - ./infrastructure/observability/alertmanager/lia-webhook-receiver.fragment:/etc/alertmanager/lia-webhook-receiver.fragment:ro
      - ./infrastructure/observability/alertmanager/templates:/etc/alertmanager/templates:ro
      - alertmanager_data:/alertmanager
    env_file:
      - .env
    environment:
      # LIA self-diagnostics webhook (spec 2026-08-27). The DEV API serves
      # HTTPS with a self-signed certificate — the receiver fragment carries
      # insecure_skip_verify for exactly this case.
      ALERTMANAGER_LIA_WEBHOOK_URL: ${ALERTMANAGER_LIA_WEBHOOK_URL:-}
      ALERTMANAGER_LIA_WEBHOOK_SECRET: ${DIAGNOSTICS_WEBHOOK_SECRET:-}
    networks:
      - lia-network

  # blackbox-exporter (ADR-119) — HTTP probes for BackupFailed and, when
  # BLACKBOX_PUBLIC_PROBE_URL is set, the public endpoint probe.
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: lia-blackbox-exporter-dev
    security_opt:
      - no-new-privileges:true
    command:
      - '--config.file=/etc/blackbox/blackbox.yml'
    volumes:
      - ./infrastructure/observability/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks:
      - lia-network

  # Grafana
  grafana:
    image: grafana/grafana:11.3.0
    container_name: lia-grafana-dev
    security_opt:
      - no-new-privileges:true
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=http://localhost:${GRAFANA_HOST_PORT:-3001}
      - GF_INSTALL_PLUGINS=grafana-clock-panel
      # Product read-only datasource (ADR-178) — interpolated by the
      # datasource provisioning YAML (postgres-product-readonly).
      - GRAFANA_PRODUCT_DB_PASSWORD=${GRAFANA_PRODUCT_DB_PASSWORD:-}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${DEV_BIND_HOST:-127.0.0.1}:${GRAFANA_HOST_PORT:-3001}:3000"
    volumes:
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning
      - ./infrastructure/observability/grafana/dashboards:/var/lib/grafana/dashboards
      - ./infrastructure/observability/grafana/grafana.ini:/etc/grafana/grafana.ini
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    networks:
      - lia-network

  # Loki (Logs)
  loki:
    image: grafana/loki:3.2.1
    container_name: lia-loki-dev
    security_opt:
      - no-new-privileges:true
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "${DEV_BIND_HOST:-127.0.0.1}:${LOKI_HOST_PORT:-3100}:3100"
    volumes:
      - ./infrastructure/observability/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    networks:
      - lia-network

  # Promtail (Log Collection Agent)
  promtail:
    image: grafana/promtail:3.2.1
    container_name: lia-promtail-dev
    security_opt:
      - no-new-privileges:true
    command: -config.file=/etc/promtail/promtail-config.yml
    ports:
      - "${DEV_BIND_HOST:-127.0.0.1}:${PROMTAIL_HOST_PORT:-9080}:9080"  # Promtail metrics endpoint
    volumes:
      - ./infrastructure/observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro  # Docker socket (read-only)
      - promtail_positions:/tmp  # Position tracking (survive restarts)
    depends_on:
      - loki
    networks:
      - lia-network
    restart: unless-stopped

  # Tempo (Traces)
  tempo:
    image: grafana/tempo:2.6.1
    container_name: lia-tempo-dev
    security_opt:
      - no-new-privileges:true
    command: [ "-config.file=/etc/tempo/tempo.yml" ]
    ports:
      - "${DEV_BIND_HOST:-127.0.0.1}:${TEMPO_HOST_PORT:-3200}:3200"   # Tempo HTTP
      - "${DEV_BIND_HOST:-127.0.0.1}:${OTLP_GRPC_HOST_PORT:-4317}:4317"   # OTLP gRPC
      - "${DEV_BIND_HOST:-127.0.0.1}:${OTLP_HTTP_HOST_PORT:-4318}:4318"   # OTLP HTTP
    volumes:
      - ./infrastructure/observability/tempo/tempo.yml:/etc/tempo/tempo.yml
      - tempo_data:/var/tempo
    networks:
      - lia-network

  # cAdvisor - Container metrics
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: lia-cadvisor-dev
    privileged: true
    ports:
      - "${DEV_BIND_HOST:-127.0.0.1}:${CADVISOR_HOST_PORT:-8080}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    networks:
      - lia-network

  # PostgreSQL Exporter - Database metrics
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: lia-postgres-exporter-dev
    security_opt:
      - no-new-privileges:true
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    ports:
      - "${DEV_BIND_HOST:-127.0.0.1}:${PG_EXPORTER_HOST_PORT:-9187}:9187"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lia-network

  # Redis Exporter - Cache metrics
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: lia-redis-exporter-dev
    security_opt:
      - no-new-privileges:true
    environment:
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
    ports:
      - "${DEV_BIND_HOST:-127.0.0.1}:${REDIS_EXPORTER_HOST_PORT:-9121}:9121"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - lia-network

  # Node Exporter - Host/system metrics (disk, filesystem, network)
  # Note: On Windows/Docker Desktop, bind mount requires different configuration
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: lia-node-exporter-dev
    security_opt:
      - no-new-privileges:true
    command:
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--no-collector.hwmon'  # Disable hwmon on Windows
    ports:
      - "${DEV_BIND_HOST:-127.0.0.1}:${NODE_EXPORTER_HOST_PORT:-9100}:9100"
    volumes:
      - /:/host:ro
    networks:
      - lia-network
    restart: unless-stopped

  # === Langfuse Self-Hosted v3 - LLM Observability ===

  # MinIO - S3-compatible object storage for Langfuse
  minio:
    image: minio/minio:latest
    container_name: lia-minio-dev
    profiles: ["langfuse"]  # Opt-in only: started via `docker compose --profile langfuse up` (see task dev:langfuse)
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${DEV_BIND_HOST:-127.0.0.1}:${MINIO_API_HOST_PORT:-9092}:9000"  # MinIO API
      - "${DEV_BIND_HOST:-127.0.0.1}:${MINIO_CONSOLE_HOST_PORT:-9093}:9001"  # MinIO Console
    volumes:
      - minio_data:/data
    networks:
      - lia-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Langfuse PostgreSQL Database
  langfuse-db:
    image: postgres:17
    container_name: lia-langfuse-db-dev
    profiles: ["langfuse"]  # Opt-in only (see task dev:langfuse)
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${LANGFUSE_DB_USER}
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD}
      POSTGRES_DB: langfuse
      TZ: UTC
      PGTZ: UTC
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    networks:
      - lia-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LANGFUSE_DB_USER}"]
      interval: 3s
      timeout: 3s
      retries: 10

  # ClickHouse (OLAP database)
  langfuse-clickhouse:
    image: clickhouse/clickhouse-server
    container_name: lia-langfuse-clickhouse-dev
    profiles: ["langfuse"]  # Opt-in only (see task dev:langfuse)
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
      # Tame idle CPU: short TTL on internal system log tables + query profiler OFF.
      # Prevents trace_log/asynchronous_metric_log from growing unbounded and pinning a core.
      - ./infrastructure/observability/clickhouse/config.d/lia-system-logs.xml:/etc/clickhouse-server/config.d/lia-system-logs.xml:ro
      - ./infrastructure/observability/clickhouse/users.d/lia-profiler-off.xml:/etc/clickhouse-server/users.d/lia-profiler-off.xml:ro
    networks:
      - lia-network
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

  # Redis (cache and queues)
  langfuse-redis:
    image: redis:7
    container_name: lia-langfuse-redis-dev
    profiles: ["langfuse"]  # Opt-in only (see task dev:langfuse)
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: --requirepass "${LANGFUSE_REDIS_PASSWORD}"
    networks:
      - lia-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${LANGFUSE_REDIS_PASSWORD}", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10

  # Langfuse Web Application (v3)
  langfuse-web:
    image: langfuse/langfuse:latest  # v3.22.0+ required for OTLP support
    container_name: lia-langfuse-web-dev
    profiles: ["langfuse"]  # Opt-in only (see task dev:langfuse)
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      langfuse-db:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${DEV_BIND_HOST:-127.0.0.1}:${LANGFUSE_HOST_PORT:-3002}:3000"
    environment:
      # Next.js Server Binding (CRITICAL for Docker healthcheck)
      # Binds Next.js server to all network interfaces (0.0.0.0) instead of localhost only
      # This allows healthcheck from inside container to work correctly
      # Reference: https://github.com/vercel/next.js/discussions/16995
      HOSTNAME: "0.0.0.0"

      # NextAuth
      NEXTAUTH_URL: http://localhost:${LANGFUSE_HOST_PORT:-3002}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET}

      # PostgreSQL
      DATABASE_URL: "postgresql://${LANGFUSE_DB_USER}:${LANGFUSE_DB_PASSWORD}@langfuse-db:5432/langfuse"

      # Encryption
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}

      # ClickHouse (standalone mode)
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"

      # Redis
      REDIS_HOST: langfuse-redis
      REDIS_PORT: 6379
      REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD}

      # Telemetry
      TELEMETRY_ENABLED: "false"

      # Experimental features (OTLP support requires this in v3.22.0+)
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "true"

      # Initial user and project setup (dev only)
      LANGFUSE_INIT_USER_EMAIL: admin@lia.local
      LANGFUSE_INIT_USER_NAME: Admin
      LANGFUSE_INIT_USER_PASSWORD: admin123
      LANGFUSE_INIT_ORG_NAME: LIA
      LANGFUSE_INIT_PROJECT_NAME: Development

      # S3 Event Upload
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/

      # S3 Media Upload
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/

      # S3 Batch Export
      LANGFUSE_S3_BATCH_EXPORT_ENABLED: "false"
      LANGFUSE_S3_BATCH_EXPORT_BUCKET: langfuse
      LANGFUSE_S3_BATCH_EXPORT_PREFIX: exports/
      LANGFUSE_S3_BATCH_EXPORT_REGION: auto
      LANGFUSE_S3_BATCH_EXPORT_ENDPOINT: http://minio:9000
      LANGFUSE_S3_BATCH_EXPORT_EXTERNAL_ENDPOINT: http://localhost:${MINIO_API_HOST_PORT:-9092}
      LANGFUSE_S3_BATCH_EXPORT_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      LANGFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_BATCH_EXPORT_FORCE_PATH_STYLE: "true"
    networks:
      - lia-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://0.0.0.0:3000/api/public/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ============================================================================
  # Langfuse Worker (v3) - Async Trace Ingestion Processor
  # ============================================================================
  #
  # Architecture:
  #   Redis Queue → Worker → ClickHouse + MinIO (S3)
  #   Processes trace batches asynchronously to prevent API timeouts
  #
  # Scaling (Production):
  #   - Horizontal: Add workers based on CPU (target 50-70%)
  #   - Vertical: 2 CPUs + 4GB RAM minimum per worker
  #   - Concurrency: Adjust LANGFUSE_*_CONCURRENCY per worker
  #
  # References:
  #   - https://langfuse.com/self-hosting/scaling
  #   - https://langfuse.com/self-hosting/infrastructure/containers
  #
  # ============================================================================
  langfuse-worker:
    image: docker.io/langfuse/langfuse-worker:3
    container_name: lia-langfuse-worker-dev
    profiles: ["langfuse"]  # Opt-in only (see task dev:langfuse)
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      langfuse-db:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${DEV_BIND_HOST:-127.0.0.1}:${LANGFUSE_WORKER_HOST_PORT:-3030}:3030"  # Health check and metrics endpoint
    environment:
      # Node.js memory configuration (match container memory)
      NODE_OPTIONS: "--max-old-space-size=2048"

      # Database connections
      DATABASE_URL: "postgresql://${LANGFUSE_DB_USER}:${LANGFUSE_DB_PASSWORD}@langfuse-db:5432/langfuse"
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: "false"

      # Redis queue
      REDIS_HOST: langfuse-redis
      REDIS_PORT: 6379
      REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD}

      # Security (CHANGE IN PRODUCTION)
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}

      # S3/MinIO event storage
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/

      # S3/MinIO media storage
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/

      # Feature flags
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "true"
      TELEMETRY_ENABLED: "false"
    networks:
      - lia-network

volumes:
  ssl_certs:  # Shared SSL certificates for HTTPS
  postgres_data:
  postgres_backups:  # pg_dump rotation target (ADR-109) — named volume, see postgres-backup service note
  pgadmin_data:
  redis_data:
  api_venv:
  web_node_modules:
  web_next_build:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  loki_data:
  promtail_positions:
  tempo_data:
  langfuse_db_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  minio_data:
  attachments_data:  # Persistent storage for file attachments (images, PDF)
  meetings_data:  # Meeting recordings (ADR-258): segments, normalized audio, kept audio

networks:
  lia-network:
    driver: bridge
